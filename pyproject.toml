[project]
name = "ai-trader"
version = "0.1.0"
description = "Research, model fitting, point-in-time lake access and LLM orchestration for AI_Trader (hot path lives in the Rust crates)"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "polars>=1.12",
    "pyarrow>=18",
    "duckdb>=1.1",
    "pydantic>=2.9",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "statsmodels>=0.14.4",
    "arch>=7.1",
    "xgboost>=3.4.1",
]

[project.optional-dependencies]
ml = [
    "torch>=2.15.0",
]
viz = [
    "matplotlib>=3.11.2",
]
# vecopen: Vector-Open level signal generator (vecopen/SPEC.md section 8 stack).
vecopen = [
    "polars>=1.12",
    "numpy>=2.1",
    "scipy>=1.14",
    "pyyaml>=6",
    "scikit-learn>=1.9.1",
    "hmmlearn>=0.3.3",
    "lightgbm>=4.7.0",
    "hypothesis>=6.170.15",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_trader", "vecopen/src/vecopen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
