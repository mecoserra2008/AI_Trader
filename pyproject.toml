[project]
name = "ai-trader"
version = "0.1.0"
description = "Research, model fitting, point-in-time lake access and LLM orchestration for AI_Trader (hot path lives in the Rust crates)"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "polars>=1.12",
    "pyarrow>=18",
    "duckdb>=1.1",
    "pydantic>=2.9",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "statsmodels>=0.14.4",
    "arch>=7.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
