  # ---- CFDs: BlackBull Markets via cTrader (baseline.yaml assets.cfd.candidates)
  EURUSD: {convention: fx_ny17, class: fx, roll: none}
  GBPUSD: {convention: fx_ny17, class: fx, roll: none}
  USDJPY: {convention: fx_ny17, class: fx, roll: none}
