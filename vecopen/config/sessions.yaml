  DOGEUSDT: {convention: utc_24h, class: crypto, roll: none}
  ADAUSDT: {convention: utc_24h, class: crypto, roll: none}
  AVAXUSDT: {convention: utc_24h, class: crypto, roll: none}
  LINKUSDT: {convention: utc_24h, class: crypto, roll: none}
  LTCUSDT: {convention: utc_24h, class: crypto, roll: none}
  BCHUSDT: {convention: utc_24h, class: crypto, roll: none}
  DOTUSDT: {convention: utc_24h, class: crypto, roll: none}
  TRXUSDT: {convention: utc_24h, class: crypto, roll: none}
  ATOMUSDT: {convention: utc_24h, class: crypto, roll: none}
  ETCUSDT: {convention: utc_24h, class: crypto, roll: none}
