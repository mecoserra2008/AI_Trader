# The 20 least liquid contracts of config/mm_multi.yaml (H-MM2 variant, user request 2026-11-10): ranked by Bybit 24h
# turnover at 2026-11-10 ~16:40 UTC (0.5 M USD CARV ... 17.6 M USD TSLA). Same quoting rules as mm_multi.yaml; changes:
# 20 symbols instead of 50, slow-link settings (per-symbol tickers, 200-trade flow refresh, stale-top guard 4 s; probe
# 2026-11-09: ~115 KB/s, whole-category tickers 680 KB took 15-52 s), no discretionary biases (XAU / CL / BZ not in the
# list). Changing any value starts a new track record (log it in the diary). NEVER add SPYUSDT (the user's own position).

symbols: [CARVUSDT, MAVIAUSDT, COINUSDT, KASUSDT, ETCUSDT, ATOMUSDT, WIFUSDT, FILUSDT, CRWVUSDT, RENDERUSDT,
          CRVUSDT, MONUSDT, ASTERUSDT, TRXUSDT, WLFIUSDT, DOTUSDT, XLMUSDT, TAOUSDT, GRAMUSDT, TSLAUSDT]
refresh_s: 10
sigma_lookback_min: 240        # slow sigma window (1m klines)
sigma_fast_min: 30             # fast sigma window; sigma used = max(slow, fast)
sigma_floor_bps: 20.0

ask_offset_sigma: 0.45         # sell quote: r * (1 + 0.45 sigma)
bid_offset_sigma: 0.90         # buy quote:  r * (1 - 0.90 sigma)   (falling-knife protection in a sell-off)
requote_sigma: 0.30
min_rest_s: 45

inventory_shift_sigma: 0.60
take_profit_sigma: 0.60
max_short_usd: 25.0            # per symbol after a fill (one lot from flat is always allowed)
max_long_usd: 15.0
max_gross_usd: 400.0           # all symbols
reduce_lots_max: 3             # reducing side: 1 lot near flat -> 3 lots at the cap

flow_window_s: 300
flow_depth_bps: 25
flow_shift_sigma: 0.30
flow_batch: 5                  # symbols whose book + trades are refreshed per tick (rotating)

tox_horizon_s: 60
tox_alpha: 0.30
tox_widen: 1.0
tox_pause_sigma: 0.75

shock_pause_sigma: 3.0         # |mid move| between ticks > 3 x sigma scaled to the tick -> no adding for the cooldown
shock_cooldown_s: 120

level_lookback_h: 48
level_pivot_bars: 3
level_snap_sigma: 0.5
level_buffer_sigma: 0.05

loss_limit_usd: 10.0           # global: fill-ledger P&L since start -> cancel all, flatten all, stop
symbol_loss_limit_usd: 1.5     # per symbol: cancel + flatten that symbol only, stop quoting it
exit_window_min: 30
leverage: 20
order_pause_ms: 80             # throttle between order operations (~12/s max)

# Structural zones (scripts/levels.py, 4h pivots clustered by ATR; refresh before each run). Quotes go just BEYOND zones.
levels_file: data/mm/levels.json


# Portfolio balance (added 2026-11-08 23:10 UTC after the first run filled 38 shorts in 2 min on a bounce):
max_net_usd: 60.0              # signed sum of all inventory; adds that push |net| beyond it pause on every symbol
portfolio_shift_sigma: 0.6     # every reservation leans against the portfolio net by up to 0.6 sigma

# Slow link (added 2026-11-10, see scripts/conn_probe.py):
per_symbol_tickers_max: 25     # <= 25 symbols: one ~1 KB ticker call per symbol instead of the ~700 KB category call
flow_trades_limit: 200         # public trades per flow refresh (venue max 1000; 500 was ~50 KB per call)
max_quote_age_s: 4.0           # a book top older than this (request start -> decision) adds no inventory that tick
