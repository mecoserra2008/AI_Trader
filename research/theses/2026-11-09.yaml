    key_drivers: ["TLT +5.2% in a month", "10y 4.84 vs last auction stop 5.300%", "'Trader angst pivots from inflation to growth'"]
    thesis_md: |
      **Setup.** The front end prices a hike (2y 4.46 vs fed funds 3.88) while the long end rallied ~45 bp in a month (TLT +5.2%): the market is pricing a policy mistake / growth scare. 10-year auction Tue 18:00 UTC (4.5 h after CPI), 30-year Thu 18:00 UTC.

