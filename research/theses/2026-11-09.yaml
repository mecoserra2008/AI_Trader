# Ideas / theses for 2026-11-09 .. 2026-11-13 (written 2026-11-08 ~18:00 UTC, before the week's data).
# Shape matches STOCK SCANNER's POST /api/v1/theses (ThesisCreate). Pushed by scripts/push_theses.py, which records the
# returned thesis_id per `key` in research/theses/stock_scanner_ids.json (idempotent).
# House rules: these are interpretations, not sized trades. Directional edge is NOT established in our research
# (P5; H-TR1-6 failed), so most ideas are event/conditional theses with conviction 1-2. Validated pieces are labelled.
# Levels from Yahoo daily closes on 2026-11-06; macro numbers from FRED / finviz / prediction markets (see calendar).

defaults:
  status: idea
  horizon: 1M            # shortest the app allows; the real horizon is in tags (days-5)
  origin: {kind: manual, ref: "AI_Trader research/theses/2026-11-09.yaml", label: "AI_Trader week ahead W46"}
  review_every_days: 2
  common_tags: [ai_trader, week_2026W46, days-5]

theses:
  - key: W46-macro-cpi-pivot
    title: "CPI is the pivot: a December hike is priced, so a soft core is the asymmetric surprise"
    subject_type: macro_theme
    subject_id: US_CPI_2026-10
    direction: neutral
    conviction: 2
    tags: [macro, inflation, fed, event]
    key_drivers: ["Dec 9 hike ~77-80% priced (Kalshi/Polymarket)", "Consensus Oct CPI +0.3% m/m, core +0.2% (Sep +0.6% / +0.3%; 3.7% / 2.6% y/y)", "VIX 28, VXN 38 (1y high): fear already priced"]
    thesis_md: |
      **Setup.** After +165k payrolls and claims at a 57-year low, prediction markets price a December 9 hike at ~77-80%. Consensus for October CPI is +0.3% headline / +0.2% core (September +0.6% / +0.3%; 3.7% / 2.6% y/y). Equity fear is near 1-year highs (VIX 28, VXN 38).

      **Read.** With the hike mostly priced, a soft core (<= 0.2%) has more room to move markets (hike odds down, relief for duration: QQQ, small caps, TLT, BTC/ETH) than an in-line print. A hot core (>= 0.4%) locks in December and opens the equity-shock tail, made worse if the 10-year auction (18:00 UTC, same day) tails.

      **Evidence.** BTC's 12-16 UTC window on CPI days has been 1.4x as volatile as other weekdays since 2019 (1.7x in 2022-23); P(> 2% move) 28% vs 16%. Whether the *sign* follows the surprise is registered as H-EV1 (forward-only, untested). Treat this as an event-volatility thesis, not a directional call.
    catalysts:
      - {label: "US CPI (Oct), 13:30 UTC", date: 2026-11-10, kind: macro, source: finviz, source_ref: "consensus 0.3% / core 0.2%"}
      - {label: "10-year note auction, 18:00 UTC (prior 5.300%)", date: 2026-11-10, kind: macro, source: finviz}
      - {label: "US PPI (Oct), 13:30 UTC (cons 0.4% / core 0.3%; prior 1.3% / 0.7%)", date: 2026-11-13, kind: macro, source: finviz}
    invalidation:
      - {label: "Core CPI >= 0.4% m/m: hike locked, no asymmetry left", kind: manual, date: 2026-11-10}
      - {label: "Thesis expires after PPI", kind: date, date: 2026-11-13}

  - key: W46-crwv-financing-test
    title: "CoreWeave Q3 (Tue after close) is the AI-financing test for the leveraged edge"
    subject_type: security
    subject_id: CRWV
    direction: neutral
    conviction: 2
    tags: [ai, credit, earnings, event, high_beta]
    key_drivers: ["Bonds ~15-16% yield, CDS-implied default risk reported ~60%", "-43% in a month, -66% from the 52w high", "Neoclouds ~30 bn USD revenue vs ~80 bn USD capex (JPMorgan)"]
    thesis_md: |
      **Setup.** The AI selloff is a financing story at the leveraged edge, not a demand story: neocloud revenue ~30 bn USD vs ~80 bn USD capex (JPMorgan), CoreWeave bonds ~15-16%, a 2026-28 refinancing wall. CRWV is -43% in a month (46.40 vs 52w high 138.25), 200d mean 90.

      **Read.** Q3 results (call Tue Nov 10, 22:00 UTC) decide which way contagion runs. Credible funding / backlog / capex discipline: a sharp short-covering rebound across neoclouds and miners-turned-AI (IREN, CORZ, HUT) and semis. A funding gap, guidance cut or new high-cost debt: AI credit stress spreads (VXN up, HY wider), and the crypto-equities tied to AI follow.

      **Evidence.** Weekly beta of CRWV to the AI factor (NVDA orthogonalised to BTC) 1.40 (t 4.1) over 52 weeks; BTC explains ~3% of its variance. Event thesis: avoid holding size into the print; the direction is unknown.
    catalysts:
      - {label: "CoreWeave Q3 2026 results call, 22:00 UTC", date: 2026-11-10, kind: earnings, source: "CoreWeave IR", source_ref: "investors.coreweave.com"}
      - {label: "Applied Materials Q4 FY26, 21:30 UTC", date: 2026-11-12, kind: earnings, source: "AMAT IR"}
      - {label: "Nvidia Q3 FY27, 22:00 UTC", date: 2026-11-17, kind: earnings}
    invalidation:
      - {label: "Below the 10-day low 40.58: market rejects the print", kind: price_below, level: 40.58}
      - {label: "Above the 10-day high 64.39: financing fear unwinds", kind: price_above, level: 64.39}

  - key: W46-smh-bear-structure
    title: "Semis broke weekly structure twice; breaks are usually bought, except in Fed-tightening windows"
    subject_type: security
    subject_id: SMH
    direction: neutral
    conviction: 2
    tags: [ai, semis, structure, regime]
    key_drivers: ["Weekly structure breaks Jul 17 and Oct 16, no new high since July", "-31% from the 52w high, -11% vs the 200d mean", "Hike ~80% priced: the 2018/2022 analog"]
    thesis_md: |
      **Setup.** SMH 463.96: -31% from its 52w high (671.83), below its 200d mean (521.76), two weekly breaks of structure (Jul 17, Oct 16) with lower highs: a semis bear market.

      **Base rate (2015-2026, n = 22 breaks).** 13 weeks after a weekly break the median return was +6.8% (68% up) and a new high came within a median 8.5 weeks. The failures clustered in Fed-tightening windows (2018-10, 2021-12, 2022), with -10% to -30% further. With a hike ~80% priced, this is the analog to respect, though inflation (3.7%) is far milder than 2022's 7-9%. The tightening conditioning is post hoc on n ~ 5 and inside the model's training data: an observation, not a belief.

      **Read.** Neutral until the AI catalysts (CoreWeave Tue, AMAT Thu, NVDA Nov 17). A reclaim of the 200d mean would say the break was bought, as usual; a loss of the 10-day low says the tightening analog is in play.
    catalysts:
      - {label: "CoreWeave Q3", date: 2026-11-10, kind: earnings}
      - {label: "Applied Materials Q4 FY26 (WFE / China guide)", date: 2026-11-12, kind: earnings}
      - {label: "Nvidia Q3 FY27", date: 2026-11-17, kind: earnings}
      - {label: "US CPI (Oct)", date: 2026-11-10, kind: macro}
    invalidation:
      - {label: "Reclaims the 200d mean (~522): break bought, bear read wrong", kind: price_above, level: 522.0}
      - {label: "Loses the 10-day low 445.59: tightening analog in play", kind: price_below, level: 445.59}

  - key: W46-iren-ai-beta
    title: "Miners-turned-AI (IREN, CORZ, HUT) trade on AI credit, not on bitcoin"
    subject_type: security
    subject_id: IREN
    direction: neutral
    conviction: 2
    tags: [ai, crypto_bridge, high_beta, event]
    key_drivers: ["Weekly AI-factor beta 1.18 (t 3.3), BTC beta 0.97", "-39% in a month", "3.7 bn USD of convertible notes funding the AI build"]
    thesis_md: |
      **Setup.** Bitcoin miners became AI landlords: hashrate fell in Q1 2026 for the first time since 2020 as sites were retrofitted; IREN, Core Scientific and TeraWulf are heading for ~70% of revenue from AI. IREN 21.64 (-39% in a month), CORZ 11.76 (-23%).

      **Evidence.** 52-week weekly regressions: IREN AI beta 1.18 (t 3.3) and BTC beta 0.97; Core Scientific AI beta 0.70 (t 2.6) with BTC explaining ~5% of variance. They are the highest-beta expression of the CoreWeave outcome; a crypto view doesn't hedge them.

      **Read.** Pair with the CRWV thesis: same catalyst, more beta. If AI credit cracks, convert-funded miners can become forced BTC sellers: a crypto-side risk to watch.
    catalysts:
      - {label: "CoreWeave Q3 (sets the AI-credit tone)", date: 2026-11-10, kind: earnings}
      - {label: "Nvidia Q3 FY27", date: 2026-11-17, kind: earnings}
    invalidation:
