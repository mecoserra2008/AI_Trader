  - key: W46-xasset-chop-not-trend
    title: "Crypto and risk assets: volatile chop, not a trend; alts keep lagging BTC"
    subject_type: macro_theme
    subject_id: CRYPTO_REGIME_W46
    direction: neutral
    conviction: 2
    tags: [crypto, regime, volatility, models]
    key_drivers: ["P(trend week, |7d move| >= 4.93%) ~0.30 = base rate (models lack skill)", "P(vol expansion) 0.41-0.44 vs base 0.33 (weak skill, AUC ~0.69)", "Alts: ~95% below their 30d mean; stablecoins -4.6% in 30 d"]
    thesis_md: |
      **Models (pre-registered, walk-forward, AI_Trader H-TR5/H-TR6).** Probit and XGBoost on 17 state features give P(BTC moves >= 4.93% net over the next 7 days) of 0.32 / 0.33 vs a 0.285 base rate, but both have negative out-of-sample Brier skill, so read it as the base rate (~30%). P(next-week realised vol > its 30-day level) is 0.44 / 0.41 vs 0.33, where the models do have weak skill (AUC ~0.69). Triangulation for a >= 4.93% move: HAR ~20%, DVOL-implied ~38%.

      **Read.** Expect a choppy, event-driven week (CPI, CoreWeave, AMAT; NVDA on the 17th), not a breakout. Validated rule only: on a >= 4-sigma hourly BTC shock, fade it if vol was high, follow it if vol was low (H-S2/S3). In historical analogs that include macro, alts underperformed BTC by ~2.5% over the following week; alts are broadly below their 30-day means and stablecoin supply is shrinking (-4.6% in 30 d). For equities: MSTR / COIN carry BTC beta (1.4 / 1.1), not AI beta.
    catalysts:
      - {label: "US CPI (Oct)", date: 2026-11-10, kind: macro}
      - {label: "CoreWeave Q3", date: 2026-11-10, kind: earnings}
      - {label: "Nvidia Q3 FY27", date: 2026-11-17, kind: earnings}
    invalidation:
      - {label: "BTC weekly close outside 70.3k-81.5k (HAR 2-sigma band): a trend week happened", kind: manual}
      - {label: "Thesis expires", kind: date, date: 2026-11-15}

  - key: W46-geo-chokepoint
    title: "Gulf: chronic chokepoint, receding escalation; the war is a fat tail, rates are the driver"
    subject_type: macro_theme
    subject_id: GULF_CHOKEPOINT_W46
    direction: neutral
    conviction: 2
    tags: [geopolitics, oil, polymarket, positioning, scenarios]
    key_drivers: ["Polymarket: Israel-Iran ceasefire through Nov 30 73.5% (55% a week ago); US invasion by 2027 9.5% (17.5%); oil ATH by YE 7.5% (16.5%)", "Disruption persists: blockade end by Nov 30 13.5% (26.5%); Hormuz normal by Dec 31 7.5%", "Live tail: Saudi East-West pipeline strike by Nov 30 36.5%", "CFTC: WTI managed money 9th pct (light), UST 10y asset managers 99th pct (crowded duration)"]
    thesis_md: |
      **Base case.** Supply friction persists (US blockade of Iran on, Hormuz not normal) while escalation stays contained (Israel-Iran ceasefire odds rising: through Nov 15 90.5%, through Nov 30 73.5%). Oil trades headline spikes that fade, as all last week (WTI ~90 now from ~100); the macro driver of the week is rates (CPI Tue, 10y/30y auctions) and AI credit (CoreWeave Tue).

      **Why the tail matters more than its probability.** Speculative oil positioning is light (NYMEX WTI managed money at the 9th percentile of 3 years) while duration longs are crowded (asset managers' 10y net long at the 99th). An escalation (ceasefire break ~10% by Nov 15; Saudi pipeline strike 36.5% by Nov 30; Bab el-Mandeb 9% by YE) would lift oil from light positioning, push breakevens up, lock the December hike and hit duration, tech and crypto together; energy and gold are the hedges.

      **Prediction markets as signals.** Polymarket's BTC / WTI price-level markets match driftless vol touch probabilities (no directional view); they price tail premia: BTC <= 60k by YE 17.5% vs 8-12% from vol; WTI >= 120 in November 7% vs 1-5%. The geopolitical markets are the informative ones; their lead over prices is registered as H-PM1 (forward).

      **Scenarios Nov 9-13 (judgment):** A chop under a priced hike ~50%; B hawkish / duration squeeze ~20% (hot CPI + weak auctions); C relief ~20% (soft CPI + credible CoreWeave); D Gulf escalation ~10%. Full table: AI_Trader research/narratives/SCENARIOS_W46.md.
    catalysts:
      - {label: "CME reopen Sun 23:00 UTC: first oil price after the weekend tanker strikes", date: 2026-11-08, kind: custom}
      - {label: "US CPI (Oct) 13:30 UTC", date: 2026-11-10, kind: macro}
      - {label: "10-year auction 18:00 UTC", date: 2026-11-10, kind: macro}
      - {label: "Polymarket: Israel-Iran ceasefire through Nov 15 resolves", date: 2026-11-15, kind: custom}
      - {label: "Polymarket: Saudi East-West pipeline strike window closes", date: 2026-11-30, kind: custom}
    invalidation:
      - {label: "Ceasefire-through-Nov-30 odds below 60%, or a strike on the Saudi pipeline", kind: manual}
      - {label: "Blockade-end-by-Nov-30 odds above 30% (de-escalation regime instead)", kind: manual}
      - {label: "Thesis expires", kind: date, date: 2026-11-15}
