      - {label: "Above the 10-day high 28.88", kind: price_above, level: 28.88}

  - key: W46-xle-oil-gap
    title: "Energy as the war / inflation hedge into an oil gap at the Sunday reopen"
    subject_type: security
    subject_id: XLE
    direction: long
    conviction: 2
    tags: [energy, war, hedge, event]
    key_drivers: ["Sunday: three tankers exploded in Hormuz, US strike on a bulk carrier, Houthis target Riyadh", "Oil fell ~12-13% last week; Brent spot 125 -> 107 in a month", "OVX 60 (69th pct)"]
    thesis_md: |
      **Setup.** Headlines escalated over the weekend (three tanker explosions in Hormuz since dawn Sunday, a crew abandoning ship, a US strike on a 'blockade runner', Houthis targeting Riyadh; a record 1.28 bn barrels afloat; US gasoline > 4 USD) while oil prices *fell* last week (WTI ~-12%, Brent ~-13%) and XLE dropped 12% to 61.62, near its 10-day low.

      **Read.** The market has been pricing the war premium *out*; the weekend gives it a reason to price some back in at the CME reopen (Sun 23:00 UTC). XLE is the hedge against the scenario that hurts everything else (oil up -> headline inflation up -> hike locked -> duration down). Hedge thesis, not a forecast of escalation; Oman-Iran talks on resuming navigation are the counter-risk.
    catalysts:
      - {label: "CME reopen, Sun 23:00 UTC (first oil price after the weekend)", date: 2026-11-08, kind: custom}
      - {label: "EIA Short-Term Energy Outlook, 17:00 UTC", date: 2026-11-10, kind: macro}
      - {label: "EIA crude inventories (holiday-delayed), 17:00 UTC", date: 2026-11-12, kind: macro}
    invalidation:
      - {label: "Below the 10-day low 61.21: the market keeps fading the war", kind: price_below, level: 61.21}
      - {label: "Hormuz navigation resumes without obstacles (Oman-Iran talks)", kind: manual}

