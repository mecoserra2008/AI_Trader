# rules from research/plans/2026-11-10_volatility_program.md after its tests are recorded. Rules never size positions.
# 2026-11-10 late: merged rule candidates from the program reports (leverage, vol_tournament, vol_signals, trend_state_space,
# decision_budget, flow_anomaly); grades checked against the recorded verdicts by the orchestrator.
# 2026-11-11: merged Program 2 rule candidates (strategy_map, pnl_decomposition, tradfi_sessions, new_strategies,
# synthetic_robustness, simulator); status follows grade (A/B active, C provisional); R-PX-9 corrected (TradFi perps trade on weekends).
# 2026-11-12: merged microstructure pilot rule candidates (microstructure_laws R-MS-1.., book_spillover renumbered R-MS-11..,
# population_simulator R-SIM-10..); one day of data, so all are grade C / provisional.
# 2026-11-12 23:20 UTC: applied the clear fixes of research/reports/rules_audit_2026-11-12.md (see diary).

rules:
- id: R-VOL-1
  kind: expect
  rule: WHEN in the TradFi weekend window (Fri 17:00 ET to Sun 18:00 ET) THEN expect realised vol of about 0.6-0.8x the Friday sigma estimate
  when: calendar.weekend == true
  then: central (expected) sigma is weekend-scaled (sigma_rb_next, m about 0.57 for BTC)
  scope:
    assets: all
    horizon: weekend
    sides: both
  effect: rv_ratio median < 0.9, > 60% of weekends below 1, both segments
  confidence: A
  evidence:
  - H-W1
  review: a holdout quarter with median rv_ratio > 1
  status: active
- id: R-VOL-2
  kind: prefer
  rule: WHEN setting stops or risk across a weekend THEN use the unshrunk risk sigma, because weekends are jump-prone
  when: horizon spans a weekend
  then: stops and risk use sigma_risk_next (no weekend shrink); only expectations use the weekend-scaled sigma
  scope:
    assets: all
    horizon: 1d-3d
    sides: both
  effect: weekend shrink worsened QLIKE in both segments
  confidence: A
  evidence:
  - H-V2
  review: a shrink variant that wins on QLIKE and tail loss
  status: active
- id: R-VOL-3
  kind: expect
  rule: WHEN a volatility spike or jump has just happened THEN expect the excess variance to decay with a half-life of about 2-3 hours
  when: jump or |z| >= 4 bar within the last few hours
  then: prefer the jump-robust bias-corrected EWMA (robust_bc); the plain EWMA over-forecasts post-jump vol by about 27%
  scope:
    assets: all
    horizon: 1h-24h
    sides: both
  effect: half-life 2-3 h; robust_bc QLIKE -0.05 both segments
  confidence: A
  evidence:
  - H-S4
  - H-V1b
  review: holdout half-life > 6 h
  status: active
- id: R-VOL-4
  kind: prefer
  rule: WHEN forecasting daily risk THEN prefer the multi-scale HAR (1d / 7d / 30d) over a single-lambda EWMA
  when: daily risk budget or 24h horizon
  then: daily risk forecast = vol.har; per-bar sigma = vol.robust_bc
  scope:
    assets: crypto
    horizon: 1d
    sides: both
  effect: QLIKE -0.08 vs EWMA, both segments
  confidence: A
  evidence:
  - H-VCL1
  - H-VM5
  review: refined by R-VOL-20..23 (2026-11-10 tournament)
  status: active
- id: R-VOL-5
  kind: expect
  rule: WHEN a vector candle or an Amihud illiquidity spike appears THEN do not expect extra volatility beyond the robust forecast
  when: vector candle or illiquidity z high
  then: no special vol regime after them
  scope:
    assets: crypto
    horizon: 24h
    sides: both
  effect: no QLIKE gain from adding them
  confidence: A
  evidence:
  - H-VC4
  - H-LC2
  review: a holdout test with a significant gain
  status: active
- id: R-VOL-6
  kind: prefer
  rule: WHEN forecasting 7-day BTC or ETH variance THEN add implied vol (DVOL) to HAR; it helps a little
  when: symbol in BTC, ETH and DVOL available
  then: use DVOL as an extra HAR regressor
  scope:
    assets:
    - BTCUSDT
    - ETHUSDT
    horizon: 7d
    sides: both
  effect: -3% loss in-sample (weak), -19% holdout
  confidence: B
  evidence:
  - H-VCL4
  review: holdout gain disappears
  status: active
- id: R-VOL-7
  kind: expect
  rule: WHEN modelling crypto volatility THEN do not add downside semivariance, BTC vol spillover or compression terms to HAR; none improved forecasts
  when: asset_class == crypto
  then: 'HAR stays plain (log-HAR for crypto 1d, R-VOL-20); the 2026-11-10 panel tests confirmed: no leverage asymmetry (H-LEV2), SHAR no better (H-LEV4), common factor explains alt
    vol but adds no forecast gain (H-VM4)'
  scope:
    assets: crypto
    horizon: 1d
    sides: both
  effect: no QLIKE gain in either segment
  confidence: A
  evidence:
  - H-VCL2
  - H-VCL3
  - H-VCL5
  - H-LEV2
  - H-LEV4
  - H-VM4
  review: H-LEV6 / H-VM6 forward tests
  status: active
- id: R-VOL-8
  kind: expect
  rule: WHEN the v0 regime is in its high-vol state THEN expect next-week realised vol to come in 13-31% further below the EWMA forecast than in low-vol states
  when: regime.vol_state == high
  then: don't plan quotes or stops off plain EWMA after spikes (use robust_bc or HAR); liquidity provision after spikes has the wind at its back, but tails still apply
  scope:
    assets: all
    horizon: 7d
    sides: both
  effect: t -10.9 in-sample, -5.0 holdout, 9 assets
  confidence: A
  evidence:
  - H-RL2
  review: holdout t > -2
  status: active
- id: R-VOL-9
  kind: expect
  rule: WHEN it is the Monday US cash open for a TradFi perp, or the Sunday CME reopen for oil, THEN widen risk expectations, but apply no blanket Monday multiplier to TradFi
  when: calendar.monday_us_open or (oil and sunday_cme_reopen)
  then: TradFi equities are not more volatile per trading day on Mondays; WTI Mondays were 2.3x in the war-weekend holdout. For crypto next-day vol the weekday factor applies (R-ML-1,
    R-DS-2)
  scope:
    assets: tradfi
    horizon: intraday
    sides: both
  effect: mixed by asset and segment
  confidence: C
  evidence:
  - H-DOW2
  - H-W5b
  review: more holdout Mondays
  status: provisional
- id: R-PX-1
  kind: expect
  rule: WHEN a large hourly shock hits a calm market (low vol state) THEN expect continuation; WHEN it hits a volatile market THEN expect reversal
  when: '|z_1h| >= 4 and regime.vol_state'
  then: 'the vol state at shock time decides; shock_regime is the first forward-tested strategy; precedence until H-S3 is recorded: do not fade 2-sigma hourly moves (R-PX-2) - the reversal
    leg in volatile markets is not yet confirmed forward'
  scope:
    assets: crypto
    horizon: 6h-24h
    sides: both
  effect: forward-supported once
  confidence: B
  evidence:
  - H-S2
  review: H-S3 forward result
  status: active
- id: R-PX-2
  kind: avoid
  rule: WHEN an hourly move deviates 2 sigma or more from trend THEN do not fade it; such moves tend to keep going
  when: 1h deviation from trend >= 2 sigma
  then: intraday mean reversion stays off
  scope:
    assets: crypto
    horizon: 1h-24h
    sides: both
  effect: fading loses even before costs
  confidence: B
  evidence:
  - H-T1
  review: a holdout where fading wins net
  status: active
- id: R-PX-3
  kind: expect
  rule: WHEN considering trend-following THEN treat it as a thin edge at best (Sharpe about 0.2-0.3 before the cutoff, negative Jul-Nov 2026), better at 4h than 1h, with no reliable
    way to pick the trending periods
  when: trend signal present
  then: trend is a low-weight baseline sleeve, not a core edge; no walk-forward model selection
  scope:
    assets: crypto
    horizon: 4h-1d
    sides: both
  effect: best zoo variant DSR 0.72 < 0.95; ensemble +0.33 in-sample, negative holdout
  confidence: B
  evidence:
  - H-X2b
  - H-TR1
  - H-TR2
  - H-TR3
  - H-TR4
  review: holdout ensemble Sharpe > 0.5 over 6 months
  status: active
- id: R-PX-4
  kind: expect
  rule: WHEN price approaches a structural level (vector-candle open, swing pivot, CME gap, swept zone) THEN expect a break slightly more often than a hold
  when: distance to level < 1 sigma
  then: pi_break >= 0.5 by default; levels mark where a move may continue, not where to fade it
  scope:
    assets: all
    horizon: 1h-1d
    sides: both
  effect: break rate 0.52-0.55
  confidence: B
  evidence:
  - H-VZ1
  - H-VZ2
  - H-VZ3
  - H-VC2
  - H-VC3
  - H-GT3
  - H-W4
  review: a level family that holds > 0.55 in holdout
  status: active
- id: R-PX-5
  kind: avoid
  rule: WHEN auction balance (value-area overlap) or the variance ratio says balance or imbalance THEN do not switch between trend and mean reversion on it
  when: market-profile or variance-ratio regime label
  then: value-area and POC levels behave like random-walk levels
  scope:
    assets: crypto
    horizon: 1h-1d
    sides: both
  effect: all four AU rules and RG1 failed
  confidence: B
  evidence:
  - H-AU1
  - H-AU2
  - H-AU3
  - H-AU4
  - H-RG1
  review: '-'
  status: active
- id: R-PX-6
  kind: avoid
  rule: WHEN it is Monday, or the regime cell is known, THEN do not tilt direction on it; there is no Monday drift and regime cells carry no next-week direction
  when: day of week or regime cell
  then: no day-of-week or regime-direction tilts
  scope:
    assets: all
    horizon: 1d-7d
    sides: both
  effect: up minus down 0.03 sigma, t 1.0, 37k obs; Holm-adjusted Monday drift null in 9 assets
  confidence: B
  evidence:
  - H-DOW1
  - H-RL1
  review: '-'
  status: active
- id: R-PX-7
  kind: expect
  rule: WHEN a TradFi asset had a week below -1 sigma THEN expect a slight up-lean on Monday (context only, not tradable)
  when: asset_class == tradfi and last week return < -1 sigma
  then: context only; crypto shows nothing
  scope:
    assets: tradfi
    horizon: 1d
    sides: long
  effect: +0.12 sigma pooled, t 2.3, in-sample only
  confidence: C
  evidence:
  - H-DOW3
  review: holdout events (about 6 a year)
  status: provisional
- id: R-PX-8
  kind: expect
  rule: WHEN a liquidation regime (R9) ends THEN expect high-vol whipsaw next (about 62%), not a clean trend; regime episodes last about 5-7 days
  when: regime.cell == R9 or recently exited
  then: describes the path of the state, not returns
  scope:
    assets: all
    horizon: 1d-7d
    sides: both
  effect: daily stay probability 0.84-0.89; duration dependence z 4.2 in-sample
  confidence: B
  evidence:
  - H-RL3
  review: holdout transition matrix drifts
  status: active
- id: R-PX-9
  kind: avoid
  rule: WHEN it is the weekend THEN do not trade direction from weekend price or volume; weekend moves carry no information about Monday
  when: calendar.weekend == true
  then: no weekend directional trades; note Bybit TradFi perps keep trading on weekends at about 0.1-0.15x weekday turnover and 0.25-0.33x hourly |r| (not frozen; corrected 2026-11-11,
    R-TF-7)
  scope:
    assets: all
    horizon: weekend
    sides: both
  effect: W2/W3/W6 not supported in both segments
  confidence: B
  evidence:
  - H-W2
  - H-W3
  - H-W6
  - H-TP1
  review: '-'
  status: active
- id: R-CARRY-1
  kind: expect
  rule: WHEN considering funding carry THEN treat it as a leverage-mania premium that has decayed, not a standing one
  when: funding carry candidate
  then: only as a small overlay scaled by trailing 30d funding (H-C1b forward)
  scope:
    assets: crypto
    horizon: 30d
    sides: both
  effect: 57%/yr in 2021, 0.5% in 2025, -4.8% in 2026 H1
  confidence: B
  evidence:
  - H-C1
  review: H-C1b forward
  status: active
- id: R-AVOID-1
  kind: avoid
  rule: WHEN a candidate is funding contrarian, OI-price divergence, taker-cost relative value, stablecoin growth, VRP direction, pivot-geometry trend or vector-candle continuation THEN
    do not spend capital on it; each failed its test
  when: strategy family in the failed list
  then: skip
  scope:
    assets: all
    horizon: any
    sides: both
  effect: failed in both segments or after costs
  confidence: B
  evidence:
  - H-P1
  - H-P2
  - H-RV1
  - H-RV2
  - H-RV3
  - H-FU1
  - H-FU2
  - H-GT1
  - H-GT2
  - H-VC1
  - H-VC5
  review: a new registered variant
  status: active
- id: R-AVOID-2
  kind: avoid
  rule: WHEN tempted to sell weekend options from Friday morning THEN do not; the premium is real but not harvestable as tested
  when: weekend short-vol candidate
  then: only the US-close entry with band hedging remains (H-OPT4, forward)
  scope:
    assets:
    - BTCUSDT
    - ETHUSDT
    horizon: weekend
    sides: short
  effect: H-OPT1-3 failed in both segments; V2 premium t -17 / -7.7
  confidence: B
  evidence:
  - H-W7
  - H-OPT1
  - H-OPT2
  - H-OPT3
  review: H-OPT4 forward
  status: active
- id: R-EXEC-1
  kind: prefer
  rule: WHEN placing a protective stop THEN prefer a resting exchange stop (MarkPrice trigger) over a close-confirmed stop
  when: any position
  then: keep resting stops
  scope:
    assets: all
    horizon: any
    sides: both
  effect: close-confirmed worst -1.9R vs -1.0R
  confidence: B
  evidence:
  - H-X1
  review: '-'
  status: active
- id: R-EXEC-2
  kind: prefer
  rule: WHEN estimating the probability that a target is hit before a stop THEN prefer the jump-aware first-passage model over a Gaussian diffusion
  when: bracket evaluation (p_tp for the net-E[R] gate)
  then: use the jump-diffusion Monte-Carlo p_tp
  scope:
    assets: crypto
    horizon: 1d-7d
    sides: both
  effect: Brier -0.0022 in-sample, -0.0014 holdout (CIs below 0)
  confidence: B
  evidence:
  - H-JD4
  review: holdout CI crosses 0
  status: active
- id: R-EXEC-3
  kind: expect
  rule: WHEN a jump has just occurred THEN expect another within 24 h more often than a constant rate implies (jumps cluster)
  when: jump detected in the last 24 h
  then: use the Hawkes intensity for next-24h jump risk
  scope:
    assets: crypto
    horizon: 24h
    sides: both
  effect: Hawkes beats constant rate in both segments
  confidence: B
  evidence:
  - H-JD2
  review: '-'
  status: active
- id: R-MM-1
  kind: prefer
  rule: WHEN clearing market-making inventory THEN prefer passive resting exits; market-order exits gave back the whole edge
  when: inventory in profit or wind-down
  then: reduce-only quotes at the touch; never a panic market flatten outside the predefined rules
  scope:
    assets: all
    horizon: minutes
    sides: both
  effect: passive exits 95 trips about +1.4 c each, 84-88% winners; market exits 42 trips -0.54 USD (2 mainnet runs)
  confidence: C
  evidence:
  - H-MM2
  review: 10 run-days (H-MM2 success criterion)
  status: provisional
- id: R-MM-2
  kind: expect
  rule: WHEN quoting many crypto contracts at once THEN expect their fills to be one correlated bet (5m return correlations 0.85-0.96), so many same-side fills can arrive in one move
  when: multi-symbol quoting
  then: watch the portfolio net, counting resting adding orders as if filled
  scope:
    assets: crypto
    horizon: minutes
    sides: both
  effect: 38 shorts filled in 2 minutes on 2026-11-08
  confidence: C
  evidence:
  - H-MM2
  review: more runs
  status: provisional
- id: R-LEV-1
  kind: expect
  rule: WHEN a crypto perp had a down day THEN don't expect higher next-day vol than after an up day with the same realised variance; forecast vol from total RV (plain HAR), not from
    the sign of the move
  when: asset_class == crypto; any regime cell; daily or 4h horizon
  then: treat downside and upside semivariance as equally informative; no leverage uplift on vol forecasts, stops or quote widths after down moves
  scope:
    assets: crypto
    horizon: 1d
    sides: both
  effect: b(RS-) - b(RS+) = -0.03 (t -0.28, 2252 dates) in-sample, -0.20 (t -1.57) holdout; 4h -0.003 (t -0.04); median GJR gamma 0.004 (0/23 with t > 2)
  confidence: A
  evidence:
  - H-LEV2
  - H-VCL2
  - research/reports/leverage_2026-11-10.md
  review: re-test if holdout diff t > 2 (leverage appears) or t < -2 (inverse asymmetry becomes significant)
  status: active
- id: R-LEV-2
  kind: expect
  rule: WHEN a TradFi equity/index perp had a down day THEN don't expect the textbook leverage-effect vol rise on Bybit perps; if anything, big up days were followed by more vol in the
    2026 holdout
  when: asset_class == tradfi equity/index perp (TSLA INTC GOOGL AAPL MSTR NVDA MU QQQ SOXL)
  then: no asymmetric vol uplift after down days; use the symmetric vol forecast
  scope:
    assets: tradfi
    horizon: 1d
    sides: both
  effect: holdout b(RS-) 0.23 vs b(RS+) 0.51, diff t -2.11 (levels); log diff t +0.22; with weekday dummies t -1.79; GJR n/a (< 250 days)
  confidence: C
  evidence:
  - H-LEV1
  - research/reports/leverage_2026-11-10.md
  review: holdout dates double (>= 260) or equity GJR becomes estimable (>= 250 days per asset); a diff t > 2 in logs and levels would reinstate the leverage prior
  status: provisional
- id: R-LEV-3
  kind: expect
  rule: WHEN an asset is in a 30-day drawdown (close below its 30d max close by > 1.5 sigma_30d sqrt(30)) THEN don't expect down moves to raise next-day vol more than they do outside
    drawdowns
  when: drawdown flag on (about 8% of crypto days, 6% of TradFi days)
  then: no state-dependent asymmetry adjustment; the drawdown flag is not a vol-forecast input
  scope:
    assets: all
    horizon: 1d
    sides: both
  effect: crypto RS- x D +0.10 (t 0.59) in-sample, +0.03 (t 0.24) holdout; TradFi +0.61 (t 1.28) in-sample, -0.17 (t -2.20) holdout
  confidence: B
  evidence:
  - H-LEV3
  - research/reports/leverage_2026-11-10.md
  review: crypto interaction t > 2 in a fresh holdout year, or TradFi holdout sign turns positive with n_dd_dates >= 100
  status: active
- id: R-LEV-4
  kind: prefer
  rule: WHEN choosing the daily vol model for risk or quoting THEN prefer the plain (log) HAR over a semivariance SHAR for both crypto and TradFi perps
  when: model selection for next-day variance
  then: do not split RV into RS-/RS+; the out-of-sample gain is zero or negative in logs and below 0.5% of QLIKE in levels
  scope:
    assets: all
    horizon: 1d
    sides: both
  effect: 'log form QLIKE(SHAR)-QLIKE(HAR): crypto +0.0025 (t 1.95) in-sample, +0.0022 (t 1.00) holdout; TradFi +0.0056 (t 2.22) holdout; level form crypto -0.0017 (t -2.27)'
  confidence: B
  evidence:
  - H-LEV4
  - research/reports/leverage_2026-11-10.md
  review: the H-VM tournament (vol_tournament_2026-11-10) picks a SHAR variant inside the holdout MCS
  status: active
- id: R-LEV-5
  kind: expect
  rule: WHEN a crypto perp's funding is crowded (funding z vs trailing 90d high) and it has a down day THEN don't expect a liquidation-style vol amplification beyond what the down day
    itself implies; high funding z alone does point to somewhat higher next-day vol
  when: asset_class == crypto; funding_z (latest print vs trailing 90d) known at the decision time
  then: no extra vol uplift for down moves under crowded longs (the interaction is negative); treat funding z > 0 as a mild upward vol tilt (exploratory, not yet registered)
  scope:
    assets: crypto
    horizon: 1d
    sides: both
  effect: RS- x fz -0.050 (t -2.30) in-sample, -0.103 (t -1.23) holdout; fz main effect +0.069 x mean RV per z unit (t 2.36) in-sample, +0.153 (t 2.71) holdout
  confidence: C
  evidence:
  - H-LEV5
  - research/reports/leverage_2026-11-10.md
  review: register a funding-z main-effect hypothesis and test it forward; retire the 'mild upward tilt' clause if that test fails
  status: provisional
- id: R-VOL-20
  kind: prefer
  rule: WHEN forecasting next-day variance for a crypto perp with at least 180 days of history THEN prefer the per-asset log-HAR (vol.har) over robust_bc x 24, EWMA, GARCH-family and
    SV-on-r^2 forecasts
  when: asset_class == crypto and complete daily history >= 180 days; horizon next UTC day
  then: use log-HAR (lognormal back-transform) as the daily risk forecast; robust_bc stays the per-bar sigma
  scope:
    assets: crypto
    horizon: 1d
    sides: both
  effect: QLIKE -12.1% vs level HAR (t -5.0) and -17.6% vs robust_bc x 24 in-sample; holdout -4.5% vs HAR and -18% vs robust_bc x 24; in-sample winner, in the holdout 90% MCS (p 0.17)
  confidence: B
  evidence:
  - H-VM5
  - H-VM2
  - H-VCL1
  - research/reports/vol_tournament_2026-11-10.md
  review: holdout doubles and the holdout MCS shrinks enough to exclude log-HAR, or the HAR-Q/log-HAR ordering flips in the holdout
  status: active
- id: R-VOL-21
  kind: avoid
  rule: WHEN a 5-day (or multi-day) variance forecast is needed THEN don't scale the 1h robust_bc sigma flat over the horizon; use a direct 5d HAR (panel log-HAR for crypto)
  when: horizon >= 2 days, any asset
  then: use the direct 5d panel log-HAR (crypto) or level panel HAR (TradFi); expect robust_bc x 24 per day to be badly calibrated
  scope:
    assets: all
    horizon: 5d
    sides: both
  effect: robust_bc x 24 flat has 1.51x (in-sample) / 2.27x (holdout) the QLIKE of level HAR for crypto, and 8.6x for TradFi (holdout); panel log-HAR is the crypto in-sample 5d winner
    (-15.5% vs HAR) and in the holdout MCS
  confidence: B
  evidence:
  - H-VM5
  - H-VM1
  - research/reports/vol_tournament_2026-11-10.md
  review: a weekday-aware robust_bc term structure closes the gap
  status: active
- id: R-VOL-22
  kind: prefer
  rule: WHEN forecasting daily risk for a short-history perp (TradFi perps, or any listing with < 180 days) THEN prefer the panel HAR pooled over crypto and TradFi (HAR-Q or log form,
    symbol fixed effects) over robust_bc and EWMA
  when: complete daily history < 180 days, or asset_class == tradfi; panel needs >= 30 own training pairs (~60-90 days)
  then: use the panel HAR-Q (p_harq) for TradFi 1d and the level panel HAR for TradFi 5d; panel log-HAR for young crypto listings
  scope:
    assets: tradfi
    horizon: 1d|5d
    sides: both
  effect: 'TradFi holdout QLIKE 0.70x robust_bc x 24 at 1d and 0.21x at 5d (15 symbols, 131 days); crypto < 180 days: panel log-HAR -27.5% vs robust_bc (t -5.2) holdout'
  confidence: C
  evidence:
  - H-VM1
  - H-VM5
  - research/reports/vol_tournament_2026-11-10.md
  review: 'TradFi model choice was made on the holdout: re-test when the TradFi sample doubles; a weekday-aware HAR (proposed H-VM6) may replace it'
  status: provisional
- id: R-VOL-23
  kind: prefer
  rule: WHEN a level (non-log) HAR is used THEN prefer the HAR-Q variant (RV_d coefficient falling with sqrt(RQ_d)) over plain HAR
  when: model family = level HAR, per-asset or panel
  then: add the RV_d x sqrt(RQ_d) term; expect smaller over-reaction after noisy, jumpy days
  scope:
    assets: all
    horizon: 1d|5d
    sides: both
  effect: next-day QLIKE -5.1% (t -6.8) in-sample, -4.7% (t -3.3) holdout per asset; panel -4.2% (t -7.9) / -3.7% (t -4.1); HAR-Q is the crypto 5d holdout leader
  confidence: B
  evidence:
  - H-VM2
  - research/reports/vol_tournament_2026-11-10.md
  review: sign flips in a larger holdout
  status: active
- id: R-VOL-24
  kind: avoid
