# +H-D7F-4), R-TREND-1 (+H-D7F-6), R-WS05-5 (H-STRESS5 contradicts). Each changed rule's review field records what changed and why.
rules:
- id: R-VOL-1
  kind: expect
  rule: WHEN in the TradFi weekend window (Fri 17:00 ET to Sun 18:00 ET) THEN expect realised vol of about 0.6-0.8x the Friday sigma estimate
  when: calendar.weekend == true
  then: central (expected) sigma is weekend-scaled (sigma_rb_next, m about 0.57 for BTC)
  scope:
    assets: all
    horizon: weekend
    sides: both
  effect: rv_ratio median < 0.9, > 60% of weekends below 1, both segments
  confidence: A
  evidence:
  - H-W1
  review: a holdout quarter with median rv_ratio > 1
  status: active
- id: R-VOL-2
  kind: prefer
  rule: WHEN setting stops or risk across a weekend THEN use the unshrunk risk sigma (no weekend or hour-of-week shrink), because weekend lower tails are fatter than the shrunk sigma
    implies
  when: horizon spans a weekend, or the stop sigma comes from a clock / hour-of-week model whose weekend factor is below 1
  then: stops and risk use the weekday-equivalent sigma (floor the clock model's weekend factor at 1 for the stop sigma); only central expectations use the weekend-scaled sigma (R-VOL-1,
    R-VOL-26)
  scope:
    assets: all
    horizon: 1h-3d
    sides: both
  effect: weekend shrink worsened QLIKE in both segments (H-V2; MDE 8-12% of QLIKE, a powered null); with the clock log-HAR-t the weekend 1% lower VaR misses 1.44% of holdout weekend
    hours (Kupiec p 0.003; 0.82% in-sample) and 2.9% of holdout weekend days at 1d (p 0.03); 4h passes
  confidence: A
  evidence:
  - H-V2
  - H-WS04-5
  - research/reports/ws04_2026-11-27.md
  review: a shrink variant that wins on QLIKE and passes weekend lower-tail coverage (Kupiec) in a fresh holdout; merges the WS04 candidate R-WS04-3 (D6, 27 Nov 2026)
  status: active
- id: R-VOL-3
  kind: expect
  rule: WHEN a volatility spike or jump has just happened THEN expect the excess variance to decay within hours (half-life about 2-3 hours at 1h) and prefer a jump-robust forecaster
    over plain EWMA
  when: jump or |z| >= 4 bar within the last few hours
  then: the plain EWMA over-forecasts post-jump vol by about 27% (robust_bc fixes that); at 1h / 4h the clock log-HAR on 5m RV (R-WS04-1) beats robust_bc as well, so robust_bc is the
    fallback, not the target
  scope:
    assets: all
    horizon: 1h-24h
    sides: both
  effect: half-life 2-3 h (H-S4, not FDR-robust); robust_bc QLIKE -0.05 vs plain EWMA in both segments (H-V1b, replicates in the two-stage FDR check); clock log-HAR vs robust_bc -31%
    / -35% QLIKE at 1h (H-WS04-3)
  confidence: A
  evidence:
  - H-S4
  - H-V1b
  - H-WS04-3
  - research/reports/ws04_2026-11-27.md
  review: 'holdout half-life > 6 h; refined 27 Nov 2026 (WS04: robust_bc is outside every 1h MCS)'
  status: active
- id: R-VOL-4
  kind: prefer
  rule: WHEN forecasting daily risk THEN prefer the multi-scale HAR (1d / 7d / 30d) over a single-lambda EWMA
  when: daily risk budget or 24h horizon
  then: daily risk forecast = vol.har (log form, R-VOL-20); per-bar sigma at 1h / 4h = the clock log-HAR (R-WS04-1), robust_bc as the fallback
  scope:
    assets: crypto
    horizon: 1d
    sides: both
  effect: QLIKE -0.08 vs EWMA, both segments (H-VCL1, replicates in the two-stage FDR check); in-sample 90% MCS (universe L, 1d and 5d) = log-HAR family + SV only, the holdout MCS keeps
    22-25 of ~27 specs (a non-rejection, not superiority); log-HAR vs live robust_bc at 1d -22% (t -3.6) in-sample, -11% (t -0.6) holdout
  confidence: A
  evidence:
  - H-VCL1
  - H-VM5
  - H-WS04-3
  - research/reports/ws04_2026-11-27.md
  review: 'refined by R-VOL-20..23; D6 (27 Nov 2026): H-VM5 is cited only for the in-sample MCS eliminations, not for holdout membership (WS01)'
  status: active
- id: R-VOL-5
  kind: expect
  rule: WHEN a vector candle or an Amihud illiquidity spike appears THEN do not expect extra volatility beyond the robust forecast
  when: vector candle or illiquidity z high
  then: no special vol regime after them
  scope:
    assets: crypto
    horizon: 24h
    sides: both
  effect: no QLIKE gain from adding them
  confidence: A
  evidence:
  - H-VC4
  - H-LC2
  review: a holdout test with a significant gain
  status: active
- id: R-VOL-6
  kind: prefer
  rule: WHEN forecasting 7-day BTC or ETH variance THEN add implied vol (DVOL) to HAR; it helps a little
  when: symbol in BTC, ETH and DVOL available
  then: use DVOL as an extra HAR regressor
  scope:
    assets:
    - BTCUSDT
    - ETHUSDT
    horizon: 7d
    sides: both
  effect: -3% loss in-sample (weak), -19% holdout
  confidence: B
  evidence:
  - H-VCL4
  review: holdout gain disappears
  status: active
- id: R-VOL-7
  kind: expect
  rule: WHEN modelling crypto volatility THEN do not add downside semivariance, BTC vol spillover or compression terms to HAR; none improved forecasts
  when: asset_class == crypto
  then: 'HAR stays plain (log-HAR for crypto 1d, R-VOL-20); the 2026-11-10 panel tests confirmed: no detectable leverage asymmetry at 1d (H-LEV2, underpowered: R-LEV-1), SHAR no better
    (H-LEV4), common factor explains alt vol but adds no forecast gain (H-VM4)'
  scope:
    assets: crypto
    horizon: 1d
    sides: both
  effect: 'no QLIKE gain in either segment; leverage asymmetry, non-superiority at 0.10 (H-D7F-4): established in the holdout (b(RS-) - b(RS+) = -0.198, p 0.009) and on the log spec
    in both segments (p 0.007 / 0.004), not on the registered in-sample level spec (-0.032, SE 0.115, p 0.13); borderline A: read strictly (both segments on the registered cell) the
    leverage part is B'
  confidence: A
  evidence:
  - H-VCL2
  - H-VCL3
  - H-VCL5
  - H-LEV2
  - H-LEV4
  - H-VM4
  - H-D7F-4
  - research/reports/d7f_2026-11-28.md
  review: 'H-LEV6 / H-VM6 forward tests; D7F merge (28 Nov 2026): kept A, borderline (H-D7F-4: the in-sample level-spec equivalence is not established, p 0.13); re-grade the leverage
    part to B if a fresh window does not establish it'
  status: active
- id: R-VOL-8
  kind: expect
  rule: WHEN the v0 regime is in its high-vol state THEN expect next-week realised vol to come in 13-31% further below an EWMA forecast than in low-vol states; against a log-HAR forecast
    expect no vol-state difference
  when: regime.vol_state == high
  then: 'the effect is EWMA''s missing mean reversion, not a property of the v0 labeller: with a log-HAR sigma no vol-state correction is needed; don''t plan quotes or stops off plain
    EWMA after spikes'
  scope:
    assets: all
    horizon: 7d
    sides: both
  effect: vs EWMA t -10.9 in-sample, -5.0 holdout, 9 assets (H-RL2); high-minus-low log(RV 7d / EWMA) -1.04 (t -22.5) for v0, -0.92 ghmm3, -0.83 bocpd, same sign in the holdout; vs a
    7-day log-HAR -0.07 (t -1.4) in-sample, -0.09 (t -0.4) holdout (H-WS07-9)
  confidence: A
  evidence:
  - H-RL2
  - H-WS07-9
  - research/reports/ws07_2026-11-27.md
  review: holdout t > -2 against EWMA, or a vol-state term that lowers log-HAR QLIKE; restated 27 Nov 2026 per WS07
  status: active
- id: R-VOL-9
  kind: expect
  rule: WHEN it is the Monday US cash open for a TradFi perp, or the Sunday CME reopen for oil, THEN widen risk expectations, but apply no blanket Monday multiplier to TradFi
  when: calendar.monday_us_open or (oil and sunday_cme_reopen)
  then: TradFi equities are not more volatile per trading day on Mondays; WTI Mondays were 2.3x in the war-weekend holdout. For crypto next-day vol the weekday factor applies (R-ML-1,
    R-DS-2)
  scope:
    assets: tradfi
    horizon: intraday
    sides: both
  effect: mixed by asset and segment
  confidence: C
  evidence:
  - H-DOW2
  - H-W5b
  review: more holdout Mondays
  status: provisional
- id: R-PX-1
  kind: expect
  rule: 'WHEN a large hourly shock hits a calm market (low vol state) THEN expect continuation more often than reversal; WHEN it hits a volatile market THEN don''t expect a tradable
    reversal: the shock fade is retired (R-STRESS-2)'
  when: '|z_1h| >= 4 and regime.vol_state'
  then: the vol state at shock time decides; shock_regime's continuation leg is the forward-tested part (H-S3, harm rule H-WS01-11); the reversal leg is not traded (R-PX-2, R-STRESS-2)
  scope:
    assets: crypto
    horizon: 6h-24h
    sides: both
  effect: 'H-S2 holdout R4 +0.18 sigma (t 1.6, sign only); stress harness (live trade layer): shock_regime +0.058 R [+0.010, +0.108] overall but -0.026 R in the holdout (619 trades,
    data-generated); shock_desk (structural bracket) -0.003 R, holdout -0.136 R; the H-S2 fade after the R-FLOW-2 hour -0.082 R'
  confidence: C
  evidence:
  - H-S2
  - H-STRESS0
  - research/reports/stress_test_2026-11-26.md
  review: 'H-S3 / H-WS01-11 forward result; D6 (27 Nov 2026): B -> C (H-S2 is FDR-fragile and sign-only in the holdout; the sleeve is FRAGILE in the stress harness)'
  status: provisional
- id: R-PX-2
  kind: avoid
  rule: WHEN an hourly move deviates 2 sigma or more from trend THEN do not fade it; such moves tend to keep going
  when: 1h deviation from trend >= 2 sigma
  then: intraday mean reversion stays off
  scope:
    assets: crypto
    horizon: 1h-24h
    sides: both
  effect: 'fading loses even before costs (H-T1); stress harness: zscore_reversion (fades 2-sigma EMA deviations) -0.094 R [-0.129, -0.061] and the H-S2 shock fade after the R-FLOW-2
    hour -0.082 R, negative in both segments'
  confidence: B
  evidence:
  - H-T1
  - H-STRESS0
  - H-STRESS2
  - research/reports/stress_test_2026-11-26.md
  review: a holdout where fading wins net
  status: active
- id: R-PX-3
  kind: expect
  rule: WHEN considering trend-following THEN treat it as a fragile, thin edge (4h better than 1h) with no reliable way to pick the trending periods, the variants or the side
  when: trend signal present (zoo ensemble, tsmom, ema_stack, donchian and kin)
  then: 'trend is a low-weight baseline sleeve, not a core edge: zoo_ew about +0.28 R per closed trade [-0.02, +0.70] on the D7b harness (one-sided P(mean <= 0) 0.04), holdout +0.08
    R on 131 closed trades (H-WS16-13 one-sided p 0.45); about 5 trades a month on the live engine; no walk-forward model selection and no long-only restriction (the paying side flips
    with the market phase)'
  scope:
    assets: crypto
    horizon: 4h-1d
    sides: both
  effect: 'D7b stress harness (closed trades, block = max(5 d, p90 holding) 32 d, funding in net R): zoo_ensemble FRAGILE +0.279 R [-0.021, +0.697], P(mean <= 0) 0.037, holdout +0.079
    R on 131 closed trades (the earlier stress verdict used 5-day blocks, open positions marked at the data end and no funding); geo_pivot_bo FRAGILE (closed-trade holdout -0.179 R on
    71); no trend unit SURVIVES and only 4 of 9 stay positive after fees x1.5 and +5 bp in both segments (H-STRESS1 inconclusive); WS16 without funding +0.317 R [-0.004, +0.701], holdout
    +0.099 R (MDE about 1.1 R); 594 of 687 R from 2023-24 entries; 38 variants vs zoo_ew SPA p 0.60, PBO 0.42; H-TR3 / H-TR4 holdout t 0.30 / 0.71 (inconclusive under D7a); no weighting
    is shown to beat 1/N, and equivalence to 1/N is not established either (H-D7F-6, inconclusive in both segments); beats a 1-day-block null (MC p 0.010); longs / shorts +0.11 / +0.22
    (2020-22), +1.59 / -0.14 (2023-24), -0.16 / +0.09 (2025-26H1); 1h trend units +0.03 to +0.09 R, negative at +5-10 bp or in a liquidity drought'
  confidence: B
  evidence:
  - H-X2b
  - H-TR1
  - H-TR2
  - H-TR3
  - H-TR4
  - H-WS16-2
  - H-WS16-11
  - H-WS16-12
  - H-WS16-13
  - H-STRESS0
  - H-STRESS9
  - H-STRESS1
  - H-D7F-6
  - research/reports/ws16_2026-11-27.md
  - research/reports/stress_test_2026-11-26.md
  - research/reports/d7f_2026-11-28.md
  review: 'the H-WS16-15 forward checkpoints (100 / 300 / 1000 closed trades; kill if the mean < -0.30 R at 100 or the one-sided 95% upper bound < 0 at >= 300); D7F merge (28 Nov 2026):
    kept B; forward expectation restated on the D7b harness (zoo_ensemble and geo_pivot_bo stress verdicts FRAGILE: funding -0.037 R per trade moves zoo_ensemble, closed trades move
    geo_pivot_bo); H-TR3 / H-TR4 inconclusive under D7a strengthens ''no reliable way to pick''; H-D7F-6 added'
  status: active
- id: R-PX-4
  kind: expect
  rule: WHEN price approaches a structural level (vector-candle open, swing pivot, CME gap, swept zone, or the prior UTC day's or week's high or low) THEN expect a break slightly more
    often than a hold
  when: distance to level < 1 sigma; for the prior-day / prior-week extremes, the first touch or sweep
  then: pi_break >= 0.5 by default; levels mark where a move may continue, not where to fade it; don't trade the extension either (a few bp against about 11-15 bp of round-trip costs),
    and under the 4-sigma stop cap a stop beyond the prior-day extreme changes nothing
  scope:
    assets: all
    horizon: 1h-1d
    sides: both
  effect: 'break rate 0.52-0.55; prior-day / prior-week high-low first touch or sweep continues +0.15 sigma at 15 min vs placebo levels, the only 4 geometry cells that pass the holdout
    BH (H-GEO9; holdout one-sided p about 0.08 under D7a, so sign only; a tail effect, hit rate = placebo, placebo not distance-matched); every executable version loses -0.07 to -0.22
    R in the holdout (H-GEO16); stop beyond the prior-day extreme -0.002 R [-0.027, +0.020] (H-WS16-5); CME gap fill (H-W4) holdout t 1.70, one-sided p 0.054: inconclusive under D7a,
    not support'
  confidence: B
  evidence:
  - H-VZ1
  - H-VZ2
  - H-VZ3
  - H-VC2
  - H-VC3
  - H-GT3
  - H-W4
  - H-GEO9
  - H-GEO16
  - H-WS16-5
  - research/reports/intraday_geometry_2026-11-26.md
  - research/reports/d7f_2026-11-28.md
  review: 'a level family that holds > 0.55 in holdout; merges the GEO candidate R-GEO-1 (D6, 27 Nov 2026); D7F merge (28 Nov 2026): kept B; H-W4 labelled inconclusive under D7a; the
    core ''break more often than hold'' rests on the contradicted hold hypotheses and H-VC2 (holdout p 0.002)'
  status: active
- id: R-PX-5
  kind: avoid
  rule: WHEN auction balance (value-area overlap) or the variance ratio says balance or imbalance THEN do not switch between trend and mean reversion on it
  when: market-profile or variance-ratio regime label
  then: value-area and POC levels behave like random-walk levels
  scope:
    assets: crypto
    horizon: 1h-1d
    sides: both
  effect: all four AU rules and RG1 failed
  confidence: B
  evidence:
  - H-AU1
  - H-AU2
  - H-AU3
  - H-AU4
  - H-RG1
  review: '-'
  status: active
- id: R-PX-6
  kind: avoid
  rule: WHEN it is Monday, or the regime cell or any fitted regime state is known, THEN do not tilt direction on it; there is no Monday drift and no regime spec carries next-day or next-week
    direction
  when: day of week, v0 cell, or a fitted regime state (HMM, MS-AR, MS-VAR, change point, k-means)
  then: no day-of-week or regime-direction tilts
  scope:
    assets: all
    horizon: 1d-7d
    sides: both
  effect: 'up minus down 0.03 sigma, t 1.0, 37k obs; Holm-adjusted Monday drift null in 9 assets; WS07: state-specific means lower the next-day log score for 13 of 13 specs in-sample
    (t -1.9 to -4.4), holdout gains <= +0.002 nats (t <= 1.6); hour-of-week direction joint p 0.17, in vs out rank rho 0.03 (H-GEO2); H-RL1 holdout t 0.56 (inconclusive under D7a); non-superiority
    at 0.005 nats (H-D7F-5): established in the holdout (every spec''s direction gain < 0.005 nats, IUT p 0.003), not in-sample (v0_cell +0.0070, kmeans9 +0.0054 nats, above the margin
    but not significantly)'
  confidence: B
  evidence:
  - H-DOW1
  - H-RL1
  - H-WS07-5
  - H-GEO2
  - H-D7F-5
  - research/reports/ws07_2026-11-27.md
  - research/reports/intraday_geometry_2026-11-26.md
  - research/reports/d7f_2026-11-28.md
  review: 'a regime or calendar spec whose direction term raises the holdout log score with t > 2; D7F merge (28 Nov 2026): kept B; H-D7F-5 added (holdout equivalence established)'
  status: active
- id: R-PX-7
  kind: expect
  rule: WHEN a TradFi asset had a week below -1 sigma THEN expect a slight up-lean on Monday (context only, not tradable)
  when: asset_class == tradfi and last week return < -1 sigma
  then: context only; crypto shows nothing
  scope:
    assets: tradfi
    horizon: 1d
    sides: long
  effect: +0.12 sigma pooled, t 2.3, in-sample only
  confidence: C
  evidence:
  - H-DOW3
  review: holdout events (about 6 a year)
  status: provisional
- id: R-PX-8
  kind: expect
  rule: WHEN a liquidation regime (R9) ends THEN expect high-vol whipsaw next (about 62%), not a clean trend; regime episodes last about 5-7 days
  when: regime.cell == R9 or recently exited
  then: describes the path of the state, not returns
  scope:
    assets: all
    horizon: 1d-7d
    sides: both
  effect: daily stay probability 0.84-0.89; duration dependence z 4.2 in-sample; holdout ageing z 1.47, one-sided p 0.07 (H-RL3, inconclusive under D7a); the 62% whipsaw-after-R9 share
    and the 5-7 day durations are in-sample descriptions with no registered holdout check
  confidence: C
  evidence:
  - H-RL3
  - research/reports/d7f_2026-11-28.md
  review: 'a registered holdout transition-matrix test (R9 -> next-cell shares and duration dependence); D7F merge (28 Nov 2026): B -> C, its only registered test H-RL3 loses holdout
    support under the one-sided test (pooled age z 1.47, p 0.07)'
  status: provisional
- id: R-PX-9
  kind: avoid
  rule: WHEN it is the weekend THEN do not trade direction from weekend price or volume; weekend moves carry no information about Monday
  when: calendar.weekend == true
  then: no weekend directional trades; note Bybit TradFi perps keep trading on weekends at about 0.1-0.15x weekday turnover and 0.25-0.33x hourly |r| (not frozen; corrected 2026-11-11,
    R-TF-7)
  scope:
    assets: all
    horizon: weekend
    sides: both
  effect: 'W2/W3/W6 not supported in both segments; stress slice: 1h trend entries inside the TradFi weekend lose (tsmom -0.11 R vs +0.08 on weekdays, donchian -0.12 vs +0.13); for the
    4h zoo_ew a weekend entry block changes nothing (+0.012 R [-0.036, +0.061], H-WS16-9)'
  confidence: B
  evidence:
  - H-W2
  - H-W3
  - H-W6
  - H-TP1
  - H-WS16-9
  - research/reports/stress_test_2026-11-26.md
  review: '-'
  status: active
- id: R-CARRY-1
  kind: expect
  rule: WHEN considering funding carry THEN treat it as a leverage-mania premium that has decayed, not a standing one
  when: funding carry candidate
  then: only as a small overlay scaled by trailing 30d funding (H-C1b forward)
  scope:
    assets: crypto
    horizon: 30d
    sides: both
  effect: 57%/yr in 2021, 0.5% in 2025, -4.8% in 2026 H1
  confidence: B
  evidence:
  - H-C1
  review: H-C1b forward
  status: active
- id: R-AVOID-1
  kind: avoid
  rule: WHEN a candidate is funding contrarian, OI-price divergence, taker-cost relative value, stablecoin growth, VRP direction, pivot-geometry trend or vector-candle continuation,
    or a direction call from funding level or percentile, OI change, the long/short ratio, the Coinbase premium, Fear & Greed, 25d skew or DVOL / VRP, THEN do not spend capital on it;
    each failed its test
  when: strategy family in the failed list, or a directional thesis resting on one of the listed positioning / sentiment / implied-vol series
  then: skip; use these series as context only (positioning, crowding, risk-on / risk-off); VRP and DVOL are scale inputs (wider next-day ranges, R-VOL-6), never direction
  scope:
    assets: all
