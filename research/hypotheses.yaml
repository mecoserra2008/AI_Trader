  # ---------------------------------------------------------------- TVTP block (agent TVTP, 2026-11-26)
  # The user's TVTP Markov-switching VAR (tvtp_msvar.py, reviewed copy src/ai_trader/research/tvtp_msvar.py, fixes F1..F13).
  # Frozen design (diary 2026-11-26 "TVTP design frozen before results"), registered before any real-data fit.
  # Common: y = log return / EWMA sigma_{t|t-1}, model input clipped at |y| <= 8 (P&L unclipped); l2 = 1.0, cov_prior = 2,
  # 3 random starts + warm start per refit, max_iter 200, tol 1e-6; every forecast comes from the causal filter with
  # parameters fit on rows < origin (walk_forward), regimes aligned across refits (Hungarian). Segments split at
  # research.knowledge_cutoff. Spec (K in {2,3}, p in {1,2}, Gaussian or Student-t nu=5) chosen once, on the data before
  # the first origin, by validation one-step log score (70/30 chronological split), never by BIC alone.
  # Datasets. M1h: Bybit XAUUSDT / XAGUSDT 1h last, 2026-03-09..2026-11-25, EWMA halflife 24, burn 168 rows; X_extra = ect
  # (log XAU on log XAG, rolling 336-row OLS known at t, z-scored by its rolling sd); z = [ect, rv] with rv = gold log
  # EWMA vol minus its trailing 336-row mean over trailing sd; first origin 2026-05-01, refit every 336 rows, expanding.
  # M1h-macro: M1h plus z += [d5 DFII10, d5 log DTWEXBGS, d5 T10YIE] (daily FRED, value with known_ts <= t, z-scored on an
  # expanding window since 2003). M1d: Bybit 1d, EWMA halflife 10, burn 20, ect expanding (min 20 rows), z = [d5 DFII10,
  # d5 log DTWEXBGS, d5 T10YIE, ect, rv], K=2 p=1 Gaussian fixed, first origin 2026-07-01, refit every 14 rows.
  # Baselines: CTP = same spec with z dropped; VAR = K=1 same p, expanding; RVAR = K=1 rolling (720 rows 1h, 60 rows 1d,
  # 1440 rows 1m). All keep the ect block where the dataset has one.
  H-TVTP0:
    title: "The TVTP MS-VAR recovers a known DGP (synthetic Monte Carlo)"
    statement: "On the user's synthetic DGP (K=2) and a K=3 extension, 50 replications at T=4000: filtered out-of-sample regime accuracy >= 0.85, sign of every true nonzero TVTP z-coefficient recovered in >= 90% of replications, max |CCF error| at lags -3..3 median <= 0.05."
    rationale: "A methodology check before any real-data claim: identification, label degeneracy and the TVTP coefficients."
    test: "tvtp_study mc: T in {1000, 4000}, K in {2, 3}, 50 reps each; truth-aligned (Hungarian) bias / RMSE of A, Sigma, W; filtered (in-sample and on 1000 fresh rows with frozen params) vs smoothed accuracy; Wald coverage of W; init blocks vs dirichlet on a subset."
    success: "Supports iff all three T=4000 criteria hold for K=2 and K=3; contradicts iff any fails for K=2; else inconclusive."
    prior: 0.75
    family: tvtp
    status: proposed
