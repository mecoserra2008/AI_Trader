  # ---------------------------------------------------------------- WMS SELECT (program WMM2, registered 2026-11-27 ~22:30 UTC, before any index, outcome or fit)
  # Which illiquid Bybit USDT perps to quote on weekends, and when. Data: Bybit public 5m klines (REST, delisted perps included where
  # served), 2021-01-02 .. 2026-11-21 weekends; DVOL / BTC funding / OI from the lake; funding and 1d OI of alts from public REST.
  # Common definitions (frozen; code in src/ai_trader/research/wms_select.py):
  #   Weekend W = Sat 00:00 -> Mon 00:00 UTC (576 5m bars); weekend_start = the Saturday. Friday cutoff T_F = Fri 22:00 UTC; Friday-known
  #   = 5m bars closed <= T_F, daily bars closed <= Fri 00:00, funding settled <= T_F, 1d OI with ts + 1 d <= T_F, DVOL with known_ts <= T_F.
  #   Friday window FW = 5m bars opened in [T_F - 7 d, T_F) (2016 bars). Log returns of the last-trade close.
  #   Universe U_W: Bybit USDT linear perpetual, symbolType '' (not innovation, not stock / ETF), Trading or Closed today, not BTC / ETH /
  #   stablecoins / gold tokens, never SPYUSDT; median daily turnover over the 7 complete UTC days before the Friday in [5, 50] M USD;
  #   first daily bar >= 30 days before the Friday; >= 98% of FW and of W 5m bars present; zero-turnover share of FW bars <= 10%.
  #   No spread / depth filter historically (no historical books): select_universe.py's live filters apply only forward.
  #   Indices on FW (and the same definitions on W for persistence; W uses DFA scales <= 96 bars):
  #     vr5_q (q = 2, 12, 48) and vr15_q (q = 4, 16): Lo-MacKinlay overlapping variance ratio on 5m / 15m base returns with the
  #       unbiased estimators; z* = heteroskedasticity-robust z.  ar1_5, ar1_15: OLS AR(1) of 5m / 15m returns, Kendall-corrected
  #       (rho + (1 + 3 rho) / n).  ou_hl: half-life (h) of the 15m log price around the window mean, -ln 2 / ln(1 + b) from
  #       dp_t = a + b p_{t-1} (capped at 1680 h).  dfa: DFA-1 exponent of 5m returns, scales 12..288 bars.  er_1h: Kaufman efficiency
  #       ratio |p_end - p_start| / sum |dp| on 1h closes.  BoS on 15m bars: swing high (low) at bar i if its high (low) is strictly
  #       above (below) the 3 bars on each side, confirmed at the close of bar i + 3; a bullish (bearish) break at bar t when close_t
  #       is above (below) the most recent confirmed, not yet broken swing high (low); a broken swing is consumed. bos_count = breaks in
  #       FW, bos_imb = |bull - bear| / max(1, bull + bear). Variant BoS1h: the same on 1h bars.
  #   Composite S0 (fixed, no fitting): mean over 6 components of the within-weekend normal scores of ranks (Blom) of
  #     -log vr15_4, -log vr15_16, -ar1_15, -dfa, -er_1h, -bos_imb (higher S0 = more mean-reverting, less trending).
  #   Weekend outcomes (5m): O1 vsurp = log(RV_W / F_W), F_W = Friday-known panel log-HAR forecast of RV_W (log RV_W on log RV of the
  #     last 24 h, the 7-day FW and the previous weekend; OLS on FIT symbol-weekends; lognormal back-transform); O2 rtr = log(sum |r| /
  #     |sum r|) (round-trip ratio); O3 mxs = max_t |p_t - p_Sat00| / sqrt(F_W); O4 trend = |sum r| / sqrt(RV_W) (trend leg).
  #   Alt spread s = weekend change of log(P_alt / P_BTC). Segments by weekend_start: llm_in_sample (FIT) < 2026-07-01 <= clean_holdout
  #   < 2026-11-28 <= forward. ICs are Spearman within a weekend (weekends with >= 10 names), averaged over weekends, t from Newey-West
  #   (lag 4) on the weekly series; panels use weekend-clustered SEs. BH within each hypothesis' sub-family; BY over the 13 primaries.
  H-WMS-1:
    title: "The Friday mean-reversion composite S0 persists into the weekend"
    statement: "Across U_W, a name's Friday-window S0 is positively rank-correlated with the same composite computed on its weekend bars."
    rationale: "The user's premise: names with a high mean-reversion index keep it. Part of it is microstructure (tick size, bounce), which persists; part is regime."
    test: "Per-weekend Spearman IC(S0_FW, S0_W); mean over weekends, NW(4) t; panel slope of S0_W on S0_FW with weekend FE, weekend-clustered SE. Per segment."
    success: "Supports iff the FIT mean IC > 0 with t >= 2 and the holdout mean IC > 0; contradicts iff the FIT mean IC <= 0, or the holdout mean IC < 0 with t <= -2; else inconclusive."
    prior: 0.70
    family: wms_select
    status: proposed
  H-WMS-2:
    title: "Which single indices persist from the Friday window into the weekend"
    statement: "For each of the 12 indices (vr5_2, vr5_12, vr5_48, vr15_4, vr15_16, ar1_5, ar1_15, ou_hl, dfa, er_1h, bos_count, bos_imb) the Friday value is positively rank-correlated with its weekend value."
    rationale: "Dossier of each index: which ones carry a persistent name-level property and which are sampling noise."
    test: "As H-WMS-1, per index; BH over the 12 at q 0.05 in FIT."
    success: "Per index: supports iff FIT IC > 0 with BH q < 0.05 and holdout IC > 0; contradicts iff FIT IC <= 0; else inconclusive. The hypothesis supports iff >= 6 of the 12 support."
    prior: 0.60
    family: wms_select
    status: proposed
  H-WMS-3:
    title: "S0 predicts market-maker-friendly weekends: no trend leg, more round trips, smaller excursions"
    statement: "Higher Friday S0 predicts a lower weekend trend ratio O4 (primary), a higher round-trip ratio O2, a lower max excursion O3; O1 (vol surprise) is tested two-sided."
    rationale: "The user's selection rule: quote only names with a high mean-reversion index, excluding the names that trend. O4 ~ sqrt(VR over the whole weekend) x |N(0,1)|, so it is a single noisy draw: expect small ICs."
    test: "Per-weekend Spearman IC(S0, O_k), k = 1..4; mean, NW(4) t; panel OLS with weekend FE and controls (log median turnover, log RV_FW), weekend-clustered SE as robustness. BH over the 4 outcomes."
    success: "Supports iff the FIT mean IC(S0, O4) < 0 with BH q < 0.05 and the holdout IC(S0, O4) < 0, and neither O2 nor O3 is significantly (q < 0.05) of the wrong sign in FIT; contradicts iff the FIT IC(S0, O4) >= 0, or holdout IC(S0, O4) > 0 with t >= 2; else inconclusive."
    prior: 0.35
    family: wms_select
    status: proposed
  H-WMS-4:
    title: "Which single Friday indices predict the weekend trend leg O4"
    statement: "For each of the 12 indices, the Friday value predicts O4 with the sign implied by mean reversion (higher vr / ar1 / dfa / er_1h / bos_imb / ou_hl -> higher O4; bos_count two-sided)."
    rationale: "Tells which components carry the selection signal. The FIT-passing set (BH q < 0.05, expected sign) defines the extra trial S1 = equal-weight composite of those indices, tested once on the holdout."
    test: "Per-weekend Spearman IC(index, O4), mean, NW(4) t, BH over 12 in FIT. S1 holdout IC(S1, O4) reported as an extra, labelled trial."
    success: "Per index: supports iff FIT q < 0.05 with the expected sign and the holdout IC of the same sign; contradicts iff the FIT IC has the opposite sign with q < 0.05; else inconclusive. Hypothesis: supports iff >= 3 indices support."
    prior: 0.35
    family: wms_select
    status: proposed
  H-WMS-5:
    title: "The frozen selection rule (top third of S0) picks weekends with smaller trend legs"
    statement: "Within U_W, names in the top third of S0 have a lower mean O4 (and lower O3, higher O2) than the other two thirds."
    rationale: "Decision value of the rule WMQ will test on replayed books."
    test: "Per weekend, mean O_k(eligible) - mean O_k(rest); mean over weekends, NW(4) t."
    success: "Supports iff the FIT difference in O4 < 0 with t <= -2 and the holdout difference < 0; contradicts iff the FIT difference >= 0; else inconclusive."
    prior: 0.35
    family: wms_select
    status: proposed
  H-WMS-6:
    title: "Weekend breaks of structure in illiquid alts continue (trend) rather than revert"
    statement: "After a weekend BoS (15m, k = 3) the signed log return from the break-bar close is positive at 4 h (primary), also tested at 1 h and to Sunday 24:00; raw and BTC-hedged (alt minus BTC log return); and for the BoS1h variant."
    rationale: "The user tracks breaks of structure. Under a martingale the signed continuation is 0; for a market maker, continuation means pull or skew after a break, reversion means keep quoting."
    test: "Signed return in units of sigma_FW,5m x sqrt(horizon bars); per-weekend mean over events (equal weight per weekend), mean over weekends with NW(2) t; events whose horizon passes Mon 00:00 dropped. BH over 12 = 3 horizons x 2 (raw, hedged) x 2 (15m, 1h). Also in bp vs an 11 bp taker round trip."
    success: "Supports iff the primary (15m, raw, 4 h) FIT mean > 0 with BH q < 0.05 and the holdout mean > 0; contradicts iff the FIT mean < 0 with q < 0.05 (reversion) and the holdout mean <= 0; else inconclusive."
    prior: 0.35
    family: wms_select
    status: proposed
  H-WMS-7:
    title: "BTC has a weekend buyer bias"
    statement: "BTC's mean weekend log return (Sat 00:00 -> Mon 00:00) is > 0; also tested against the same week's weekday rate (Mon 00:00 -> Sat 00:00 log return x 2/5), paired."
    rationale: "The user believes in a general buyer bias on weekends. Prior research (H-W2/H-W3, R-PX-9) found no directional weekend information."
    test: "Mean of weekend log returns, NW(2) t; share positive vs 0.5 (binomial); paired weekend - weekday-rate difference, NW(2) t. Per segment; MDE reported."
    success: "Supports iff the FIT mean > 0 with t >= 2 and the holdout mean > 0; contradicts iff the FIT mean <= 0; else inconclusive."
    prior: 0.25
    family: wms_select
    status: proposed
  H-WMS-8:
    title: "Alts bleed against BTC over weekends"
    statement: "The equal-weight mean over U_W of the weekend alt-minus-BTC log spread s is < 0, and more negative than the same names' spread over the matched weekday window (Tue 00:00 -> Thu 00:00 of the same week, 48 h)."
    rationale: "The user: 'altcoins still suffer'. Survivorship pushes the other way (delisted perps are included where the REST serves them; innovation-zone ones are not)."
    test: "Per-weekend cross-sectional mean and median of s; mean over weekends, NW(2) t; paired weekend - weekday difference. Per segment."
    success: "Supports iff the FIT mean s < 0 with t <= -2 and the holdout mean < 0; contradicts iff the FIT mean >= 0; else inconclusive. The weekday comparison is reported as a secondary result."
    prior: 0.55
    family: wms_select
    status: proposed
  H-WMS-9:
    title: "Weekend idiosyncratic variance is more concentrated in a few names than on weekdays"
    statement: "The share of the cross-sectional sum of squared demeaned spreads (s - mean s) coming from the top 5% names by |s - mean s| is higher on the weekend than on the matched weekday window (Tue 00:00 -> Thu 00:00)."
    rationale: "The user: 'a few thrive and trend hard'. Heavy tails make the share exceed the Gaussian 27.9% anywhere; the weekend-specific claim is the paired comparison."
    test: "Per week share_W - share_weekday on the same names; mean, NW(2) t. Gaussian reference 0.279 reported. Per segment."
    success: "Supports iff the FIT mean difference > 0 with t >= 2 and the holdout difference > 0; contradicts iff the FIT mean difference <= 0; else inconclusive."
    prior: 0.40
    family: wms_select
    status: proposed
  H-WMS-10:
    title: "The weekend cross-section of alt spreads is right-skewed (a few thrive)"
    statement: "The mean over weekends of the cross-sectional skewness (adjusted Fisher-Pearson) of s is > 0."
    rationale: "Bleeding median with a few large winners is right skew; survivorship inflates it, so a pass is weak evidence."
    test: "Per-weekend skewness of s over U_W (>= 10 names); mean, NW(2) t; same on the weekday window for comparison. Per segment."
    success: "Supports iff the FIT mean skew > 0 with t >= 2 and the holdout mean > 0; contradicts iff the FIT mean <= 0; else inconclusive."
    prior: 0.55
    family: wms_select
    status: proposed
  H-WMS-11:
    title: "Friday-known information picks the weekend trenders above chance"
    statement: "A pre-specified logistic model on Friday-known inputs ranks the top-5% |s - mean s| names of each weekend above the rest: AUC > 0.5."
    rationale: "If trenders can be seen early, a market maker can exclude them. Inputs: bos_count, bos_imb, er_1h, last funding rate (per 8 h), |funding|, 7-day log OI change, |last-24h return| / sigma, |7-day spread vs BTC| / sigma, S0, log RV_FW."
    test: "Inputs as within-weekend normal scores; logistic fit on FIT; FIT AUC by leave-one-year-out CV (within-weekend stratified AUC), holdout AUC with the FIT model; weekend block bootstrap 95% CIs (B = 2000). Single-input AUCs reported with BH over the 10."
    success: "Supports iff the FIT CV AUC > 0.5 with the 95% CI above 0.5 and the holdout AUC > 0.5; contradicts iff the FIT CV AUC CI includes 0.5 and its point is <= 0.52; else inconclusive."
    prior: 0.55
    family: wms_select
    status: proposed
  H-WMS-12:
    title: "A Friday-known calm-weekend classifier beats climatology, calibrated"
    statement: "Calm_W = 1 iff BTC's weekend 5m RV is below the median of the previous 52 weekends' BTC weekend RV and no BTC 5m |r| > 5 sigma_FW (sigma_FW = RMS 5m return of the Friday window). A logistic model on Friday-known inputs has a lower Brier score than climatology."
    rationale: "Make markets only on calm weekends. Inputs (BTC, Friday-known): x1 log(RV_FW x 576/2016) - log(median of the previous 52 weekend RVs); x2 log(7 x RV_last24h / RV_FW) (last day vs the week); x3 log DVOL - log(median of the previous 52 Friday DVOLs); x4 last funding rate; x5 7-day log OI change; x6 CPI / NFP / FOMC in the 24 h before T_F; x7 one scheduled Mon-Tue; x8 holiday flag (the weekend after US Thanksgiving; weekend_start in Dec 22-28 or Dec 29-Jan 4)."
    test: "Logistic fit on FIT; leave-one-year-out CV Brier skill vs the training base rate, DM t on per-weekend Brier differences (HAC); holdout Brier skill with the full-FIT model; reliability (5 bins), calibration intercept / slope. Holiday weekends reported as a labelled subset only. Secondary target: BTC vsurp < 0 and no jump."
    success: "Supports iff the FIT CV Brier skill > 0 with DM t >= 2 and the holdout Brier skill > 0; contradicts iff the FIT CV Brier skill <= 0; else inconclusive."
    prior: 0.55
    family: wms_select
    status: proposed
  H-WMS-13:
    title: "Bid-ask bounce makes 1m last-trade returns look mean-reverting in illiquid alts"
    statement: "On the same minutes, the AR(1) of 1m last-trade returns is lower than the AR(1) of 1m mid returns by more than 0.02 (median over U_W-like alts in flow_3s), and the gap shrinks at 5m."
    rationale: "Dossier check: which sampling is safe for the mean-reversion indices. Roll: AR(1) bias ~ -(s^2/4) / (sigma^2 + s^2/2)."
    test: "Lake flow_3s (close = last trade, mid at candle close) rolled to 1m and 5m on days with >= 95% coverage and no trade_deficit hour, linear alts with 24h turnover 5-50 M; per symbol-day AR(1) difference last - mid; median and symbol-clustered bootstrap CI."
    success: "Supports iff the median 1m difference < -0.02 with the CI below 0 and the 5m difference is smaller in magnitude; contradicts iff the 1m CI lies entirely above -0.02; else inconclusive. Segment: pooled (all November 2026)."
    prior: 0.80
    family: wms_select
    status: proposed

  # ---------------------------------------------------------------- WMN NEWS (program WMM2, registered 2026-11-27 ~22:15 UTC)
  # Registered BEFORE any event-study, decay, Hawkes, markout or gate statistic was computed (only data coverage was looked at).
  # Code: src/ai_trader/research/wmn_data.py (sources, tagging, bars), wmn_study.py (detector, event studies, decay, Hawkes,
  # markouts), wmn_gate.py (gate). Frozen definitions (diary "WMN design frozen before results"):
  #   bars = Bybit linear 5m klines (public), r = log close-to-close of consecutive bars; core universe = 58 crypto perps
  #     (wmn_data.CORE) from 2025-01-01; non-core tagged symbols: 5m windows [-50h, +50h]; delisted perps: 5m bars rebuilt
  #     from public.bybit.com trades. FIT / llm_in_sample = known_ts < 2026-07-01; clean_holdout = 2026-07-01 .. 2026-11-27;
  #     weekends from 2026-11-28 are forward.
  #   idiosyncratic return e = r - beta * r_BTC, beta = OLS slope over the previous 7 days of 5m returns (updated daily,
  #     past data only); hour-of-day factor f_h from the previous 30 days (mean |e| at hour h / mean |e|, shrunk n/(n+3));
  #     spot sigma = bipower over the previous 288 bars of e/f (current bar excluded); z = (e/f)/sigma.
  #   primary detector D = |z| > 4.31 (Lee-Mykland, alpha 1% per day, n = 288, as WS05) AND turnover >= 3 x the median of
  #     the previous 288 bars; price-only variant Dp = |z| > 4.31. Episodes: detections within 60 min of the previous one in
  #     the same symbol are merged; episode time = close of its first bar (known then).
  #   precise token events = exchange announcements (bybit_ann except categories launch_promo / contract_update / other /
  #     premarket; okx_ann; kucoin_ann) and HN stories, tagged to a perp symbol, known_ts at <= 1 s precision.
  #     Day-precision events (DefiLlama hacks, Wikipedia spikes) are studied at day resolution only.
  #   event study per event: tau = 0 is the 5m bar containing the anchor (known_ts; day start for day-precision events);
  #     baseline from [-50h, -2h]: beta (OLS), sigma_b^2 = bipower variance of e, turnover median. ARV(a,b) =
  #     log(mean e^2 over (a,b) / sigma_b^2); AV(a,b) = log(mean turnover / baseline median); CAR = sum of e; SCAR = CAR /
  #     (sigma_b sqrt(n)). Placebo = same symbol, anchor - 7 days (same hour of week), dropped if another tagged event of
  #     the symbol lies within 48 h of it. Inference: means with standard errors clustered by UTC anchor date (CR1);
  #     event - placebo paired by event. BH at q = 0.10 within each registered family.
  #   decay: per shock, x_k = e_k^2 / sigma_b^2 for k = 1..576 bars after the shock bar; m(tau) = B + A g(tau), g =
  #     exp(-tau/T) (EXP) or (1 + tau/c)^-p (POW); e_k ~ Student-t(scale sigma_b sqrt(m), nu); log score per shock = mean
  #     over its bars; DM t = mean / day-clustered SE. Persistence ratio PR = mean(x - B_pre) over (4h, 48h] / mean(x - B_pre)
  #     over (5 min, 1h], B_pre = 1 (baseline-relative).
  #   Hawkes: discrete 5m bins, P(D episode start in bin) = 1 - exp(-lambda); lambda = mu * rate_i * h(hour) + alpha
  #     sum_j J_j exp(-beta (k - j)) + a_m sum_j JBTC_j exp(-beta (k - j)) + sum_c gamma_c sum_e exp(-delta (k - k_e)),
  #     c in {exchange, hn, macro}; FIT 2-fold time split for the in-sample OOS score, fit on all FIT for the holdout.
  #   markouts: public trades (archive) per symbol-day; maker-side markout MO(h) = d (p - m(t+h)) / m(t-) x 1e4 bp, d = +1
  #     for a taker buy; m = midpoint proxy (last taker-buy price + last taker-sell price) / 2 over the previous 60 s
  #     (last trade price if one side is missing); h in {1, 10, 60, 300, 1800} s. Controls (past trades only): aligned flow
  #     d x OFI_5m, |OFI_5m|, VPIN_1h (sum |buy - sell| over 12 five-minute buckets / volume), log trade size / trailing
  #     1h median, log RV_1h; symbol fixed effects; weights = inverse sampling probability; SEs clustered by symbol-day.
  #   gate (wmn_gate.py): M_s(t) = 1 + w_s(t) lam_mkt(t) + (1 - w_s(t)) lam_tok,s(t); lam = sum over known events / episodes
  #     of A_cat g_cat(t - known_ts) with A, g fitted on FIT (decay spec chosen by H-WMN-7, per category when >= 30 FIT
  #     shocks, else pooled exogenous); w_s = beta^2 var(r_BTC) / var(r_s) over the previous 7 days. lambda_news = M - 1.
  #     pull = lambda_news >= 3 (predicted sigma >= 2 x normal) OR t in [macro release - 2 min, release); widen =
  #     sqrt(1 + min(lambda_news, 3)) in [1, 2] (multiplies the quoted distance from mid). Parameters frozen in
  #     data/research/wmn/gate_params.json before any holdout gate statistic is computed.
  H-WMN-1:
    title: "The price+volume idiosyncratic jump detector fires after exchange announcements far more often than at random"
    statement: "Of precise exchange-announcement events tagged to a core symbol, the share followed by a D episode on that symbol within 60 min after known_ts is >= 3x the same share for placebo windows (same symbol, 7 days earlier)."
    rationale: "If the endogenous detector is to stand in for news when timestamps are missing, it must respond to the news we can time."
    test: "Recall and placebo rate per segment, lift = ratio; day-clustered SE of the difference; also Dp and the reverse direction (H-WMN-2)."
    success: "Supports iff lift >= 3 and the event - placebo difference has clustered t >= 2.33 in llm_in_sample and lift > 1 in clean_holdout; contradicts iff lift < 1.5 in llm_in_sample."
    prior: 0.6
    family: wmn_detector
    status: proposed
  H-WMN-2:
    title: "Most idiosyncratic information arrival on alts is not labelled by any free news source"
    statement: "Fewer than 25% of D episodes on core alts (BTCUSDT excluded) have a tagged precise token event of that symbol with known_ts in [episode - 2h, episode + 30 min]."
    rationale: "Joulin et al. (2008) find most stock jumps have no news; with free crypto sources coverage is thinner still, so the gate must rely on the endogenous detector."
    test: "Share of episodes explained, per segment, vs the same share for placebo episode times (7 days earlier)."
    success: "Supports iff the explained share < 25% in both segments; contradicts iff >= 50% in llm_in_sample."
    prior: 0.85
    family: wmn_detector
    status: proposed
  H-WMN-3:
    title: "Precise token news raises the token's idiosyncratic variance in the first hour"
    statement: "Pooled precise token events: event - placebo ARV[0, 1h) >= 0.15 (log ratio) with date-clustered t >= 3."
    rationale: "Information arrival should show up as excess variance; the MM's adverse-selection risk scales with it."
    test: "Paired event - placebo mean, CR1 by anchor date, per segment."
    success: "Supports iff diff >= 0.15 with t >= 3 in llm_in_sample and diff > 0 in clean_holdout; contradicts iff diff <= 0 or t < 1 in llm_in_sample."
    prior: 0.7
    family: wmn_event_study
    status: proposed
  H-WMN-4:
    title: "Per-category token event effects (listing, delisting, maintenance, HN story, hack)"
    statement: "For each category with >= 30 llm_in_sample events (bybit listing_spot, bybit delist, x_listing, x_delist, maintenance, hn_story, hack [day]), event - placebo ARV[0,1h), ARV[1h,4h), AV[0,1h) and |CAR|[0,48h) are > 0."
    rationale: "Categories differ in information content; launch promos and contract updates are excluded as low-information."
    test: "Paired event - placebo means, CR1 by date; BH at q = 0.10 over categories x 4 metrics in llm_in_sample; holdout sign check."
    success: "Per category: supports iff at least the ARV[0,1h) test is BH-significant (> 0) in llm_in_sample and > 0 in clean_holdout; contradicts iff all four metrics have diff <= 0 in llm_in_sample. Recorded per segment with the per-category table."
    prior: 0.5
    family: wmn_event_study
    status: proposed
  H-WMN-5:
    title: "Moves on news continue, unlabelled jumps revert"
    statement: "Slope b of CAR(1h,48h) on CAR(0,1h) across events with |SCAR(0,1h)| >= 2: b_news (precise token news) - b_jump (D episodes with no tagged event within [-2h, +30 min]; initial move = e of the episode bar and the next 11 bars) > 0."
    rationale: "Information should be absorbed permanently (continuation or no reversal); liquidity-driven jumps on thin books should partly revert (overreaction)."
    test: "Pooled OLS with a news dummy interaction, CR1 by date, per segment; b_news and b_jump reported."
    success: "Supports iff b_news - b_jump > 0 with t > 2 in llm_in_sample and > 0 in clean_holdout; contradicts iff the difference < 0 with t < -2 in llm_in_sample."
    prior: 0.35
    family: wmn_event_study
    status: proposed
  H-WMN-6:
    title: "Weekend shocks produce a larger variance response than weekday shocks"
    statement: "For precise token events and D episodes pooled, ARV[0,4h) on Sat/Sun (UTC) exceeds weekdays by >= 0.10."
    rationale: "Thinner weekend books (smaller depth) should amplify the same information."
    test: "Difference of means (shock type and category fixed effects), CR1 by date, per segment."
    success: "Supports iff the weekend - weekday difference >= 0.10 with t >= 2 in llm_in_sample and > 0 in clean_holdout; contradicts iff <= 0 in llm_in_sample."
    prior: 0.4
    family: wmn_event_study
    status: proposed
  H-WMN-7:
    title: "Excess variance after shocks relaxes as a power law (Omori), not a single exponential"
    statement: "For (a) precise token news shocks and (b) unlabelled D episodes, POW beats EXP in out-of-sample Student-t log score of the post-shock 5m returns over 48 h."
    rationale: "Lillo-Mantegna (2003) and Sornette et al. find power-law relaxation after shocks; a single exponential (a one-kernel Hawkes) would decay too fast and release the MM too early."
    test: "Per-shock log-score difference POW - EXP; llm_in_sample = 2-fold time split inside FIT; clean_holdout = fit on all FIT; DM t with date-clustered SE. Recorded separately for (a) and (b)."
    success: "Supports iff diff > 0 with t > 2 in llm_in_sample and diff > 0 in clean_holdout for both (a) and (b); contradicts iff diff < 0 with t < -2 in llm_in_sample for either."
    prior: 0.55
    family: wmn_decay
    status: proposed
  H-WMN-8:
    title: "News-driven volatility relaxes faster than the volatility after unlabelled jumps"
    statement: "Persistence ratio PR (mean excess variance over (4h, 48h] / over (5 min, 1h]) is smaller for news-associated shocks (D episodes with a tagged precise event within [-2h, +30 min], plus precise news events with |SCAR(0,1h)| >= 2) than for unlabelled D episodes."
    rationale: "Joulin, Lefevre, Grunberg and Bouchaud (2008): jumps with news relax faster than jumps without news."
    test: "PR_news / PR_endo with a date-cluster bootstrap (B = 2000) 90% CI, per segment."
    success: "Supports iff the ratio < 1 with the 90% CI below 1 in llm_in_sample and ratio < 1 in clean_holdout; contradicts iff the CI lies above 1 in llm_in_sample."
    prior: 0.5
    family: wmn_decay
    status: proposed
  H-WMN-9:
    title: "Exogenous news marks improve a self-exciting Hawkes forecast of idiosyncratic jumps"
    statement: "The Hawkes with exogenous marks (exchange announcements, HN stories, macro releases) has a higher out-of-sample log score per 5m bin than the same Hawkes without them."
    rationale: "If news adds information beyond the self-excitation of past jumps, a news-aware gate is better than a jump-only gate."
    test: "Day-aggregated log-score difference; DM with NW lag 7 days; llm_in_sample by the 2-fold FIT split, clean_holdout fit on all FIT. Branching ratio and the share of episode intensity due to news reported."
    success: "Supports iff diff > 0 with t > 2 in llm_in_sample and diff > 0 in clean_holdout; contradicts iff diff <= 0 in llm_in_sample."
    prior: 0.5
    family: wmn_hawkes
    status: proposed
  H-WMN-10:
    title: "News adds adverse selection for a passive quoter beyond order-flow toxicity"
    statement: "In the markout regression, the coefficient on 'within 60 min after a precise token news event' is <= -1.0 bp at h = 60 s and 300 s, controlling for aligned flow, |OFI_5m|, VPIN_1h, log size and log RV_1h."
    rationale: "The user's question: is weekend MM adverse selection only flow, or also information?"
    test: "Weighted OLS per horizon, symbol FE, CR1 by symbol-day; trades split by segment of the trade date."
    success: "Supports iff the coefficient <= -1.0 bp with t <= -2 at both 60 s and 300 s in llm_in_sample and < 0 at both in clean_holdout; contradicts iff >= 0 at both horizons in llm_in_sample."
    prior: 0.45
    family: wmn_markout
    status: proposed
  H-WMN-11:
    title: "Endogenous jump episodes add adverse selection beyond order-flow toxicity"
    statement: "Same regression: the coefficient on 'within 60 min after a D episode of the symbol' is <= -1.0 bp at h = 60 s and 300 s."
    rationale: "If unlabelled information arrival is the main hazard (H-WMN-2), the jump state should carry the adverse selection that the flow controls miss."
    test: "As H-WMN-10."
    success: "Supports iff the coefficient <= -1.0 bp with t <= -2 at both 60 s and 300 s in llm_in_sample and < 0 at both in clean_holdout; contradicts iff >= 0 at both horizons in llm_in_sample."
    prior: 0.55
    family: wmn_markout
    status: proposed
  H-WMN-12:
    title: "Market-scope events raise market variance (macro releases primary)"
    statement: "For US macro releases (CPI, NFP, FOMC) event - placebo ARV[0,1h) of BTC >= 0.2 with t >= 3; HN market bursts (>= 3 stories on bitcoin / crypto terms within 1 h; known at the 3rd) and hacks >= 100 M USD (day resolution) tested under BH on BTC and the equal-weight alt index."
    rationale: "Market-wide information hits every quoted alt through beta; WS05 found release minutes multiply BTC jump intensity by 76."
    test: "Paired event - placebo means (placebo 7 days earlier), CR1 by date; BH q = 0.10 over the secondary set."
    success: "Supports iff the macro BTC diff >= 0.2 with t >= 3 in llm_in_sample and > 0 in clean_holdout (secondary results reported in metrics); contradicts iff the macro diff <= 0 in llm_in_sample."
    prior: 0.85
    family: wmn_event_study
    status: proposed
  H-WMN-13:
    title: "The frozen news-intensity gate forecasts weekend variance"
    statement: "On weekend minutes (Fri 00:00 - Mon 00:00 UTC) of core alts, the gate's forecast sigma_base^2 x M(t) beats sigma_base^2 for the realised variance of the next 30 min (QLIKE), and realised 30-min variance in pull minutes is >= 2x that in non-pull minutes."
    rationale: "The gate's job is to say when the next minutes are riskier than the quoter's sigma thinks."
    test: "QLIKE difference per weekend, mean and weekend-clustered t; variance ratio pull / non-pull with a weekend bootstrap. sigma_base = PIT bipower over the previous 288 bars x hour factor (the detector's sigma)."
    success: "Supports iff QLIKE diff < 0 with t < -2 and the pull / non-pull ratio >= 2 in clean_holdout (parameters fit on FIT, so llm_in_sample is reported as in-sample only); contradicts iff QLIKE diff > 0 in clean_holdout."
    prior: 0.55
    family: wmn_gate
    status: proposed
  H-WMN-14:
    title: "Gate pull minutes carry worse passive markouts"
    statement: "In the markout sample, trades in gate-pull minutes have maker markouts at 60 s worse than non-pull minutes by >= 2 bp after the same flow controls as H-WMN-10."
    rationale: "A gate that predicts variance is only useful to the MM if it also predicts adverse selection the quoter cannot see in flow."
    test: "Markout regression with a pull dummy in place of the news / jump states; CR1 by symbol-day."
    success: "Supports iff the coefficient <= -2 bp with t <= -2 in clean_holdout days; contradicts iff >= 0 in clean_holdout."
    prior: 0.45
    family: wmn_gate
    status: proposed
  H-WMN-15:
    title: "Forward: the gate's variance forecast keeps its edge on the first four forward weekends"
