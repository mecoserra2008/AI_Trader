    statement: "Slope on the 30d log change of total stablecoin supply (z vs trailing 365 d) is positive at 7d and 30d."
    rationale: "H-FU1 was inconclusive in-sample (t 1.63, NW only) and contradicted in the holdout; DefiLlama is revisable, so even a positive is weak."
