  # ---- KAVAUSDT order-flow scalper (block SCALP; registered 2026-11-15 ~22:05 UTC, BEFORE any shadow trade or evaluation) ----
  # Engine: `atx scalp` (crates/atx/src/scalp.rs), config/scalp_kava.yaml as registered (any parameter change = a new id).
  H-SCALP1:
    title: "A deterministic order-flow scalper on KAVAUSDT (passive entry at the touch, fixed 2R bracket) has positive net R per trade after fees and a conservative fill model"
    statement: >-
      Features on Bybit public WS orderbook.50 + publicTrade, evaluated once per second. OFI_w = sum over the last w s of the
      L1 Cont-Kukanov-Stoikov order-flow imbalance (contracts) of every book update; z(OFI_30) = (OFI_30 - mean) / sd over the
      last 1800 one-second samples (>= 300 samples, else no signal). delta_30 = buy-aggressor minus sell-aggressor volume over 30 s.
      microprice = (bid*ask_qty + ask*bid_qty)/(bid_qty + ask_qty). A sweep = trades of one aggressor side with the same exchange
      timestamp printing at >= 2 distinct prices. ENTRY LONG when, flat and outside the cooldown: spread <= 2 ticks AND
      z(OFI_30) >= 1.5 AND delta_30 > 0 AND microprice > mid AND no sell sweep in the last 10 s; SHORT symmetric (z <= -1.5,
      delta_30 < 0, microprice < mid, no buy sweep). Order: PostOnly limit joining the touch on our side (bid for a long, ask for a
      short) for 0.1-step qty = floor(20 USD / price); cancelled after 20 s unfilled or when z(OFI_30) crosses 0 against the
      trade or the opposite signal fires. STOP (frozen at the signal): long = min(entry - 4 ticks, lowest trade price of the last
      60 s - 1 tick), short symmetric; signals whose stop is > 12 ticks away are skipped. TAKE PROFIT: reduce-only PostOnly at
      exactly entry +/- 2 x stop distance (integer ticks). TIME STOP 5 min: passive exit at the far touch for 30 s, then market.
      FUNDING (8 h, KAVA funding about -1.17 %/8h, shorts pay): no short entry within 11 min of a funding time and any short is
      closed at market at T-5 min; a long is closed at market at T-5 min unless its mid-marked open P&L is >= +1 R (then held
      across and logged; the funding received is booked). Cooldown 30 s after every exit; one position at a time.
    rationale: >-
      User request (2026-11-15): tiny-notional KAVA scalper reading flow and book. OFI (Cont, Kukanov & Stoikov 2014) and taker
      imbalance carry short-horizon price information; the open question is whether it survives a 3.5 bp tick, 2 bp maker /
      5.5 bp taker fees and the adverse selection of passive fills (R-MMR-1). Prior is low for that reason.
    test: >-
      Forward SHADOW run of `atx scalp --mode shadow` (no orders) on live mainnet public data, journal data/journal/scalp/<date>.jsonl.
      Fill model (conservative, pre-declared): a passive order fills only when a trade prints THROUGH its price, or when trades AT
      its price exceed the displayed queue ahead at placement plus our qty (queue ahead only depleted by trades); stop trigger =
      LastPrice (trade print at/through the stop), filled at min(stop - 1 tick, the triggering print) for a long (symmetric short),
      taker fee; TP fills only on a trade-through, maker fee; time-stop passive exit by the same queue rule, else market at the
      touch (taker). Costs: maker 2 bp, taker 5.5 bp, stop slip 1 tick, funding booked at the venue rate. R unit (USD) =
      qty x (|entry - stop| + 1 tick + entry x 2 bp + stop x 5.5 bp), i.e. a plain stop-out is -1 R. Metric: mean net R per FILLED
      trade, 95 % circular block-bootstrap CI (block 5 trades, 10 000 resamples, seed 0). Secondary: fill rate per signal, mean net
      R per signal with unfilled = 0 R, TP-hit rate, exits by kind.
    success: >-
      On the first 30 filled shadow trades (fixed N, evaluated once; confirmatory read on trades 31-100): mean net R > 0 AND the
      95 % block-bootstrap CI lower bound > -0.05 AND the TP-hit rate > the bracket's ex-ante break-even p* = 1 / (1 + W), where W
      is the mean net R of the TP exits (fees included). Anything else = rejected (or inconclusive if < 30 fills).
    segment: "forward_shadow (clean_holdout: data after research.knowledge_cutoff, collected live from 2026-11-15)"
    prior: 0.15
    family: scalp_flow
    status: proposed

  # ---- Rough volatility / Volterra kernels (block RFSV; research agent, registered 2026-11-15 ~23:30 UTC BEFORE any data was read) ----
  # Data: universe L (23 crypto perps). Daily log RV = log sum of squared 5m log returns over the UTC day (Bybit public REST 5m
  # klines, data/research/bos/bars/5m, 2022-01 -> 2026-11-15); hourly log RV = log sum of the twelve 5m squared returns of the hour,
  # deseasonalised by an expanding (point-in-time) hour-of-week mean of log RV. Segments by origin time vs 2026-07-01.
  H-RFSV1:
    title: "Crypto log volatility is rough: the GJR structure function scales with H < 0.5 (about 0.1-0.2), stably across v0 cells"
    statement: >-
      For each universe-L token, m(q, D) = mean |log s_{t+D} - log s_t|^q (s = sqrt(RV)) scales as D^(q H) with q in {0.5, 1, 1.5, 2, 3}
      and D = 1..20 days (daily) or 1..48 hours (hourly, deseasonalised). H = slope of log m(2, D) on log D divided by 2
      (Gatheral, Jaisson & Rosenbaum 2018); the zeta_q = q H linearity check (R^2 of zeta_q on q) is reported.
    rationale: "GJR find H ~ 0.1 for equity indices and FX; if crypto RV is rough, a power-law kernel should forecast log RV better than the HAR cascade."
    test: >-
      Per token and segment: H with a 95% moving-block bootstrap CI (blocks of 30 days / 168 hours, 300 resamples, seed 0). Pooled H =
      median over tokens. Regime stability: m(2, D) computed only over origins t whose own-token daily v0 cell (regimes.label on 1d bars)
      is in each vol state (low / normal / high) and each of the 9 cells (>= 200 increments per D), pooled across tokens.
    success: >-
      Supports iff the pooled daily H < 0.5 with the bootstrap CI upper bound < 0.35 for >= 80% of tokens, in both segments, AND the per-vol-state
      pooled H differ by < 0.1 (stability). Contradicts iff the median H >= 0.4 in either segment. Else inconclusive.
    prior: 0.75
    family: rough_vol
    status: proposed
  H-RFSV2:
    title: "The RFSV power-law-kernel predictor of log RV beats log-HAR out of sample at 1h, 4h and 24h"
    statement: >-
      Primary model RFSV-GJR: E[log RV_{t,h} | F_t] from the GJR (2018) rough predictor, log v_{t+D} ~ cos(H pi)/pi D^(H+1/2) sum_s log v_{t-s} /
      ((s + D) s^(H+1/2)) (discretised, truncated at 500 lags of the grid, weights renormalised to 1), averaged over the h target steps, with H
      estimated on the training fold only (H-RFSV1 estimator) and a QLIKE-optimal level constant c fitted on the training fold
      (forecast F = exp(pred + c)). Secondary RFSV-reg: OLS of log target on [1, power-law-kernel-weighted log RV] with the exponent
      chosen on the training fold. Baselines (same deseasonalised inputs, same refits): log-HAR (OLS of log target on log of the
      1-step, 1-day, 1-week means; constant c), level HAR (OLS), GARCH(1,1)-t on deseasonalised returns (hourly grid) / daily returns
      (daily grid). Horizons: 1h and 4h on the hourly grid (origins every hour / every 4h), 24h on the daily grid (00 UTC origins,
      classic daily RV from 5m). Purged quarterly expanding walk-forward: training targets end >= 1 day before the test quarter,
      first test quarter after >= 365 training days.
    rationale: "Rough-vol literature (GJR 2018, Bennedsen-Lunde-Pakkanen 2022) reports kernel predictors at least matching HAR with fewer parameters; HAR is itself a coarse approximation of a power-law kernel."
    test: >-
      Loss QLIKE on the RV level (RV/F - log(RV/F) - 1) and MSE on log RV (each model's natural log forecast). Diebold-Mariano: loss
      difference RFSV-GJR minus log-HAR averaged over tokens per origin, Newey-West t (Bartlett, lag = max(h, NW auto)); also per-token DM
      counts (t < -2). Holm over the 3 horizons x QLIKE per segment.
    success: >-
      Supports in a segment iff QLIKE(RFSV-GJR) - QLIKE(log-HAR) < 0 with Holm-adjusted p < 0.05 at >= 2 of the 3 horizons and no horizon
      with t > +2. Contradicts iff the difference is >= 0 at every horizon. Else inconclusive. Pooled per the protocol. RFSV-reg and the
      MSE results are reported (secondary, not part of the verdict).
    prior: 0.30
    family: rough_vol
    status: proposed
  H-VOLT1:
    title: "A power-law (Volterra / fractional) kernel of past standardised returns predicts the next return better than EWMA momentum, net of costs"
    statement: >-
      Signal s_t = sum_{k=1..K} w_k z_{t-k+1}, w_k = k^(-beta) / sum k^(-beta) (the fractional-integration kernel family, beta = 1 - d),
      K = 168 bars, z = ret / sigma_risk_prev (robust_bc, look-ahead safe); beta chosen on the training fold from {0.1, 0.3, 0.5, 0.7,
      0.9, 1.1, 1.3, 1.5} by train IC. Baseline EWMA momentum: w_k = lambda^(k-1), half-life chosen on the same folds from
      {1, 2, 4, 8, 16, 32, 64, 128} bars (equal effort). Bars 1h and 4h (lake, market_frame), universe L. Target: the next bar's z (sign
      and size). Trading arm: position sign(s_t) held one bar, entered with a limit at the close (maker 2 bp, filled only if the next
      bar trades through the price, else no position that bar), exit at the next close by limit (maker 2 bp; taker 5.5 + 2 bp slip if
      the exit limit is not traded through), P&L in risk units (ret / sigma).
    rationale: "Rough-vol Volterra representations suggest long-memory kernels; if any drift persistence is power-law shaped, a fractional kernel should beat a single exponential."
    test: >-
      Purged quarterly walk-forward (as H-RFSV2). Per timestamp: cross-token mean of s_t * z_{t+1} / sd, i.e. pooled IC; IC(Volterra) -
      IC(EWMA) NW t over timestamps. Net Sharpe of both trading arms (annualised, per token then equal-weight), paired difference NW t.
    success: >-
      Supports in a segment iff IC difference > 0 with NW t > 2 AND the Volterra arm's net Sharpe > EWMA's and > 0, at >= 1 of the 2
      frequencies. Contradicts iff the IC difference <= 0 at both frequencies or both net Sharpes <= 0. Else inconclusive.
    prior: 0.12
    family: rough_vol
    status: proposed

  # ---- Kalman fair value and dynamic-beta pairs (block KFD; research agent, registered 2026-11-16 ~00:00 UTC BEFORE any KFD result) ----
  # IDs H-KF1 / H-KF2 are taken (trend state space, 2026-11-10), hence KFD. Data: lake 1h bars (universe L, 2020/21-2026), the 5m
  # Bybit public klines cache (data/research/bos/bars/5m, 2022-2026), lake 15m BTC/ETH (2024-01 -> 2026-11-07) with lake flow_bars
  # 15m taker buy/sell volume (BTC/ETH only, 2026-05-11 -> 2026-11-10), and lake flow_3s rolled to 1m (104 perps, 2026-11-07 ->
  # 2026-11-15; delta and L1 OFI). No 1m klines exist in the lake. Segments by entry time vs 2026-07-01.
  # Common execution (all KFD rules): signal at the close of bar t; entry = limit at close_t, filled only if bar t+1 trades THROUGH it
  # (long: low < price; short: high > price), else cancelled; maker 2 bp. Exits: target = limit at the close where the exit condition
  # first holds, filled iff the next bar trades through, else crossed at the next close (taker 5.5 + 2 bp slip); time stop = taker at the
  # close; price stop = resting (single asset: intrabar, worst case first, gap-through at the open) or close-based (pairs), taker.
  # One position per instrument. R unit = stop distance + entry fee + stop fee (a plain stop-out = -1 R). Variant grid for DSR / PBO:
  # k in {1.5, 2, 2.5, 3, 3.5} x time stop {12, 48} bars; primary variant k = 2.5, time stop 12. PBO by CSCV (S = 10 blocks of
  # llm_in_sample time) over the 10 variants; DSR of the primary with N = 10 trials.
  H-KFD1:
    title: "Fading large standardised Kalman fair-value deviations earns positive net R (single asset)"
    statement: >-
      Local-level model on x_t = log close: mu_t = mu_{t-1} + eta_t, x_t = mu_t + eps_t, Var(eta_t) = Q s_t^2, Var(eps_t) = R s_t^2, s_t = the
      robust_bc one-bar-ahead vol known at t-1 (frame.sigma_risk_next lagged; on 5m / 1m the same VolModel without weekend shrink). Steady-
      state gain K and innovation scale S = P + R (vol units) by Gaussian QML on the training fold only (expanding yearly refits, 1-day purge);
      Q = K^2 S, R = (1 - K) S reported. Innovation v_t = x_t - mu_{t|t-1}, z_t = v_t / (s_t sqrt(S)). Rule: z_t >= k -> short, z_t <= -k ->
      long; target exit when z crosses 0; stop 1.5 sqrt(S) s_t (log) beyond the entry; time stop. A local-linear-trend variant (slope state) is
      secondary. Frequencies 1h, 5m (universe L) and 1m (flow_3s, 8 days, clean_holdout only).
    rationale: "User request: a Kalman fair value with order-flow confirmation. Prior is low: hourly deviations continue (H-T1), 1h mean reversion loses (R-MAP), and a steady-state KF is an EWMA."
    test: "Net R per trade, per-day mean, NW t; DSR (N = 10) and PBO over the grid; per own-token v0 cell table (4h cell at entry, 1h bars only)."
    success: >-
      Supports in a segment iff the primary variant's mean net R > 0 with NW t > 2 at >= 1 frequency, with DSR > 0.95 and PBO < 0.5 (in-sample
      grid). Contradicts iff the primary mean net R <= 0 at every frequency. Else inconclusive. Pooled per the protocol.
    prior: 0.10
    family: kalman_fair_value
    status: proposed
  H-KFD2:
    title: "Fading the standardised innovation of a dynamic-beta Kalman pairs filter earns positive net R on the most correlated liquid pairs"
    statement: >-
      Kalman regression log P_A = alpha_t + beta_t log P_B + e_t, (alpha, beta) random walks with Q = diag(q_a, q_b), Var(e) = R, MLE on the
      training fold only (Gaussian, 1h: data < 2025-01-01; 5m: the last 120 days before 2025-01-01). Spread = log P_A - beta_t log P_B - alpha_t
      (log ratio); z = innovation / sqrt(S_t). Rule: z >= k -> short A / long beta B (notional 1 : beta), z <= -k the reverse; target z crosses 0;
      stop when the spread has moved 1.5 sqrt(S_entry) against at a close; time stop. Costs on both legs. Pairs: ETHUSDT/BTCUSDT,
      SOLUSDT/ETHUSDT, and the 6 same-sector universe-L pairs (config/sectors.yaml) with the highest correlation of 1h log returns over
      2023-01-01 .. 2024-12-31 (selection uses training data only).
    rationale: "Classic dynamic-beta pairs filter (log ratio, R-house); RV spreads revert but below costs at taker fees (H-RV1-3); maker entries may change that."
    test: "As H-KFD1 at 1h and 5m (trades pooled over pairs, per-day mean, NW t; DSR / PBO over the same grid)."
    success: "As H-KFD1."
    prior: 0.12
    family: kalman_fair_value
    status: proposed
  H-KFD3:
    title: "An order-flow guardrail (no fade while taker flow pushes in the direction of the deviation) improves the net R of the KF fade"
    statement: >-
      For H-KFD1 primary-variant signals: skip the entry if the taker delta (buy - sell volume) over the last N minutes has the sign of the
      deviation (z >= k and delta > 0, or z <= -k and delta < 0), and, where L1 OFI exists (flow_3s), also if the OFI sum over N has that sign.
      N = 60 min on 15m bars (BTC/ETH flow_bars), 15 min on 1m (flow_3s). Validation variant: additionally require the last N/4 minutes'
      delta to point toward fair value.
    rationale: "User idea: a deviation still pushed by aggressive flow is information, not noise; one that is no longer pushed is the fade."
    test: "Mean net R per trade guarded minus unguarded (and validation minus unguarded), day-block bootstrap 95% CI (2000 resamples, seed 0); per segment where data exists (in-sample = BTC/ETH 2026-05-11 .. 06-30 only)."
    success: >-
      Supports in a segment iff guarded - unguarded > 0 with the CI above 0 and >= 30 guarded trades; contradicts iff the difference <= 0
      with >= 30 guarded trades; else inconclusive.
    prior: 0.30
    family: kalman_fair_value
    status: proposed

