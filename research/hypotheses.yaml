  # ---- Trend moment vs sideways classifiers (registered 2026-11-08 16:50 UTC BEFORE fitting) ----
  # Target (BTC, daily, at each UTC close t): y = 1 ("trend moment") if |log(C[t+7]/C[t])| >= sigma30_t * sqrt(7), where
  # sigma30_t = std of the 30 daily log returns ending at t; else 0 ("sideways"). Secondary target: y2 = 1 if the next-7-day
  # realised vol exceeds sigma30_t ("vol expansion"). Features at t (causal; scripts/regime_context.state_vectors): r7, r30, dd90,
  # efficiency ratios er7/er30, log rv30, log rv7/rv30, log rv30/rv180, log DVOL, DVOL/rv30, F&G, alt breadth below MA30,
  # alt-BTC 30d, stablecoin 30d, funding 7d, log VIX, HY OAS 30d change, SPX 7d. Walk-forward from 2022-06-01: refit every
  # 21 days on rows with t <= fit_date - 8 (purge the 7-day target overlap). Fixed hyper-parameters, no tuning.
  # Metric: Brier skill score (BSS) vs the expanding training base rate; 14-day block bootstrap CI; AUC; reliability table.
  H-TR5:
    title: "A walk-forward probit forecasts 'trend moment' weeks better than the base rate"
    statement: "Probit on z-scored state features (scaler fit on each training window) gives a positive out-of-sample Brier skill score for y (and, secondary, y2)."
    rationale: "Vol clusters and the target is scaled by trailing vol, so compression/expansion state (rv7/rv30, DVOL premium) should carry some information; direction itself was never forecastable (H-TR3/H-TR4)."
    test: "BSS with 14-day block-bootstrap 90% CI on daily predictions, plus non-overlapping Sunday-only predictions; AUC; segments by target end date vs the knowledge cutoff."
    success: "BSS > 0 with the 90% CI above 0 in llm_in_sample; BSS > 0 in clean_holdout."
    prior: 0.30
    family: regime
    status: proposed
    notes: "Deviation logged 2026-11-08 17:05 UTC before any result was seen: FRED's public CSV carries only ~3 years of ICE BofA HY OAS (license), which truncates the sample to 2023-12. Primary spec = the 17 features without hy_chg30 (sample from 2021-09); the registered 18-feature spec (sample from 2023-12) is reported alongside. XGBoost runs through the native API (same hyper-parameters) because scikit-learn isn't installed."
  H-TR6:
    title: "A walk-forward XGBoost forecasts 'trend moment' weeks better than the base rate and the probit"
    statement: "XGBoost (max_depth 2, 300 trees, eta 0.03, subsample 0.8, colsample 0.8, min_child_weight 10, lambda 1; fixed) on the same features gives a positive out-of-sample BSS for y, and beats H-TR5's probit on the same days."
    rationale: "Nonlinear interactions (e.g. compression x sentiment) may matter; small effective N (~230 independent weeks) makes overfitting the main risk, hence the shallow fixed model."
    test: "as H-TR5; paired Brier difference vs the probit with block bootstrap."
    success: "BSS > 0 with CI above 0 in llm_in_sample and > 0 in holdout; paired Brier gain vs probit > 0."
    prior: 0.20
    family: regime
    status: proposed
    notes: "Same deviation as H-TR5 (primary spec without hy_chg30; registered spec reported alongside)."

