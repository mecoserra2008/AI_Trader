    statement: "Slope on DVOL level and on VRP = (DVOL/100)^2 - trailing 30d realised variance (annualised) is positive at 7d/30d; slope on the DVOL change is non-zero at some horizon."
    rationale: "Bollerslev-Tauchen-Zhou VRP predicts equity returns; H-FU2 contradicted in-sample (t -1.52) and 'supported' on 14 holdout weeks."
    test: "grid cells dvol / ddvol / vrp."
    success: "supports iff a dvol or vrp cell has slope > 0 (or any ddvol cell) with RW p < 0.05, IVX p < 0.05 and holdout sign kept; contradicts iff all have IVX p > 0.10 or the significant dvol/vrp ones are negative; else inconclusive."
