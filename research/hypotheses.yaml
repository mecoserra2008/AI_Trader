    rationale: "If any open works equally well, the effect is generic level-revisit dynamics, not vector-candle liquidity."
    test: "difference of mean excesses, Welch t."
    success: "difference > 0 with t > 2 in-sample; > 0 in holdout."
    prior: 0.35
    family: levels
    status: proposed

