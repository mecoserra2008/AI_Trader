  # day-clustered bootstrap 95% CI (B = 10000). Pass = held mean > 0 with the CI above 0 under BOTH the pro-rata and the FIFO-
  # pessimistic queue, at 150 ms AND 300 ms latency. Baselines: B0 the live mm_illiq20 width (R-MMR-2), and no trading (0).
  # Parameters of each family are chosen on FIT days only (purged CV over weekends); HELD is evaluated once per family. ----
  H-MMW1:
    title: "Level ladders: resting minimum-lot quotes only at structural levels earn positive net P&L on held-out weekend days"
    statement: >-
      Quote only at structural levels (4h pivots clustered by ATR, as of each day's 00:00 UTC, scripts/levels.py logic) lying 1.5-3.5
      sigma_1h from the mid, both sides; after a fill a passive reduce-only take-profit at the mid at fill time and a stop 1.5 sigma_risk
      beyond the level (R-VOL-2, no weekend shrink). Two arms: A1 quotes through liquidation clusters, A2 pulls all quotes for 60 min after
      a liquidation cluster (R-FLOW-2).
    rationale: "User: market make around levels; in R9 high vol, liquidation wicks into levels are frequent and the touch loses to adverse selection (R-MMR-1)."
    test: "Pass rule of the block; plus A2 minus A1 paired per symbol-day (a direct test of R-FLOW-2 for passive fills)."
    success: "Supports iff the chosen arm passes; contradicts iff its held mean <= 0 with the CI below 0; else inconclusive."
    prior: 0.20
    family: mm_weekend
    status: proposed
  H-MMW2:
    title: "Pulling alt quotes when BTC moves cuts adverse selection enough to make weekend quoting positive"
    statement: >-
      Cancel every quote when |BTCUSDT 1 s or 5 s log return| > k x its 1h sigma scaled to that horizon (k chosen on FIT from {2, 3, 4}),
      re-quote after a cooldown (chosen from {10, 30, 60} s), at the B0 width and at 0.5 x the B0 width.
    rationale: "R-MM-2: alt fills are one correlated bet that BTC leads; a pull may avoid the toxic fills, if our latency allows."
    test: "Pass rule of the block; plus paired difference vs the same width without the pull."
    success: "Supports iff it passes; contradicts iff the held mean <= 0 with the CI below 0; else inconclusive."
    prior: 0.20
    family: mm_weekend
    status: proposed
  H-MMW3:
    title: "Pulling the threatened side on order-book imbalance or taker flow makes weekend quoting positive"
    statement: "Withdraw (or widen by 1 sigma) the side against which top-5 book imbalance or 30 s signed taker flow points beyond a FIT-chosen threshold; otherwise the B0 width."
    rationale: "A defensive use of order flow (H-SCALP1 rejected flow as a taker entry, not as a quote filter)."
    test: "Pass rule of the block; plus paired difference vs B0."
    success: "Supports iff it passes; contradicts iff the held mean <= 0 with the CI below 0; else inconclusive."
    prior: 0.15
    family: mm_weekend
    status: proposed
  H-MMW4:
    title: "Joining only short queues, and leaving when the queue behind us thins, makes touch quoting positive on thin alts"
    statement: "Rest at the touch only when the size ahead of us is < q x the median level size (q chosen on FIT from {0.25, 0.5, 1}); cancel when the size behind us falls by > 50% within 2 s."
    rationale: "Queue position decides who fills us; R-MMR-1's touch losses may be the back-of-queue fills."
    test: "Pass rule of the block (the pessimistic queue is decisive here)."
    success: "Supports iff it passes; contradicts iff the held mean <= 0 with the CI below 0; else inconclusive."
    prior: 0.10
    family: mm_weekend
    status: proposed
  H-MMW5:
    title: "Jump-gated quoting (low jump probability and a narrow 4h range only) beats always-on quoting on weekend days"
    statement: "The B0 quoter and the best H-MMW1-4 quoter run only while the field P(jump) is in its bottom tercile and |4h return| < 1 sigma with no shock in 6 h (the H-MMR3 gate); stop when P(jump) rises above its median."
    rationale: "User rule: market make only in low-vol sideways, stop before the next jump; R-MMR-5/6 found the gate mostly stops trading on weekdays."
    test: "Gated minus ungated, paired per symbol-day, held days, both queue models."
    success: "Supports iff gated minus ungated > 0 with the CI above 0 AND the gated arm's held mean > 0; else inconclusive or contradicts as in the block rule."
    prior: 0.15
    family: mm_weekend
    status: proposed
  H-MMW6:
    title: "Portfolio coupling: the multi-symbol weekend book of the best passing variant keeps its edge under joint net and gross caps"
    statement: "Merging all symbols' fills on one clock with the live caps (net 40 USD, gross 80 USD, resting adding orders counted as filled) keeps the held mean net P&L per day > 0."
    rationale: "R-MM-2: the single-symbol replay ignores co-fills; a variant only goes live if it survives them."
    test: "Portfolio pass over the held days; day-clustered bootstrap."
    success: "Supports iff the held mean > 0 with the CI above 0; evaluated only if a variant passes H-MMW1-5."
    prior: 0.30
    family: mm_weekend
    status: proposed

  # ---- Block MACRO: macro forecasting models (user request 2026-11-25 ~00:30 UTC; registered 2026-11-25 ~00:55 UTC before any fit) ----
  # Ids H-MAC1 / H-MAC2 are already taken by the MAC curve-regime block, so this block starts at H-MAC3.
  # Data: FRED/ALFRED all vintages via `atx alt fred` (lake alt_series, known_ts = vintage date + 1 day); unrevised daily
  # market series (target rates, ECB DFR, bills) via ai_trader.narrative.macro (latest CSV, rule_ts). Every model input at
  # forecast origin T uses only rows with known_ts <= T. Model choice (lags / priors / variable sets) by rolling-origin
  # validation inside the TRAINING window only; the TEST window is scored once: origins 2015-01 .. latest, with the COVID
  # block (target months 2020-03 .. 2021-12) reported separately and excluded from the headline. Segment 'pooled' (no LLM
  # decision; the post-cutoff test months are also reported as 'clean_holdout' for completeness). Intervals: Student-t
  # fitted to the training-window validation errors per horizon; calibration = PIT histogram + 80% / 90% coverage.
  H-MAC3:
    title: "M1: a validated AR / small BVAR beats the random walk and the 12-month mean for first-release core PCE m/m at h = 1-3 months"
    statement: "At each origin T = the PCE release date of month m (00:00 UTC, PCE known through m-1), the selected model (AR(p), p in 1..12, or a Minnesota-prior VAR(p), p in 1..6, lambda in {0.05,0.1,0.2,0.5,1,OLS}, on core PCE, core CPI, core finished-goods PPI, production-worker AHE (m/m logs) and the unemployment change) forecasts the first-release log m/m of months m+1, m+2, m+3 with lower RMSE than both benchmarks."
    rationale: "Persistence in core inflation and the CPI/PPI lead should give some skill beyond naive benchmarks; the literature (Atkeson-Ohanian, Faust-Wright) says beating a random-walk-type benchmark at short horizons is hard."
    test: "Selection on validation origins 2003-01 .. 2014-12 (mean RMSE over h = 1..3); test origins 2015-01 .. latest excluding COVID targets; Diebold-Mariano on squared errors with Newey-West HAC (lag h) and the Harvey small-sample correction, one-sided, vs the better benchmark at each h."
    success: "Supports iff test RMSE ratio < 1 with DM one-sided p < 0.05 at >= 2 of the 3 horizons AND 80% interval coverage in [0.70, 0.90] at every h; contradicts iff the ratio >= 1 at all three horizons; else inconclusive."
    prior: 0.35
    family: macro_models
    status: proposed
  H-MAC4:
    title: "M1 nowcast: a CPI/PPI-component bridge beats AR and the random walk for the not-yet-released month (h = 0)"
    statement: "With month m's CPI and PPI already published, a linear bridge of first-release core PCE m/m on CPI components (core goods, shelter, medical services, airfares, services less energy) and PPI components (portfolio management, hospitals, physicians, airline passenger) plus lagged core PCE m/m, variable set chosen on validation, has lower h = 0 RMSE than the selected M1 model and the random walk."
    rationale: "The standard sell-side CPI -> PCE translation: most core PCE components are CPI or PPI prices published two weeks earlier."
    test: "Candidate sets {core CPI}, {core CPI + core PPI}, {CPI components}, {CPI components + PPI health/finance/air}, all with a lagged PCE term; selection on validation origins 2010-01 .. 2014-12 (inputs start 2004-2009); test 2015-01 .. latest excluding COVID; DM as in H-MAC3 (lag 1). The published consensus is only available for the current release (2026-11-25) and is scored forward, not historically."
    success: "Supports iff RMSE ratio vs the better of (selected M1 model at h = 0, random walk) < 1 with DM p < 0.05 and 80% coverage in [0.70, 0.90]; contradicts iff ratio >= 1; else inconclusive."
    prior: 0.70
    family: macro_models
    status: proposed
  H-MAC5:
    title: "M2 Fed: a Taylor-type ordered-logit reaction function on vintage data forecasts next-month target moves better than climatology, persistence and the T-bill market proxy"
    statement: "Monthly ordered logit (cut / hold / hike of the upper target, end of month) on the core PCE y/y gap to 2%, the unemployment gap to CBO NROU (both vintage), NFCI (vintage), the lagged target level and the last move's sign, variable set chosen on validation, has a lower multi-class Brier score at h = 1 month than (a) training-window climatology, (b) persistence P(move | last move), (c) a logistic map of the 3-month bill minus the target midpoint (free market-pricing proxy; futures history is paywalled)."
    rationale: "Policy is inertial and reacts to the inflation and labour gaps; the market proxy is the hard benchmark."
    test: "Training 1990-2014 (ZLB months with target <= 0.25 excluded from the fit and scored separately), validation origins 2003-2014; test origins 2015-01 .. latest excluding 2020-03 .. 2021-12; block bootstrap (12-month blocks) CI of the Brier difference."
    success: "Supports iff the Brier difference vs each of the three benchmarks is < 0 with the 95% CI below 0 vs climatology and persistence and the point estimate < 0 vs the market proxy; contradicts iff it is worse than climatology; else inconclusive."
    prior: 0.30
    family: macro_models
    status: proposed
  H-MAC6:
    title: "M2 ECB: the same reaction-function design on the deposit facility rate beats climatology and persistence"
    statement: "Monthly ordered logit of the ECB DFR move on the euro-area core HICP y/y gap, headline HICP y/y gap, lagged rate level and last move's sign beats climatology and persistence on multi-class Brier at h = 1 month."
    rationale: "Same logic as H-MAC5; the ECB's long negative-rate hold makes it harder (few moves)."
    test: "Training 1999-2014, validation 2008-2014, test 2015-01 .. latest excluding 2020-03 .. 2021-12; block bootstrap as in H-MAC5. HICP from FRED (Eurostat) latest vintage (ALFRED vintages if present), known_ts = month end + 17 days (flash HICP is earlier; conservative)."
    success: "Supports iff the Brier difference vs both benchmarks < 0 with the CI below 0 vs climatology; contradicts iff worse than climatology; else inconclusive."
    prior: 0.25
    family: macro_models
    status: proposed
  H-MAC7:
    title: "M3: adding credit spreads, the real policy rate, financial conditions and Sahm-type labour momentum to the term spread improves the out-of-sample 12-month recession probit"
    statement: "Pseudo out-of-sample (expanding window, labels purged 12 + 12 months for the horizon and the NBER announcement lag), P(NBER recession in months t+1..t+12) from the selected multi-variable probit has lower Brier and higher AUC than the term-spread-only (GS10 - TB3MS) probit, test origins 1990-01 .. 2024-10."
    rationale: "Estrella-Mishkin: the term spread is the best single predictor; Gilchrist-Zakrajsek / Favara: credit spreads add; the Sahm rule captures the labour-market break."
    test: "Candidates (TS), (TS, BAA-10y spread level and 6m change), (TS, Sahm real time), (TS, spread, real FF - core PCE y/y, Sahm), (+ NFCI from 1971); HY OAS is on FRED only from 2023-11, so the BAA - 10y spread is its proxy. Selection by validation log score on origins 1972-01 .. 1989-12; test once; 24-month block bootstrap CI of the Brier difference; COVID (origins 2019-03 .. 2020-04) reported with and without."
    success: "Supports iff the Brier difference < 0 with the 95% CI below 0 AND AUC higher; contradicts iff Brier difference > 0 with the CI above 0; else inconclusive."
    prior: 0.45
    family: macro_models
    status: proposed
  H-MAC8:
    title: "M4: BTC falls after hawkish core-inflation surprises (actual minus model expectation)"
    statement: "BTC's 1-day and 5-day log returns from the UTC close before the release (vol-scaled by the 30-day sd) have a negative slope on the standardised core PCE and core CPI surprise, where the expectation is the M1 model forecast made before the release (consensus history is not available point-in-time; this is a substitute and is weaker)."
    rationale: "Higher inflation -> higher expected policy path -> lower liquidity-sensitive assets."
    test: "Pooled OLS over CPI and PCE releases 2020-04 .. latest with Newey-West SEs; segments split at research.knowledge_cutoff (BTC returns are market outcomes Claude may know)."
    success: "Supports iff slope < 0 with t < -2 in llm_in_sample and the same sign in clean_holdout at either horizon; contradicts iff slope > 0 with t > 2; else inconclusive."
    prior: 0.30
    family: macro_models
    status: proposed
  H-MAC9:
    title: "Forward: the M1 / M2 forecasts for the releases and meetings from 2026-11-25 on are at least as accurate as the published consensus / market pricing"
    statement: "Each forecast is written to research/macro/forecasts/ and committed before the event; scored after: absolute error vs consensus for data releases, log score vs the market-implied probability for meetings."
    rationale: "The only clean test of a macro model built in 2026 is forward."
    test: "Running tally; evaluated after >= 12 scored events."
    success: "Supports iff the mean absolute error (releases) and mean log score (meetings) are no worse than consensus / market with a paired sign test p < 0.1 after >= 12 events; contradicts iff worse with p < 0.1; else inconclusive."
    prior: 0.20
    family: macro_models
    status: proposed

  # ---- Block GEO: intraday structure and market geometry (agent GEO, user request 2026-11-25 ~22:15 UTC; registered
  # 2026-11-25 ~22:30 UTC before any fit). Data: Bybit linear 5m klines, universe L (23 perps), 2022-01-01 .. 2026-11-25
  # (data/research/bos/bars/5m + a public-REST extension in data/research/intraday_geometry/bars), lake funding,
  # lake flow_3s (spread / depth, 2026-11-07 on), lake liquidations (2026-11-08 on), news/events.parquet (CPI / NFP / FOMC
  # scheduled UTC times). Segments split at research.knowledge_cutoff (2026-07-01): llm_in_sample before, clean_holdout
  # after; clean_holdout is read once per hypothesis. sigma_slow = sqrt(trailing 7-day mean of 5m r^2), shifted one bar
  # (causal); every return below is a log return divided by sigma_slow * sqrt(bars). Cross-symbol pooling averages over
  # symbols per timestamp (or clusters by UTC day for events). Design frozen in data/research/intraday_geometry/design.json.
  H-GEO1:
    title: "The hour-of-week shape of crypto variance and volume is stable across months and across the cutoff"
    statement: "The 168-cell (UTC hour x weekday) profile of hourly realised variance and of turnover, each divided by its own trailing 7-day hourly mean (shape only), estimated on llm_in_sample, ranks the clean_holdout profile with Spearman rho >= 0.8, and >= 80% of calendar months have rho >= 0.5 between their 48-cell (hour x weekday/weekend) profile and the leave-that-month-out in-sample profile."
    rationale: "R-VOL-26 / R-VOL-27 use an hour-of-week vol factor; this checks its stability at monthly resolution, for volume too, on 5m-derived data for all 23 perps."
    test: "Per symbol hourly RV = sum of 12 squared 5m log returns; ratio to the trailing 168-hour mean (shifted); pooled = mean over symbols per hour; cell means (winsorised at the 99.5th percentile); Spearman across cells."
    success: "Supports iff rho_holdout >= 0.8 AND month share >= 0.8 for BOTH variance and volume; contradicts iff rho_holdout < 0.5 for either; else inconclusive."
    prior: 0.85
    family: intraday_geometry
    status: proposed
  H-GEO2:
    title: "There is a tradable hour-of-week direction pattern in crypto perps"
    statement: "Mean vol-standardised hourly returns differ across the 168 hour-of-week cells (joint test), the in-sample cell means rank the holdout cell means (Spearman > 0.2, p < 0.05), and a tilt that holds the in-sample sign of every |t| > 2 cell earns positive net R in the holdout after a 15 bp round trip per held hour."
    rationale: "Folk lore of 'Asia dumps, US pumps'; R-AVOID-4 rejected session-level tilts (H-NS3); this is the finer hour x weekday version and the expected answer is noise."
    test: "Pooled (mean over symbols per hour) z-returns; per cell mean and SE across weeks (one observation per week per cell); joint chi-square = sum of t^2 on 168 df (diagonal approximation); rank correlation; tilt P&L in R (1 R = one hourly sigma) net of costs."
    success: "Supports iff the in-sample joint p < 0.01 AND holdout Spearman > 0.2 with p < 0.05 AND the holdout tilt is net positive; contradicts iff the holdout Spearman <= 0 or the holdout tilt is net negative; else inconclusive."
    prior: 0.05
    family: intraday_geometry
    status: proposed
  H-GEO3:
    title: "Scheduled US releases (CPI, NFP 08:30 ET; FOMC 14:00 ET) carry a large, fast-decaying 5m variance spike in crypto"
    statement: "The 5m bar starting at the scheduled release time has mean r^2 / sigma_slow^2 >= 3x that of the same UTC minute on the 20 previous non-event weekdays, and the ratio falls by more than half by the 30-60 minute window, in both segments."
    rationale: "Macro information arrives at known times; the variance is forecastable even if the direction is not."
    test: "Event = CPI / NFP / FOMC scheduled_ts from news/events.parquet (schedule known 7-30 days ahead); per event the pooled (mean over symbols) standardised r^2 for windows [0,5), [5,15), [15,30), [30,60) min divided by the baseline; bootstrap over events (2000 draws) for the 95% CI of the [0,5) ratio."
    success: "Supports iff the [0,5) ratio >= 3 with the CI lower bound >= 1.5 AND the [30,60) ratio < half the [0,5) ratio, in both segments; contradicts iff the [0,5) ratio < 1.5 in either segment; else inconclusive."
    prior: 0.85
    family: intraday_geometry
    status: proposed
  H-GEO4:
    title: "Funding settlements (00/08/16 UTC) carry excess 5m variance beyond the neighbouring top-of-hour bars"
    statement: "The 5m bars [hh:00, hh:05) at hh in {0, 8, 16} have mean standardised r^2 at least 1.2x the [hh:00, hh:05) bars at the neighbouring hours (hh-1, hh+1) of the same day, in both segments."
    rationale: "Funding-driven position adjustment and the funding print; R-ML-10 found no funding-hour gain in the hourly forecast, so a 5m-level effect would be small."
    test: "Pooled over symbols per bar; ratio of means; day-block bootstrap CI (2000 draws). 00 UTC is confounded with the UTC day roll and the Asia open, so 08 and 16 UTC are also reported alone."
    success: "Supports iff the ratio for 08+16 UTC >= 1.2 with CI lower bound > 1 in both segments; contradicts iff the 08+16 ratio < 1.05 in either segment; else inconclusive."
    prior: 0.40
    family: intraday_geometry
    status: proposed
  H-GEO5:
    title: "Price drifts against the funding payer into the settlement and back after it"
    statement: "Signed by -sign(funding rate known one hour before settlement), the pooled vol-standardised return over [-60, 0) min before 00/08/16 UTC is positive (the paying side unwinds into the print), and over [0, +60) min the sign flips."
    rationale: "Funding-avoidance flow (close before the print, reopen after) would push price against the paying side before and toward it after."
    test: "One observation per settlement = mean over symbols of the signed z; Newey-West t (lag 3) over settlements; settlements with |funding| >= 1 bp (8h) form the headline, all settlements are reported too."
    success: "Supports iff the pre-window signed mean > 0 with t > 2 in llm_in_sample AND > 0 with one-sided p < 0.1 in clean_holdout; contradicts iff the in-sample t <= 0 or the holdout sign is opposite; else inconclusive."
    prior: 0.15
    family: intraday_geometry
    status: proposed
  H-GEO6:
    title: "Session opens step up variance, and the US step follows New York time (DST), not a fixed UTC clock"
    statement: "On weekdays without a scheduled release, variance in the 30 min after the US cash open (09:30 ET) is >= 1.5x the 30 min before, in both segments; the step sits at 13:30 UTC in EDT months and 14:30 UTC in EST months (the off-clock ratio at the other UTC time is < 1.2); the London open (08:00 London) and the Asia open (00:00 UTC) steps are reported."
    rationale: "Cash-equity and ETF flow arrives with the US open; if the crypto vol step tracks ET it is a TradFi-session effect, not a clock artefact."
    test: "Per day pooled ratio of sums of standardised r^2 (after / before); mean over days; day-bootstrap CI; release days (CPI / NFP / FOMC) excluded; NYSE holidays not modelled (known simplification)."
    success: "Supports iff the US ratio >= 1.5 with CI lower bound > 1.2 in both segments AND the off-clock ratio < 1.2 in both DST regimes (in-sample); contradicts iff the US ratio < 1.2 in either segment; else inconclusive."
    prior: 0.75
    family: intraday_geometry
    status: proposed
  H-GEO7:
    title: "Month-end (last UTC day, 15:00-16:00 UTC around the London 4 pm fix) carries excess variance and a direction"
    statement: "The 15:00-16:00 UTC hour of the last calendar day of the month has standardised variance >= 1.3x the same hour on other weekdays of the month, and the pooled vol-standardised return of that hour has |t| > 2 in-sample with the same sign in the holdout."
    rationale: "Rebalancing flows at the month-end fix are documented in FX and equities; crypto exposure via ETFs could import them."
    test: "One observation per month; variance ratio of means with a month-bootstrap CI; direction mean and t over months (n ~ 54 in-sample, ~5 holdout)."
    success: "The verdict is the vol part: supports iff ratio >= 1.3 with CI lower bound > 1 in both segments; contradicts iff the vol ratio < 1.1 in either segment; else inconclusive. The direction part (|t| > 2 in-sample, same sign in holdout) is reported in the metrics."
    prior: 0.20
    family: intraday_geometry
    status: proposed
  H-GEO8:
    title: "Spreads widen and depth thins in the loud hours: the hour-of-day spread profile tracks the variance profile"
    statement: "Across the 24 UTC hours, the pooled (median over symbols of per-symbol z-scored profiles) mean spread_bps has Spearman > 0.5 with the variance profile, and depth within 25 bp (bid + ask) has Spearman < -0.5."
    rationale: "Inventory risk: market makers widen when volatility rises; matters for when pegged entries and stops cost the most."
    test: "lake flow_3s (3 s TWA spread, depth_25, close) 2026-11-07 .. 2026-11-25 for the 23 perps, rolled to 5m and hours; day-block bootstrap CI of the correlations. clean_holdout only (no in-sample data exist)."
    success: "Supports iff both correlations pass with bootstrap 90% CIs excluding 0; contradicts iff the spread correlation < 0 or the depth correlation > 0; else inconclusive."
    prior: 0.70
    family: intraday_geometry
    status: proposed
  H-GEO9:
    title: "Some intraday geometry object x event x horizon has a direction effect beyond placebo levels that survives selection and the holdout"
    statement: "In the pre-specified grid of 13 objects (prior-day high/low, prior-day close, prior-week high/low, opening range 15/30/60 min of the Asia/London/US sessions, Asia box 00-08 UTC, session VWAP, anchored VWAP from the last 1h swing, prior-day value-area edges, prior-day POC, 4h pivot zones, round numbers) x 4 events (touch, sweep-and-reclaim, acceptance = first close beyond, breakout-retest) x 3 horizons (15m, 1h, 4h), at least one cell's mean continuation-signed vol-standardised forward return differs from the same statistic on placebo levels (the same level shifted by +-0.5..1.5 daily sigma) after BH at 10% in llm_in_sample, and keeps its sign in clean_holdout."
    rationale: "R-PX-4 / R-PX-5 / H-BO1 / H-VZ* found levels near random-walk behaviour at 1h-1d on hourly data; intraday 5m first tests of session-scale levels are the remaining untested geometry."
    test: "First test of each level within its validity window, approach side fixed by the close before the window, events on 5m bars; continuation sign = direction of approach; touch measured from the level, other events from the event-bar close; real minus placebo difference with a day-clustered (Newey-West lag 2 over days) SE; BH over the 156 cells in-sample; survivors read once in the holdout (one-sided p, BH 10% among survivors)."
    success: "Supports iff >= 1 cell survives in-sample BH AND >= 1 survivor passes the holdout BH with the same sign; contradicts iff no cell survives in-sample BH, or no survivor keeps its sign in the holdout; else inconclusive."
    prior: 0.20
    family: intraday_geometry
    status: proposed
  H-GEO10:
    title: "A sweep-and-reclaim of the prior-day high or low reverses over the next hour (liquidity-sweep fade)"
    statement: "After a 5m bar trades beyond the prior UTC day's high (low) by >= 0.1 hourly sigma and closes back inside, the 1h continuation-signed return is below that of placebo levels."
    rationale: "Stop-run lore: stops above the prior high are taken and the move fails."
    test: "Grid cell PD_HL x sweep x 1h of H-GEO9 (named in advance, so not BH-adjusted); day-clustered NW t."
    success: "Supports iff real - placebo < 0 with t < -2 in llm_in_sample AND < 0 with one-sided p < 0.1 in clean_holdout; contradicts iff in-sample t >= 0 or the holdout sign is positive; else inconclusive."
    prior: 0.25
    family: intraday_geometry
    status: proposed
  H-GEO11:
    title: "Acceptance beyond the 30-minute opening range (Asia, London, US sessions) continues over the next 4 hours"
    statement: "After the first 5m close beyond the 30-minute opening range of a session, the 4h continuation-signed return exceeds that of placebo levels."
    rationale: "Opening-range breakout lore; H-TF3 contradicted it for equity perps, untested for crypto."
    test: "Grid cell OR30 x accept x 4h of H-GEO9 (named); per session reported."
    success: "Supports iff real - placebo > 0 with t > 2 in llm_in_sample AND > 0 with one-sided p < 0.1 in clean_holdout; contradicts iff in-sample t <= 0 or the holdout sign is negative; else inconclusive."
    prior: 0.20
    family: intraday_geometry
    status: proposed
  H-GEO12:
    title: "The first acceptance across the session VWAP continues over the next hour"
    statement: "After the first 5m close across the session (UTC day) VWAP, from 01:00 UTC on, the 1h continuation-signed return exceeds that of a placebo VWAP (the same curve shifted by +-0.5..1.5 daily sigma)."
    rationale: "VWAP as the institutional fair-value line: crossing it flips who is in profit."
    test: "Grid cell VWAP_S x accept x 1h of H-GEO9 (named)."
    success: "Supports iff real - placebo > 0 with t > 2 in llm_in_sample AND > 0 with one-sided p < 0.1 in clean_holdout; contradicts iff in-sample t <= 0 or the holdout sign is negative; else inconclusive."
    prior: 0.20
    family: intraday_geometry
    status: proposed
  H-GEO13:
    title: "Round numbers hold on the first touch over the next hour"
    statement: "Measured from the level, the 1h continuation-signed return after the first touch of a round number (multiples of 10^(floor(log10 P) - 1) nearest the day open) is below that of placebo levels."
    rationale: "Resting orders cluster at round numbers (Osler 2003 in FX)."
    test: "Grid cell ROUND x touch x 1h of H-GEO9 (named)."
    success: "Supports iff real - placebo < 0 with t < -2 in llm_in_sample AND < 0 with one-sided p < 0.1 in clean_holdout; contradicts iff in-sample t >= 0 or the holdout sign is positive; else inconclusive."
    prior: 0.25
    family: intraday_geometry
    status: proposed
  H-GEO14:
    title: "A sweep of the Asia box during the London morning reverses (the 'Judas swing')"
    statement: "A 5m sweep-and-reclaim of the 00:00-08:00 UTC high or low between 07:00 and 11:00 UTC has a 1h continuation-signed return below placebo."
    rationale: "ICT / session lore: London takes the Asian liquidity and reverses."
    test: "ASIA_BOX x sweep x 1h restricted to events 07:00-11:00 UTC (named); day-clustered NW t."
    success: "Supports iff real - placebo < 0 with t < -2 in llm_in_sample AND < 0 with one-sided p < 0.1 in clean_holdout; contradicts iff in-sample t >= 0 or the holdout sign is positive; else inconclusive."
    prior: 0.15
    family: intraday_geometry
    status: proposed
  H-GEO15:
    title: "Geometry effects depend on the v0 regime cell and session in a way that persists out of sample"
    statement: "For the H-GEO9 in-sample BH survivors (or, if none, the named cells H-GEO10..14), the real-minus-placebo effect differs across v0 cells and sessions (Wald p < 0.01 in-sample) and the in-sample cell ranking predicts the holdout ranking (Spearman > 0.3 over cells with >= 100 events in both segments)."
    rationale: "R-SYN-2 / R-MAP-1 / H-BOS2: regime maps tell where strategies lose; geometry might be regime-dependent too."
    test: "Per cell effects shrunk toward the pooled effect with w = episodes / (episodes + 10); Wald on the unshrunk cell effects with day-clustered SEs; Spearman across cells."
    success: "Supports iff Wald p < 0.01 in-sample AND holdout Spearman > 0.3 for the majority of the tested cells; contradicts iff the holdout Spearman <= 0 for the majority; else inconclusive."
    prior: 0.25
    family: intraday_geometry
    status: proposed
  H-GEO16:
    title: "A geometry rule is executable: positive net R after realistic costs, beating regime-matched random entries"
    statement: "For each rule built from an H-GEO9 in-sample survivor (or, if none survive, the 3 largest-|t| in-sample cells and the 5 named cells H-GEO10..14, labelled best-of-grid), selected among 16 exit variants (stop 1 or 2 hourly sigma, 2R limit target or none, time stop 1h or 4h, flat or hour-of-week-scaled stop) by purged expanding walk-forward on llm_in_sample, net R per trade is > 0 with a day-clustered 95% CI above 0 in the walk-forward stream, the deflated Sharpe over all variants tried is >= 0.95, PBO < 0.5, the holdout net R is > 0, and the rule beats regime-matched (same symbol, v0 cell, session, side) random entries with the same exits."
    rationale: "R-BOS-1: intraday breakouts lose to a ~15 bp round trip; an executable geometry edge must clear that."
    test: "Costs: pegged entry at the next 5m open + 1.3 bp, maker 2.0 bp; limit at the level 2.0 bp, filled only on a 1 bp trade-through; taker 5.5 bp + 2.0 bp slippage; stops taker with slippage, gaps fill at the open; limit targets maker 2.0 bp on a 1 bp trade-through; time exits taker; funding charged; worst-case intrabar ordering; latency arms 0 and 5 min (entry at the open of bar t+1 or t+2); sensitivity adding each alt's median half-spread to taker legs. Walk-forward test years 2023, 2024, 2025, 2026H1 (select on prior years, 1-day embargo); holdout = clean_holdout with the variant chosen on all of llm_in_sample."
    success: "Supports iff any rule meets every condition; contradicts iff no rule has walk-forward net R > 0 with CI above 0; else inconclusive."
    prior: 0.08
    family: intraday_geometry
    status: proposed
  H-GEO17:
    title: "(exploratory) Recent liquidation-cluster prices act as levels"
    statement: "Price bins (0.25%) holding the top trailing-24h liquidation notional above and below the price at each UTC hour, first touched within the next 24h, show a 1h continuation-signed return different from placebo."
    rationale: "Where forced flow already printed, liquidity is thin or replenished; the lake only has liquidations from 2026-11-08, so this is a holdout-only exploration."
    test: "Universe L symbols with >= 1000 liquidation prints in the lake; same event machine as H-GEO9 (touch, sweep, accept) at 1h; day-clustered t."
    success: "Supports iff |t| > 2 on >= 200 touch events; contradicts iff |t| < 1 on >= 200 events; inconclusive otherwise (expected, given 17 days)."
    prior: 0.15
    family: intraday_geometry
    status: proposed

  # ==== Market participants with machine learning (block PART; agent PART, registered 2026-11-25 ~22:35 UTC BEFORE any fit or
  # look at the reduced data). Code: src/ai_trader/research/participants.py; outputs data/research/participants/; report
  # research/reports/participants_2026-11-26.md. Universe BTCUSDT ETHUSDT SOLUSDT XRPUSDT DOGEUSDT (linear perps). Days: the 12
  # pre-cutoff micro_days dates (2025-08-31 .. 2026-06-21, llm_in_sample) + every UTC day 2026-10-06 .. 2026-11-24 (clean_holdout).
  # FIT = the 12 pre-cutoff days + 2026-10-06 .. 2026-10-29 (36 days); HELD = 2026-10-30 .. 2026-11-24 (26 days), read once.
  # Raw: public.bybit.com prints (taker side, size) + quote-saver ob200 (snapshot + delta), reduced to taker orders (same-ms
  # same-side print runs) and a 1 s book with in-bin maker flows (near-touch adds/removals <= 5 bp, best-level refills, L1 CKS OFI).
  # Every feature is point in time (book = 1 s state at or before the order / minute; trailing windows only; HMM forward filter
  # only). Holm within each hypothesis across its horizons. All public-tape types are TAKERS (aggressors): makers are seen only
  # through the book-state model. ----
  H-PART1:
    title: "Taker orders split into k >= 3 stable, auditable types (GMM on order traits)"
    statement: >-
      A full-covariance GMM on 11 robust-standardised (per symbol, FIT medians / IQR, clipped +-6) order-trait features
      (log10 notional, log notional / opposite L1 notional, log notional / opposite depth within 10 bp, log1p ticks crossed,
      log1p prints, log1p ms since previous order, log1p ms since previous same-side order, log1p orders in trailing 1 s and 10 s,
      log1p count of the previous 20 same-side orders with the exact same size, significant digits of the size), pooled over the
      5 symbols, with k chosen on FIT by the frozen rule (k in 2..10; candidates = k with mean pairwise bootstrap ARI >= 0.80 over
      10 bootstrap fits of 30k FIT orders scored on a common 20k FIT evaluation set; pick the minimum-BIC candidate on a 100k FIT
      sample; if no candidate, the max-ARI k) yields k >= 3 types; every type's share of orders on HELD days is within 5 pp of its
      FIT share; k-means (same k, same standardised features) agrees with the GMM at ARI >= 0.5. Types are named only after
      describing them (traits, notional share, time of day, markouts).
    rationale: "Retail clicks, child-order algos (clipping, regular cadence), sweepers and HFT takers should leave different size / aggression / timing footprints; the atx tape heuristics assume they do."
    test: "Seeded sample of 3,000 book-valid orders per FIT symbol-day (seed 20261125); BIC and bootstrap ARI as stated; HELD assignment by predict on every HELD order."
    success: "Supports iff the chosen k >= 3 with mean ARI >= 0.80 AND all HELD shares within 5 pp of FIT AND k-means ARI >= 0.5; contradicts iff no k >= 3 reaches mean ARI >= 0.60; else inconclusive."
    prior: 0.55
    family: participants
    status: proposed
  H-PART2:
    title: "Taker types differ in informedness: their 60 s mid-to-mid markouts differ"
    statement: >-
      For at least one H-PART1 type, the mean 60 s mid-to-mid markout (side x ln(mid(t + 60 s) / mid(t)) x 1e4, mid = 1 s book state
      at / before t and the first state at / after t + 60 s; per order, averaged per symbol-day) differs from the all-order mean of the
      same symbol-days by > 0.5 bp with day-clustered |t| > 3 on FIT and the same sign with |t| > 2 on HELD.
    rationale: "Informed vs uninformed flow is the participant distinction that matters for market makers and for following flow."
    test: "Per type, symbol-day differences (type minus all), t clustered by day; segments llm_in_sample / clean_holdout reported separately within FIT; 10 s markout reported as a descriptor."
    success: "Supports iff some type passes on FIT (|t| > 3, |diff| > 0.5 bp) and HELD (same sign, |t| > 2); contradicts iff no type has |t| > 2 on FIT; else inconclusive."
    prior: 0.65
    family: participants
    status: proposed
  H-PART3:
    title: "Participant-type signed flow and flow-state transitions predict forward 1 / 5 / 60 min returns beyond OFI, total taker imbalance and lagged returns"
    statement: >-
      On a 1-minute grid per symbol (rows from 01:00 UTC, labels inside the day), target = ln(mid(t+h)/mid(t)) / (sigma_t sqrt(h)),
      sigma_t = EWMA (half-life 30 min) of 1-min squared log mid returns, winsorised +-10. Baseline B = {L1 CKS OFI over the last 1 and
      5 min / trailing-60-min mean L1 notional, total taker imbalance (buy - sell)/(buy + sell) notional over 1 and 5 min, lagged
      standardised returns 1, 5, 60 min}. P = B + {per-type signed notional over 1 and 5 min / total taker notional of the window,
      per-type share of taker notional over 5 min, forward-filtered HMM state probabilities (K - 1 columns), state-change flag}.
      Pooled OLS; out-of-sample R^2 gain dR2 = (SSE_B - SSE_P) / sum(y^2).
    rationale: "If some participants are informed (H-PART2), their flow should carry information that the aggregate imbalance averages away."
    test: >-
      FIT: purged blocked CV (6 chronological blocks of FIT days, 1-day embargo each side), OOS dR2 by segment (llm_in_sample days,
      clean FIT days). HELD: fit on all FIT, score once; 95% CI and one-sided p by day-block bootstrap (2000, seed 20261125); Holm over
      the 3 horizons. Secondary (not in the criterion): logistic P(r > 0) at 5 and 60 min, Platt-calibrated on FIT-CV OOS scores,
      Brier skill vs B on HELD. GBM challenger (LightGBM depth <= 3, 300 trees, lr 0.05, min_data_in_leaf 500) only for horizons
      whose FIT-CV dR2 > 0 in both segments, admitted iff its HELD dR2 vs linear P has CI lower bound > 0.
    success: "Supports iff, for at least one horizon, HELD dR2 > 0 with Holm-adjusted p < 0.05 AND FIT-CV dR2 > 0 in both FIT segments; contradicts iff HELD dR2 <= 0 at all three horizons; else inconclusive."
    prior: 0.25
    family: participants
    status: proposed
  H-PART4:
    title: "Participant activity mix and flow states predict forward realised volatility beyond lagged RV"
    statement: >-
      Target = ln RV over (t, t+h], h = 5 and 60 min, from 10 s mid log returns. B_vol = {ln RV last 5 and 60 min, ln taker notional
      last 5 min minus its trailing-60-min mean, |lagged 1-min standardised return|, ln spread (last-minute mean of 1 s states)}.
      P_vol = B_vol + {per-type share of taker notional and of order count over 5 min, forward-filtered HMM probabilities, state-change
      flag}. Same OLS, CV, HELD, bootstrap and Holm (2 horizons) as H-PART3; dR2 relative to the FIT-mean forecast.
    rationale: "Sweepers and HFT bursts should precede volatility; the flow-state HMM is built to capture regime transitions."
    test: "As H-PART3 (dR2 = (SSE_B - SSE_P) / SST around the FIT mean)."
    success: "Supports iff at least one horizon has HELD dR2 > 0 with Holm p < 0.05 AND FIT-CV dR2 > 0 in both segments; contradicts iff HELD dR2 <= 0 at both; else inconclusive."
    prior: 0.45
    family: participants
    status: proposed
  H-PART5:
    title: "Participant features predict the adverse selection of passive fills beyond spread, volatility and recent adverse selection"
    statement: >-
      Target AS_h(t) = equal-weighted mean over taker orders in (t, t + 1 min] of side x (mid(tau + h) - first print price) / first
      print price x 1e4 (the loss of a tiny maker resting at the touch that the order hit), h = 10 s and 60 s, minutes with >= 5
      orders. B_as = {AS_10 of the last minute (known at t), AS_60 of the minute (t-2m, t-1m], ln spread, ln RV last 5 min, |total
      taker imbalance| 1 min, |OFI| 1 min}. P_as = B_as + {per-type share of orders and of notional over 5 min, per-type |signed
      imbalance| over 1 min, HMM probabilities, state-change flag}. Same protocol as H-PART3 (2 horizons, Holm; dR2 around the FIT mean).
    rationale: "A maker who knows which participants are active should quote less when the informed ones are."
    test: "As H-PART3."
    success: "Supports iff at least one horizon has HELD dR2 > 0 with Holm p < 0.05 AND FIT-CV dR2 > 0 in both segments; contradicts iff HELD dR2 <= 0 at both; else inconclusive."
    prior: 0.40
    family: participants
    status: proposed
  H-PART6:
    title: "Executable: the participant models make money after costs at our size on HELD"
    statement: >-
      Variants fixed now, using the P models fitted on FIT: (a) taker-directional for h = 5 and 60 min: trade the sign of the
      prediction when |prediction| > its FIT 95th percentile, enter at the touch of the 1 s state at t + 1 s (latency >= 1 s, harsher
      than 150-300 ms), exit at the touch at t + h, 5.5 bp fee per side, non-overlapping per symbol; (b) the same with a maker entry at
      the touch posted at t + 1 s, filled only if a taker order prints strictly through the limit within h/2 (else no trade), fee
      2 bp in + 5.5 bp out, plus a pegged-limit cost case 2.0 + 1.3 bp per side; (c) maker quote filter: a 1-lot quote at both touches
      in minutes whose predicted AS_60 is below the FIT median vs all minutes; P&L per fill = -(AS_60 of the fill) - 2 bp fee.
      Net bp per trade (per fill for c), day-block bootstrap CI on HELD.
    rationale: "Predictability that does not survive spread, fees and latency is not edge."
    test: "HELD only, once; Holm across the 5 variants (a5, a60, b5, b60, c); capacity reported as our notional vs median L1 depth and vs the signal-type flow."
    success: "Supports iff some variant has mean net > 0 with Holm-adjusted bootstrap p < 0.05; contradicts iff every variant has mean net <= 0; else inconclusive."
    prior: 0.12
    family: participants
    status: proposed
  H-PART7:
    title: "Cross-venue taker flow (Binance, OKX, Coinbase) adds to Bybit 5-min return prediction beyond Bybit participant features"
    statement: >-
      At each xvenue snapshot (data/journal/xvenue, 2026-11-15 .. 2026-11-24) for BTC ETH SOL XRP DOGE: target = Bybit standardised
      5-min forward return from the snapshot time; P = H-PART3 P features at the last full minute before the snapshot; X = P + {bn,
      ok, cb 1-min and 5-min taker delta / that venue's 5-min volume}. Fit on 2026-11-15 .. 2026-11-19, score on 2026-11-20 .. 11-24.
    rationale: "Binance is the price-discovery venue for most perps; Bybit flow types may only echo it."
    test: "OOS dR2 (X vs P), day-block bootstrap CI on the scored days (few days: descriptive weight)."
    success: "Supports iff dR2 > 0 with CI lower bound > 0; contradicts iff dR2 <= 0; else inconclusive."
    prior: 0.20
    family: participants
    status: proposed
  H-PART8:
    title: "Sanity: the unsupervised types line up with the atx tape heuristic labels"
    statement: >-
      On 2026-11-15 .. 2026-11-24 (tape-v1 journal), the type with the highest median ticks crossed is over-represented (>= 2x its
      base share of orders) among orders within +-1 s of SWEEP alerts of the same symbol, and the type with the highest median clip
      count is over-represented (>= 2x) inside ALGO_BUY / ALGO_SELL windows (first_ms .. last_ms) on the same side.
    rationale: "Heuristic labels are not ground truth, but a taxonomy that ignores them entirely would be suspicious."
    test: "Counts of HELD orders per type in the labelled windows vs base shares on the same symbol-days."
    success: "Supports iff both ratios >= 2; contradicts iff both < 1.2; else inconclusive."
    prior: 0.55
    family: participants
    status: proposed

  # ==== Stress test of every deterministic strategy in every scenario (block STRESS; agent STRESS; user request 2026-11-25
  # ~22:15 UTC "above all let's stress test every strategy in every scenario"; registered 2026-11-25 ~22:45 UTC BEFORE any
  # stress run). Code: src/ai_trader/research/stress.py (+ tests/test_stress.py); outputs data/research/stress/; report
  # research/reports/stress_test_2026-11-26.md. The LLM decision layer is NOT tested (CLAUDE.md principle 1): only the
  # deterministic generators, the desk setups as coded or specified and the live risk engine (config/risk.yaml live_small).
  #
  # FROZEN DESIGN (also in the diary "STRESS design frozen before results" and data/research/stress/design.json):
  # Stress units: the 17 registered strategies (tsmom, donchian_breakout, ema_stack, zscore_reversion, rsi_reversion,
  #   compression_breakout, funding_contrarian, oi_price_divergence, shock_regime, weekend_shock_follow, weekend_drift_fade,
  #   cme_gap_fill on 1h; geo_struct, geo_pivot_bo, geo_flag_bo on 4h; flow_momentum, cvd_divergence on BTCUSDT 1h flow_bars
  #   only, 2026-05-11+) + zoo_ensemble (4h) + desk setups: trend_4h (agent.session: 4h ema_stack |s| >= 0.3 at a 4h close,
  #   stop 1.5 x HAR daily sigma capped at 4 sigma_4h, TP 3R, pegged-limit entry, no TradFi-weekend entries, bracket exits,
  #   one position per symbol), shock_desk (agent.session shock candidates: market entry at the shock-bar close, structural
  #   stop/TP, stop cap 4 sigma_1h, min 0.5 sigma, continuation TP 2R, bracket exits), hs2_fade_blackout (reversal leg only,
  #   entry at the close of the bar AFTER the shock bar = the R-FLOW-2 60-min no-fade blackout, same structural levels,
  #   skipped if the TP or the stop was already crossed), hrb2 (post_cascade_study H-RB2 flush / arm / EMA20-cross logic and
  #   placement, time stop 120 h), setup_c_proxy (PLAN_2026-11-15 setup C on BTCUSDT / ETHUSDT 15m bars 2024-01+: sweep of
  #   the prior-72h low, 60-min wait, a 15m close back above the swept level within 24 h; pegged-limit long; stop = sweep
  #   low - 0.5 sigma_15m (cap 4, min 0.5); target = lowest confirmed 15m pivot high (4 bars each side) above the entry in
  #   the prior 72 h, else the 72h high; time stop 8 h. The spot-absorption and Coinbase-premium confirmations have no
  #   history in the lake and are DROPPED: this is a proxy, not setup C as specified), weekend MM quoters
  #   (mm_weekend_2026-11-21 replay results only, not re-run).
  # Universe L = trend_zoo_study.UNIVERSE (23 crypto perps), Bybit, market_frame(as_of = run time); BTC-PERPETUAL (Deribit
  #   1h, 2020-01+) only for the 2020-03-12/13 window. Signals on the full history, P&L split by entry date at
  #   research.knowledge_cutoff (llm_in_sample / clean_holdout).
  # Trade layer (generic, every signal strategy): enter at the bar close when flat and |s| >= 0.3 (the trend_4h desk
  #   threshold) in sign(s); exit at the close of the first bar with s * side <= 0 (may reverse on that bar if |s| >= 0.3);
  #   exchange stop at 4.0 x sigma_risk_next (per bar, strategy frequency; = the applied stop cap in
  #   data/models/risk/stop_cap.json) from the fill, checked on 1h bars (4h strategies walk the 1h path); after a stop-out
  #   no re-entry until the signal is flat or flips. No time exits. R = (d (exit - entry) - c_in entry - c_out exit) /
  #   (|entry - stop| + entry (c_in_base + c_out_base)) (the at-risk sizing budget; cost shocks change the numerator only).
  #   Base costs (live): entry pegged limit maker 2.0 + 1.3 bp (shock_desk / hs2: market 5.5 + 2.0), every exit taker
  #   5.5 + 2.0 bp; stop fills at the stop price.
  # Scenarios: S0 base; S1 slices of base trades by v0 cell at entry (1h regimes.label), TradFi weekend, NYSE holidays,
  #   funding windows (entry within +-1 h of 00/08/16 UTC), segment; S2 crisis windows (entry dates, inclusive):
  #   2020-03-09..03-20 (BTC Deribit only), 2021-05-12..05-26, 2021-12-01..12-31, 2022-05-05..05-20, 2022-06-10..06-25,
  #   2022-11-06..11-20, 2023-03-08..03-20, 2024-08-01..08-10, the 3 largest non-overlapping BTC 14-day close-to-close
  #   declines with the trough in 2025-01-01..2026-11-18 (window = trough - 14 d .. trough + 3 d), 2026-11-19..11-25;
  #   per window: sum R, max DD in R, worst trade, stop-gap slippage in R; S3 costs: fees x1.5 and x2 (maker and taker),
  #   slippage +5 / +10 / +25 bp per side, stop filled at the bar open when the bar opens through the stop (gap), stop
  #   filled at the NEXT bar open after the touching bar (stop_next_open), no exchange stop (signal exits only, sizing
  #   unchanged); S4 latency 1 / 5 / 15 min on entries and signal exits (fill = Brownian-bridge conditional mean between
  #   the open and close of the first 1h bar after the decision, log-linear in elapsed time; checked against BTC 5m bars);
  #   stops and targets are exchange-side (no latency); S5 parameters: every key parameter x0.5 / 0.8 / 1.2 / 1.5 one at a
  #   time (integers rounded, >= 1; lists scaled elementwise) plus the harness theta_in and stop_k, and 30 joint draws
  #   (each factor U(0.5, 1.5), seed 20261126), on universe D8 = agent.session.DEFAULT (BTC ETH SOL ADA AVAX LINK XRP DOGE)
  #   against the D8 base; CLIFF = a +-20% one-at-a-time change that makes mean net R <= 0 when the D8 base is > 0;
  #   S6 synthetic: 1000 one-year 1h paths (+2000-bar warm-up) per unit, 500 stationary block bootstrap (Politis-White on
  #   |r|, sim.resample) + 500 regime-switching (v0 cell chain), sources cycled over BTC ETH SOL XRP DOGE LINK full 1h
  #   history (no selection is made from synthetic results); bar-only units (positioning, flow, hrb2, setup_c_proxy n/a);
  #   S7 correlation: in down states (BTC 1h v0 cell R7 / R8 / R9 at that time) a stop-out closes every concurrent same-side
  #   open trade of the unit at its stop (-1R; rho -> 1, one-sided); S8 liquidity drought: mid / illiquid tiers (trailing
  #   30-day median daily turnover < 100M USD, point in time) pay spread x3 (extra = 2 x tier half-spread per side,
  #   half-spread = tier max_spread_bps / 2) and their stop exits slip sqrt(2) x tier stop_slip_bps (half depth,
  #   square-root impact) instead of 2 bp; S9 live risk engine: live_small applied to the unit's pooled chronological trade
  #   stream (1.30 USD per R, 2 USD worst case incl. tier stop slip, 20 entries per UTC day, 10 USD daily loss budget on
  #   realised + open worst cases, 3 open, 2 same side, 400 USD gross, tier notional caps 200 / 100 / 50, stop distance
  #   <= 10%; EV gate >= 0.10 only where a probability is defined: bracket setups with p = driftless first-passage null +
  #   documented prior edge (shock 0.05, trend 0.03, others 0); first come first served by entry time).
  # Metrics per unit x scenario: n, mean net R/trade with 95% CI (stationary bootstrap of entry days, mean block 5, 2000
  #   draws), hit rate, profit factor, max DD (R), CVaR5% per trade and per day, time under water, top-5 share; S9 adds
  #   P(daily stop hit per active day), P(>= 5 consecutive losers within 3 months), mean drawdown spell (days),
  #   P(3-month cumulative loss >= 25 / 50 / 100 USD) by stationary day bootstrap (mean block 5 days, 91 days, 5000 draws).
  # VERDICT RULES (H-STRESS0), on the base universe stream unless stated:
  #   FAILS    if mean net R/trade <= 0 in S0, or <= 0 under fees x1.5.
  #   FRAGILE  (if not FAILS) if any: G1 a +-20% one-at-a-time parameter change gives mean <= 0 (cliff, D8); G2 5-min
  #            latency mean <= 0; G3 one crisis window costs more than 20 R on the S9 live-engine stream; G4 +5 bp per
  #            side mean <= 0; G5 clean_holdout mean <= 0 with >= 20 holdout trades; G6 the S0 95% CI includes 0;
  #            G7 total net R without the 5 best trades <= 0.
  #   SURVIVES otherwise. The other scenarios are reported, not part of the verdict. Data-generated units (shock_regime,
  #   shock_desk, hs2_fade_blackout, hrb2: designed after seeing their evidence) carry the tag "historical = not evidence".
  #   Rule candidates (switch X off in cell Y) go to the report only, never to research/rules.yaml.
  # ----
  H-STRESS0:
    title: "Scorecard: each stress unit is robust (SURVIVES) under the frozen verdict rules"
    statement: "Recorded once per stress unit (segment pooled): SURVIVES -> supports, FRAGILE -> inconclusive, FAILS -> contradicts, with the rule(s) that fired."
    rationale: "One registered decision rule for robust, fixed before any stress number is seen."
    test: "Frozen design above; verdict rules F1/F2, G1..G7."
    success: "Per unit as stated; no aggregate claim."
    prior: 0.25
    family: stress
    status: proposed
  H-STRESS1:
    title: "Trend-family units keep net R > 0 under fees x1.5 and under +5 bp per side"
    statement: "For each of tsmom, ema_stack, donchian_breakout, compression_breakout, geo_struct, geo_pivot_bo, geo_flag_bo, zoo_ensemble, trend_4h: mean net R/trade > 0 under fees x1.5 AND under +5 bp slippage per side, in both segments."
    rationale: "R-PD-2: the trend family is one TSMOM bet with a positive in-sample loading; slow holding periods should keep costs small per R."
    test: "S3 on the base trade layer, per segment."
    success: "Supports iff >= 6 of the 9 units meet the statement in both segments; contradicts iff <= 2 do; else inconclusive."
