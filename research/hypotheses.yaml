  # ---- Break-of-structure breakout / momentum / trend family, intraday and swing, with limit orders and regimes (block BOS; user request 2026-11-15 ~18:10 UTC; registered before any test) ----
  # Family (pre-declared grid, frozen in a diary entry before results): structure = fractal swings (k in {2,3,5}) and Donchian/
  # DC pivots (n in {20,55}); signal = close beyond the last swing high/low (BoS), CHoCH (first break against prior structure),
  # and BoS with momentum confirmation (ROC / vol-scaled return > 1 sigma); timeframes intraday 5m/15m (hold <= 1 day) and
  # swing 1h/4h (hold <= 10 days); exits = opposite structure break, ATR trail (2.5-4 sigma, never tight: R-EXIT-2), or time.
  # Execution arms: market at next open (taker), pegged limit at the touch (R-EXE-1), limit at the broken level (retest,
  # cancelled after N bars; missed fills = 0 R). Costs: Bybit fees + measured slippage; universe L crypto (+ TradFi perps as
  # robustness), 2020-2026, segments split at the cutoff. Regimes: the v0 cell (pre-existing labels), plus vol tercile and
  # trend-strength tercile known at entry. Multiple testing: BH 10% across (variant x execution x regime) cells within each
  # segment, plus deflated Sharpe and PBO (CSCV) for every selection step.
  H-BOS1:
    title: "Some break-of-structure breakout variants have a regime-conditional edge net of costs"
    statement: "At least one (variant, execution arm, regime cell) combination has mean net R per trade > 0 that survives BH 10% in llm_in_sample AND has mean net R > 0 in clean_holdout for the same combination."
    rationale: "The user's view: trend / momentum / BoS ideas should not be discarded wholesale; they may have power in specific regimes. Unconditional versions were thin or failed (P3/P7, R-VBOS-*, R-AVOID-1, H-VB3)."
    test: "per-cell mean net R, week-clustered bootstrap; BH across cells; holdout check of the in-sample survivors only."
    success: "as stated; report how many cells survive and their holdout sign."
    prior: 0.25
    family: bos_regime
    status: proposed
  H-BOS2:
    title: "BoS gains are explosive in some regimes and detrimental in others (regime-conditional tail asymmetry)"
    statement: "The share of total net R coming from the top 5% of trades, and the mean net R, differ across regime cells: in at least one cell the right tail drives positive expectancy (top-5% share > 100% of the cell total) while in at least one other cell expectancy is negative with t < -2, in both segments."
    rationale: "Trend profits come from rare large moves (R-PD-2, EX1); the question is where those moves happen and where the strategy bleeds."
    test: "tail decomposition per cell; difference-in-means across cells with week-clustered SE; both segments."
    success: "both conditions in both segments."
    prior: 0.45
    family: bos_regime
    status: proposed
  H-BOS3:
    title: "Regime-conditional BoS performance is unstable over time"
    statement: "For the in-sample-best cells, the sign of mean net R flips in >= 1/3 of calendar half-years, and a structural-break test (CUSUM / Bai-Perron on the per-trade R series) finds a break at the 5% level."
    rationale: "The user asks whether the relationships are stable. Instability is the null worth testing directly (R-SYN-2: per-symbol selection is a coin flip)."
    test: "rolling half-year means; CUSUM and Bai-Perron on per-trade net R; report break dates and their alignment with regime shifts."
    success: "both conditions for the majority of the in-sample-best cells."
    prior: 0.55
    family: bos_regime
    status: proposed
  H-BOS4:
    title: "A walk-forward regime-switching allocator profits from the instability"
    statement: "Turning BoS variants on/off by a Bayesian posterior of their recent regime-conditional edge (conjugate normal on net R, prior = zero edge, forgetting factor chosen inside training windows only) earns a higher net Sharpe than (a) the static in-sample-best variant and (b) an equal-weight of all variants, in clean_holdout, with DSR > 0.95 in llm_in_sample over the allocator's own small grid."
    rationale: "The user asks if we can profit from instability: if edges move between regimes, an adaptive on/off rule may harvest them where static selection fails."
    test: "nested purged walk-forward; paired daily net P&L vs both baselines, NW t; DSR and PBO."
    success: "both differences > 0 in clean_holdout with t > 2 (or reported t), DSR > 0.95 in-sample."
    prior: 0.20
    family: bos_regime
    status: proposed
  H-BOS5:
    title: "Limit entries at the retest of the broken level beat market and pegged entries for BoS, counting missed breakouts"
    statement: "For BoS signals, a limit order at the broken level (cancelled after N bars, missed fills = 0 R) has a higher mean net R per signal than a pegged-touch limit and than a market order, in both segments, at the intraday and the swing timeframe."
    rationale: "The user wants limit-order execution; the retest entry saves cost and improves price but misses runaway breakouts, which are the explosive winners."
