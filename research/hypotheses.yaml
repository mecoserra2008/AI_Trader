  H-TVTP3:
    title: "Filtered-regime lead-lag rule on gold/silver 1h earns positive net R after costs"
    statement: "Per fold, regimes with the largest positive (negative) first-lag CCF asymmetry corr(s_{t+1},g_t) - corr(g_{t+1},s_t) are gold-leads (silver-leads). At each bar close t, if the one-step predictive probability of a leader regime j exceeds theta, hold the lagger for one bar in direction sign(A_j[lagger, leader] * y_leader,t); theta in {0.5,0.6,0.7,0.8,0.9} chosen per fold on fit data (max net mean R, >= 30 trades, flat if none > 0; last fit row purged). Net R = sign * y_{t+1} - cost / sigma_{t+1|t}."
    rationale: "The trading use of the regimes; costs: desk model = entry pegged 2.0 + 1.3 bp, exit taker 5.5 bp + half measured spread (config/risk.yaml paper_entry); all-taker and all-pegged reported."
    test: "Walk-forward on M1h; comparators: regime-free lead-lag from the pooled VAR (lagger = larger |cross coefficient|, |y_leader| threshold in {0,0.5,1,1.5,2} chosen the same way) and random signs at the same entry times (2000 draws). Deflated Sharpe with n_trials = 40 (5 thresholds x 8 specs)."
    success: "Supports iff in clean_holdout (>= 30 trades) mean net R/trade > 0 with HAC t >= 2 under desk costs, above the regime-free mean, random-sign p < 0.05, DSR >= 0.95, and llm_in_sample mean > 0; contradicts iff clean_holdout mean net R/trade <= 0 under desk costs; else inconclusive."
