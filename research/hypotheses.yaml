    title: "A walk-forward regime classifier tells trend from mean-reversion periods"
    statement: "A logistic model on the regime features, refit monthly on an expanding window, predicting the sign of next-7-day (trend ensemble - mean-reversion ensemble) net P&L per symbol, has out-of-sample rank IC > 0; gating (trade the trend ensemble only when P(trend wins) > 0.5, else flat) raises OOS Sharpe vs ungated."
    rationale: "Previous single-feature switches failed (H-RG1, H-AU3); a combination of vol and directional-vol features, judged purely out of sample, is the fair final test of the regime-switch idea."
    test: "monthly walk-forward; IC = Spearman of predicted prob vs realised (trend - MR) next-7d P&L, clustered by week; gated vs ungated Sharpe."
    success: "OOS IC > 0 with t > 2 AND gated Sharpe > ungated in-sample; both same sign in holdout."
    prior: 0.30
    family: regime
    status: proposed

  H-TR4:
    title: "Directional efficiency predicts trend profitability (single feature)"
    statement: "Symbol-weeks in the top tercile of the 14-day efficiency ratio have higher next-7-day trend-ensemble net P&L than the bottom tercile."
    rationale: "The simplest 'is it trending?' measure. If even this has no signal, regime gating is unlikely to help."
    test: "tercile difference, clustered by week, NW t."
    success: "difference > 0 with t > 2 in-sample; > 0 in holdout."
    prior: 0.40
    family: regime
    status: proposed

  # ---- Weekend skewed passive quoting (registered 2026-11-08 01:55 UTC BEFORE the first run; forward-only) ----
  H-MM1:
    title: "Bearish-skewed weekend passive quoting earns more than maker fees and adverse selection"
    statement: "atx mm with config/mm.yaml as of 2026-11-08 02:30 UTC (SOL/XRP/ADA perps; minimum-lot post-only quotes; ask r*(1+0.35 sigma_1h), bid r*(1-0.80 sigma_1h) around a reservation price shifted by inventory (0.5 sigma at cap) and order flow (0.3 sigma at full imbalance); toxicity widening/pausing; swing-level snapping; non-chasing requotes (0.3 sigma drift after 60 s); profitable inventory (>= 0.6 sigma) cleared passively at the touch; caps 30/12/60 USD; loss limit 1.5 USD; 45-min passive wind-down) earns positive net P&L (fees, funding, wind-down slippage included) per unit of traded notional over TradFi weekends."
    rationale: "Requested by the user on a bearish macro view (risk-off, weekend, sideways) for slow-bleeding tokens. Priors against: VIP0 maker fee is +2 bps (ETH_BMNR found book-informed MM needs a -1.2 to -1.4 bps rebate), the bearish skew is a directional bet (direction not forecastable, P5), adverse selection on post-only fills is untested (H-AS1), and levels showed no directional value (H-VZ/H-GT/H-AU); here they only push quotes outward. Prior for: weekend vol is lower (H-W1); quotes several bps wide of a 1-tick book on liquid names earn real spread when they fill on noise rather than on information."
    test: "per run, from data/mm/<env>-<run>/summary.json + executions.json + journal fill markouts: net P&L / traded notional (bps); markouts of each fill at 1, 5 and 30 min (flow_3s mids); decompose into spread capture, adverse selection, inventory P&L, fees. Mainnet runs only count (demo fills are unrealistic for passive orders). Verdict only after >= 4 weekends and >= 200 fills."
    success: "net P&L per traded notional > 0 with t > 2 over runs; mean 5-min markout-adjusted spread capture > maker fee."
    prior: 0.15
    family: microstructure
    status: proposed
    notes: "Config history: v0 (01:55, SOL/DOGE/LTC, 2:1 lot skew, 4 bp requotes) demo smoke tests only; v1 (02:30) after user direction (minimum size, no chasing, flow/toxicity/levels, passive profit clearing, slow-bleed book). First mainnet run 2026-11-08 ~02:45 -> 12:00 UTC, 100 USD budget (caps well below it). One run cannot decide anything."

