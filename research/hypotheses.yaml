  # ---- Multi-scale analogs of the current market (block ANA; user request 2026-11-15 ~18:00 UTC; registered before any search) ----
  H-ANA1:
    title: "A multi-scale analog ensemble forecasts BTC's next 24h/72h move size better than log-HAR-t, and its direction better than the base rate"
    statement: "For each historical hour t (walk-forward, analogs drawn only from data before t minus a 7-day embargo), the 20 nearest analogs by a pre-declared multi-scale distance (normalised log-price path shape at 6h/24h/72h/7d/30d plus a state vector: realised-vol percentile, drawdown from the 30d high, regime cell, funding percentile, OI change, weekend flag) give (a) an |r| forecast for the next 24h and 72h with lower QLIKE than log-HAR-t x weekday, and (b) a sign forecast with Brier skill > 0."
    rationale: "The user wants to rank past periods by similarity to now and see what followed. Before trusting what the analogs did, the method must show it has any forecasting value."
