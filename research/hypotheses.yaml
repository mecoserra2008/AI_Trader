    title: "TVTP MS-VAR one-step predictive log score beats CTP, VAR and rolling VAR on held-out gold/silver hourly data"
    statement: "On M1h walk-forward rows, the mean per-row log score difference TVTP minus baseline is > 0 vs CTP, VAR and RVAR."
    rationale: "The user's claim: context z drives leadership switches, so time-varying transitions should forecast better than constant ones and than single-regime VARs."
    test: "Diebold-Mariano on per-row log score differences, Newey-West HAC t, per segment."
    success: "Supports iff in clean_holdout the mean difference > 0 with HAC t >= 2 vs all three baselines and > 0 vs all three in llm_in_sample; contradicts iff in clean_holdout the difference vs CTP is <= 0, or vs VAR or RVAR it is < 0 with t <= -2; else inconclusive."
