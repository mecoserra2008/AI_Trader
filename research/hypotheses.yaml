  H-WS08-10:
    title: "Macro predictors: rising real yields and a rising dollar predict lower, and a positive NDX day predicts higher, subsequent crypto returns"
    statement: "Slope on the 5d change in DFII10 (< 0), the 5d log change in DTWEXBGS (< 0) and the last NDX daily log return (> 0) at 1d-30d, daily origins (macro known at obs_date + 1 day 00:00 UTC)."
    rationale: "Cross-asset liquidity channel; TVTP found the macro drivers unstable; macro_narrative cells were inconclusive."
    test: "grid cells ry / usd / ndx."
    success: "supports iff any of these cells has the registered sign with RW p < 0.05, IVX p < 0.05 and holdout sign kept; contradicts iff all have IVX p > 0.10 or the significant ones have the wrong sign; else inconclusive."
    prior: 0.12
    family: predict
    status: proposed

  H-WS08-11:
    title: "Fear & Greed is a contrarian predictor at 7d-30d"
    statement: "Slope on the alternative.me Fear & Greed index (value for day D known at D 01:00 UTC, so the D-1 value at the D 00:00 origin) is negative at 7d and 30d."
    rationale: "Sentiment contrarian lore; H-NEWS4 found no next-day direction from news sentiment."
