  # ---- Vector-candle OPEN levels on 4h, "active until taken" (user's chart practice; registered 2026-11-07 BEFORE testing) ----
  # Vector (PVSRA climax): volume_t >= 2 * mean(volume_{t-10..t-1}) OR volume_t*range_t >= max(volume*range over t-10..t-1).
  # Level L = open_t; active from bar t+1 until the first bar whose [low, high] contains L (the first touch = "taken").
  # Race from the touch bar's close on 4h closes: reject = close back beyond L by +1 sigma on the side price came from,
  #   before closing 1 sigma through L (sigma = sigma_risk_next * close at the touch bar, price units).
  # Driftless null per event: p0 = clip((x0 - (L - s*sigma)) / (2*sigma), 0, 1) in the approach-side orientation,
  #   x0 = touch close (accounts for wick touches that already closed back on the original side).
  # Control levels: opens of non-vector candles from which price moved >= 1 sigma away (same side logic) before returning.

  H-VZ1:
    title: "Active vector-open levels hold on the first touch"
    statement: "On the first touch of an active 4h vector-open level, the rejection rate exceeds the per-event driftless null by more than 3 percentage points."
    rationale: "User's practice (chart 2026-11-07): vector opens are where aggressive liquidity started a violent move; resting interest is defended there until it's taken."
    test: "23-symbol 4h universe; mean(reject - p0) per event, t-stat clustered by touch timestamp."
    success: "excess > 3pp with t > 2 in-sample; > 0 in holdout."
    prior: 0.40
    family: levels
    status: proposed

  H-VZ2:
    title: "Vector opens are better levels than ordinary candle opens"
