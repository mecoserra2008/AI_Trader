    title: "BTC forward returns differ by yield-curve regime: bear flattening weak, bull steepening strong"
    statement: "BTC's next 5- and 20-day log returns (vol-scaled) are lower after bear-flattening days than unconditional, and higher after bull-steepening days, 2017-2026."
    rationale: "The user's macro view: the current bear flattening tightens liquidity; a later bull steepening on central-bank intervention would be very good for crypto."
    test: "regime-conditional mean vol-scaled returns, week-clustered bootstrap; segments split at the cutoff; Holm over the 2 x 2 (regime x horizon) cells."
    success: "bear-flattening mean < 0 and bull-steepening mean > 0, each with Holm p < 0.05 in llm_in_sample and the same signs in clean_holdout."
    prior: 0.30
    family: macro_narrative
    status: proposed
