    rationale: "What players did on 2026-11-14/15: long liquidations ~$100M on Bybit BTC in four waves, then funding negative and OI rebuilding while price kept falling, with short-liquidation bursts on the +3.6% hour. Funding-contrarian signals failed unconditionally (R-AVOID-1) and in R5/R7 (R-MAP-5); post-flush is untested."
    test: "difference in mean 24h and 72h vol-scaled returns, pattern vs no pattern among flush events, block bootstrap; segments."
