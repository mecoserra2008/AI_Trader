    rationale: "The user sees the market looking for a rebound after the 2026-11-14/15 cascade; capitulation flushes are the classic rebound setup, but our direction tests have failed and liquidation clusters should not be faded within 60 min (R-FLOW-2)."
    test: "event-level net R, block bootstrap by week, segments; paired difference vs regime-matched random entries."
