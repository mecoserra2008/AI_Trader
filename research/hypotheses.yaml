  H-WS08-9:
    title: "The 25-delta risk reversal (30d) predicts subsequent returns (two-sided)"
    statement: "Slope on Deribit rr25_30 (daily 08:00 fit, PIT to the next origin) is non-zero at 1d-30d for BTC/ETH (ALT uses BTC)."
    rationale: "Option skew as a sentiment / crash-demand gauge; data end 2026-10-09 so the holdout is about 3 months."
    test: "grid cells skew."
    success: "supports iff any skew cell has RW p < 0.05, IVX p < 0.05 and holdout sign kept; contradicts iff all have IVX p > 0.10; else inconclusive."
