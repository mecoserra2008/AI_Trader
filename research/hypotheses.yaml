    test: "Same subset, cells and statistics as H-WMQ-12 (7 core names x the last 8 HOLD weekends 2026-10-03 .. 11-22; every core name has gate rows; a symbol without rows would be 'gate unknown': excluded and counted). Gate rows apply from their ts. B0 pull-only and pull + widen reported, not scored."
    success: "Supports iff the paired mean > 0 with the CI above 0 in all four cells; contradicts iff the paired mean < 0 with the CI below 0 in the primary cell; else inconclusive."
