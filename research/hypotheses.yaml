  # ---- Options after compression, the user's call + short deep-ITM-put structure, and tail-profit continuation (block OPX) ----
  # User idea 2026-11-14 ~16:40 UTC. Registered before any options data is downloaded or any test is run. BTC first (ETH as robustness).
  # Compression detector (pre-declared): BTC 7-day realised vol (hourly log returns) in the bottom quintile of its trailing 365-day
  # history AND 30-day ATM implied vol (deribit_svi iv_atm_30, or DVOL) in the bottom tercile of its trailing 365 days; declustered
  # (one event per 14 days). Entries at the next 08:00 UTC Deribit fixing. Prices: Deribit option trade history (history.deribit.com,
  # public) where available, else Black-76 on the lake's daily smile summary (ATM / 25d RR / 25d BF at 7/30/90 days); costs = half the
  # quoted spread per leg, or 0.0003 BTC per option + 0.0125% of notional fee, whichever is larger. Segments split at the cutoff.
  H-OPX1:
    title: "After a volatility compression, long BTC option volatility pays: realised vol beats implied"
    statement: "Buying the ATM straddle with the first expiry >= 21 days at a compression event and holding 14 days (both delta-unhedged and daily delta-hedged variants) earns a higher net P&L, as % of premium, than the same trade entered on all days."
    rationale: "Log vol mean-reverts (half-life ~107 h, BELIEFS FL1); if implied vol does not price the expansion after compression, long volatility earns it without a direction view."
    test: "conditional minus unconditional mean net P&L, block bootstrap by week; both variants; segments."
    success: "difference > 0 with the 95% CI above 0 in llm_in_sample and > 0 in clean_holdout, for the delta-hedged variant."
    prior: 0.25
    family: options_compression
    status: proposed
  H-OPX2:
    title: "Selling a deep-ITM put alongside a long call beats getting the same delta from a perp"
    statement: "At compression events, the user's structure (long 25-delta call + short put with delta about -0.85, same expiry >= 21 days, held 14 days or to expiry) earns a higher net P&L than long the same call plus long BTC perp sized to the same initial net delta (funding included); the difference is the short put's time value minus its wider spread."
    rationale: "The short deep-ITM put is mostly a synthetic long future; it only adds value if its time value (theta plus the variance risk premium) exceeds its extra costs. Also reported: net vega of each structure (whether the put leg reduces volatility dependence)."
    test: "paired per-event difference, block bootstrap by week; segments; also all-days (unconditional) version."
    success: "difference > 0 with the 95% CI above 0 in both segments."
    prior: 0.30
    family: options_compression
    status: proposed
  H-OPX3:
    title: "Extreme unexpected profits are followed by more profit in the same direction (tail continuation)"
    statement: "When BTC's move since entry over horizon H (1, 3, 7 days) exceeds the q-th percentile of the ex-ante predictive distribution at entry (log-HAR-t x weekday, known at entry), the next H-period return, signed in the direction of the move and in sigma units, is positive, and increases with q across q = 50, 75, 90, 95, 99."
    rationale: "The user's exit idea ('a good profit is an extremely unexpected amount of profit'; take it off slowly) is right only if tail moves mean-revert; if they continue, scaling out early gives up the convex days (H-PD6, EX1)."
    test: "for each H and q: mean signed forward return in sigma units for events above q (both tails, signed), NW / weekly-cluster t; monotonicity across q by a trend test; segments; ETH as robustness."
    success: "supports continuation if the mean is > 0 with t > 2 at q >= 90 for >= 2 of 3 horizons in both segments and the trend across q is positive; contradicts (i.e. reversal) if < 0 with t < -2 under the same conditions."
    prior: 0.30
    family: options_compression
    status: proposed
  H-OPX4:
    title: "Scaling out with limit orders after an extreme profit beats holding to the strategy's own exit"
    statement: "For the trend book's trades (and the H-OPX1/2 option trades), exiting a third of the position at each of the first three closes where open profit exceeds the 95th percentile of the ex-ante distribution (limit orders at the touch, filled only if price trades through) earns a higher net R per trade than holding to the strategy's own exit."
    rationale: "Direct test of the user's exit plan; H-OPX3 says whether it should help, H-PD6 / R-EXIT-2 say tight exits cost the convex days."
    test: "paired per-trade difference in net R, weekly-cluster bootstrap; segments."
    success: "difference > 0 with the 95% CI above 0 in both segments."
    prior: 0.25
    family: options_compression
    status: proposed

  # ---- Execution style (user preference 2026-11-14 ~18:10 UTC; registered before any test) ----
  H-EXE1:
    title: "Limit entries at the touch beat market entries for our signals, after missed fills"
    statement: "For the paper book's signals (shock_regime and trend_4h candidates, and later vecopen signals), entering with a limit order joining the best bid (buys) / ask (sells), re-pegged for up to N minutes and cancelled if unfilled, gives a higher mean net R per signal than a market order at the signal time, counting unfilled signals at 0 R and including the missed winners."
    rationale: "User preference: always enter with limits, close to the touch when the move is fast. The ob200 replay found adverse selection near the touch (R-MMR-1), and limit entries fill more often on trades that go against you, so the saving in spread and fees must exceed the cost of missed winners."
    test: "replay each historical signal through at-match on real ob200 days (pro-rata queue), paired per signal, N in {1, 5, 15} min pre-declared; day-clustered bootstrap."
    success: "difference > 0 with the 95% CI above 0 for at least one N, both sleeves pooled."
    prior: 0.35
    family: execution
    status: proposed
  H-MMR3:
    title: "Quoting only in low-vol sideways phases, and stopping before jump risk rises, turns market making positive"
    statement: "Running the quoter only while short-horizon vol is in its bottom tercile and the 4h range is narrow (pre-declared: |4h return| < 1 sigma and no shock in the last 6 h), and stopping when the jump intensity (Hawkes / field P(jump)) rises above its median, earns a higher held-out net P&L per symbol-day than quoting all day at the same width."
    rationale: "User idea: market make a little in quiet sideways markets, then stop to prepare for the next jump; adverse selection should be lowest in those phases."
    test: "atx mm-replay on the H-MMR days (same fit/held-out split), gated vs ungated, paired per symbol-day, pro-rata queue."
    success: "gated minus ungated > 0 with the 95% CI above 0 on held-out days, in at least one group."
