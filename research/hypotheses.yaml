# Hypothesis registry: pre-registered BEFORE testing. Results are appended to
# research/hypotheses_results.jsonl (never edited). Statuses: proposed | testing | supported |
# rejected | inconclusive. `prior` = subjective P(hypothesis holds) before seeing our data.
#
# Protocol (docs/RESEARCH_PROTOCOL.md):
#   1. State the hypothesis, the test, the success criterion and the prior here, first.
#   2. Test on `llm_in_sample` (before research.knowledge_cutoff). Claude has read papers and forum
#      lore about this period, so in-sample "confirmation" is weak evidence.
#   3. Confirm on `clean_holdout` (after the cutoff), which Claude has never seen. It grows every day.
#   4. Log every test (including failures) in the results file and the diary.

hypotheses:

  H-W1:
    title: Weekend volatility is lower than weekday volatility
    statement: Realised vol over the TradFi weekend window (Fri 17:00 ET -> Sun 18:00 ET) is below the vol implied by the Friday-close σ̂ (rv_ratio < 1) for most weekends.
    rationale: TradFi venues closed -> fewer informed/institutional participants -> less price discovery.
    test: median rv_ratio across weekends and per-symbol; sign test vs 1.
    success: median rv_ratio < 0.9 and > 60% of weekends below 1, in both segments.
    prior: 0.85
    family: calendar
    status: proposed

  H-W2:
    title: Weekend drift without activity reverts by Monday
    statement: Weekend moves with |wk_z| >= 1 on below-baseline turnover (vol_ratio < 0.9) are partially reversed between the CME reopen and Monday's NYSE close.
    rationale: Thin-liquidity drift carries no information; TradFi reopening restores normal price discovery.
    test: mean of sign(wk_z) * post-weekend return (reopen -> Monday NYSE close) in σ units in that bucket; NW t-stat; strategy weekend_drift_fade.
    success: mean signed continuation < 0 with t < -2 in-sample and same sign in holdout.
    prior: 0.45
    family: calendar
    status: proposed

  H-W3:
    title: Weekend information shocks continue into the TradFi session
    statement: Weekend moves with |wk_z| >= 2 on above-baseline turnover (vol_ratio >= 1.2) continue between the CME reopen and Monday's NYSE close.
    rationale: Information that arrived while TradFi was closed is absorbed (ETF flows, CME basis, equity-linked buyers) only after it reopens.
    test: mean signed continuation in σ units; strategy weekend_shock_follow.
    success: mean > 0 with t > 2 in-sample and same sign in holdout.
    prior: 0.40
    family: calendar
    status: proposed

  H-W4:
    title: CME gaps fill more often than a random walk implies
    statement: The Friday CME-close price is revisited between the Sunday reopen and Monday's NYSE close more often than the driftless reflection-principle baseline 2·(1 − Φ(d/√bars)).
    rationale: Widely held trader lore ("CME gaps always fill"). Likely partly a selection artefact; tested against the proper null.
    test: observed fill rate vs mean baseline probability across weekends; binomial z.
    success: observed - baseline > 5pp with z > 2 in-sample and same sign in holdout.
    prior: 0.30
    family: calendar
    status: proposed

  H-W5:
    title: The Monday NYSE open is a volatility and inflection point after eventful weekends
    statement: After weekends with |wk_z| >= 2, absolute returns in the first 3 hours after Monday's NYSE open exceed the same window on other weekdays, and the direction is related to the weekend move.
    rationale: First moment TradFi can price weekend information.
    test: ratio of mean |z| in the window (eventful weekends vs other days); sign correlation with wk_z.
    success: ratio > 1.3 with bootstrap CI excluding 1.
    prior: 0.55
    family: calendar
    status: proposed

  H-W5b:
    title: Monday NYSE-open moves after eventful weekends, measured in pre-weekend sigma
    statement: After weekends with |wk_z| >= 2, mean |return| over the 09:00-11:59 ET bars on Monday, divided by sigma_fri, exceeds the same quantity on other weekdays (each divided by that day's pre-session sigma).
    rationale: Same as H-W5. Registered after H-W5 was found to be biased by the EWMA absorbing the weekend shock (diary 2026-11-07); counts as an additional trial.
    test: ratio of means with bootstrap CI over weekends.
    success: ratio > 1.3 with CI excluding 1, in-sample; ratio > 1 in holdout.
    prior: 0.55
    family: calendar
    status: proposed

  H-R1:
    title: Trend strategies earn only in trend cells
    statement: tsmom / ema_stack / donchian_breakout have positive shrunk mean P&L in R1, R2, R7, R8 and non-positive in R5, R6.
    rationale: Momentum needs persistent drift; ranges chop trend followers.
    test: by_regime on pooled symbols, 1h bars.
    success: sign pattern holds for >= 2 of 3 trend strategies in both segments.
    prior: 0.60
    family: regime
    status: proposed

  H-R2:
    title: Mean reversion earns in range cells and loses in trends
    statement: zscore_reversion / rsi_reversion have positive shrunk mean P&L in R4, R5, R6 and negative in R2, R3, R8, R9.
    rationale: Mirror image of H-R1.
    test: by_regime on pooled symbols, 1h bars.
    success: sign pattern holds for both strategies in both segments.
    prior: 0.50
    family: regime
    status: proposed

  H-S1:
    title: Large price shocks continue in high-vol trend cells and revert in ranges
    statement: After |z| >= 4 shocks, signed forward returns are positive (continuation) when the cell at shock time is R3/R9 and negative (reversal) when it is R4/R5.
    rationale: Shocks inside established moves are liquidations / forced flows (continuation); shocks inside ranges are liquidity air pockets (reversal).
    test: shock_study, horizons 4/24/72 h, pooled symbols.
    success: sign pattern at h = 24 with |t| > 2 for the pooled split.
    prior: 0.40
    family: shock
    status: proposed

  # ---- registered 2026-11-07 AFTER the first in-sample run: data-generated, so only the holdout counts ----

  H-S2:
    title: Shocks into calm markets continue; shocks in liquidation regimes reverse
    statement: After |z| >= 4 shocks, the 24h signed forward return is positive when the cell at shock time is a low-vol cell (R1, R4, R7) and negative when it is R9.
    rationale: Found in-sample (R1 +0.14 t3.8, R4 +0.09 t3.3, R9 -0.23 t-4.5; diary 2026-11-07). A large move into a quiet market is new information (repricing). A large move inside a liquidation regime is forced flow that exhausts.
    test: shock_study, h = 24 bars on 1h, pooled; holdout only.
    success: holdout signs match for R4 and R9 (the cells with the most events), and the pooled low-vol mean > 0.
    prior: 0.50
    family: shock
    status: testing
    data_generated: true

  H-T1:
    title: Hourly deviations from trend continue rather than revert
    statement: zscore_reversion (fade > 2 sigma deviations from a 48-bar EMA) has negative GROSS P&L on 1h bars across the universe.
    rationale: Found in-sample (gross -1.5 risk units x100 per active bar). Consistent with positive gross P&L of the trend strategies.
    test: gross (pre-cost) mean P&L per active bar, pooled; holdout only.
    success: holdout gross mean < 0.
    prior: 0.60
    family: regime
    status: testing
    data_generated: true

  H-S3:
    title: Vol state at shock time decides continuation vs reversal
    statement: After |z| >= 4 shocks, the 24h signed forward return is > 0 when vol_state == low (R1, R4, R7) and < 0 when vol_state is normal or high (R2, R3, R5, R6, R8, R9).
    rationale: Sharpened from the H-S2 holdout check (2026-11-07), where every normal/high-vol cell reversed. Discovered on the holdout, so it may ONLY be tested on data after test_from.
    test: shock_study on events with event_ts >= test_from.
    success: both signs hold with >= 30 events per side.
    prior: 0.45
    family: shock
    status: testing
    data_generated: true
    test_from: "2026-11-08"

  # ---- order flow (registered 2026-11-07, BEFORE any flow_3s data existed: all data is clean holdout) ----

  H-F1:
    title: "L1 order-flow imbalance explains contemporaneous and predicts short-horizon mid moves"
    statement: "Summed OFI (normalised by average L1 depth) over 1 min has a positive slope on the same-minute mid return (R2 > 0.2 for BTC/ETH perps), and the 1-min OFI EMA has positive predictive slope for the next 1-5 min return."
    rationale: "Cont, Kukanov & Stoikov (2014, arXiv 1011.6402) - price impact is linear in OFI. Contemporaneous fit is near-mechanical; the predictive part is the real test."
    test: "OLS with HAC SEs per symbol on flow_1m, pooled across symbols by time-clustered means."
    success: "contemporaneous R2 > 0.2 and predictive t > 2 for at least half the Tier-A perps."
    prior: 0.55
    family: flow
    status: proposed

  H-F2:
    title: "Depth imbalance beyond the touch adds information over L1"
    statement: "Banded OBI within 10-25 bps predicts the next 1-5 min mid return with incremental R2 over obi_l1 and OFI."
    rationale: "Deeper resting liquidity reflects slower, more informed intent than the touch, which is dominated by HFT quote flicker."
    test: "nested OLS (L1 vs L1 + banded), out-of-sample by day."
    success: "incremental OOS R2 > 0 on > 60% of days for Tier-A symbols."
    prior: 0.40
    family: flow
    status: proposed

  H-F3:
    title: "Spot-vs-perp taker-flow divergence predicts the perp"
    statement: "When spot taker delta (EMA, standardised) disagrees in sign with perp taker delta, the perp's next 5-60 min return follows spot."
    rationale: "Spot buying is unlevered and harder to fake. Perp flow carries more leveraged, short-horizon speculation. Divergence = leverage-driven moves that spot doesn't confirm."
    test: "event study on divergence episodes (|z| > 1.5 both, opposite sign), signed forward returns, by regime cell."
    success: "mean signed forward return > 0 with t > 2 at 15 or 60 min."
    prior: 0.45
    family: flow
    status: proposed

  H-F4:
    title: "Flow regimes differ on weekends (TradFi closed)"
    statement: "On TradFi weekends, the joint distribution of (delta z, OBI, OFI z) has lower dependence between flow and subsequent returns (smaller OFI impact slope) and thinner books (lower depth_25) than on weekdays."
    rationale: "Links H-W1 (lower weekend vol) to microstructure: fewer informed participants, thinner liquidity, more noise flow."
    test: "impact slope and depth by tradfi_weekend flag; copula dependence (Kendall tau) by flag."
    success: "weekend depth_25 lower AND weekend OFI impact slope per unit depth different from weekday (CI excludes equality)."
    prior: 0.60
    family: flow
    status: proposed

  H-W6:
    title: "Weekend crypto moves confirmed by weekend-traded TradFi perps continue"
    statement: "When the weekend crypto move (wk_z) has the same sign as the weekend move of Bybit's equity-index / ETF perps (e.g. QQQ, SOXL, NVDA basket) and both are large, the crypto move continues from the Sunday reopen to Monday's NYSE close; unconfirmed moves revert."
    rationale: "H-W3 failed using price/turnover alone because it couldn't tell information from thin-book drift. Bybit TradFi perps trade through the weekend (307/310 traded on a Saturday), so a joint crypto + equity-perp move is a direct sign of macro information arriving while TradFi venues are closed."
    test: "weekend_outcomes joined with the TradFi-perp basket weekend return (in its own Friday sigma units); signed post-weekend z by confirmed / unconfirmed bucket. Needs a TradFi-perp history backfill (bars) first."
    success: "confirmed bucket mean signed post z > 0 and unconfirmed < 0, difference t > 2 in-sample; same signs in holdout."
    prior: 0.40
    family: calendar
    status: proposed

  # ---- from the review of prior projects (2026-11-07; research/notes/SYNTHESIS_prior_projects.md) ----

  H-X1:
    title: "Close-confirmed structural stops beat resting stops on 1h"
    statement: "For long/short entries with structural stops beyond 1h pivots, exiting only when a 1h bar CLOSES beyond the stop (plus a wide resting catastrophe stop at 2x the distance) yields higher net mean R than a resting stop triggered by any intrabar touch."
    rationale: "BACKTEST_TREND_FOLLOWING pre-registered test: resting stops hurt (dSharpe -0.24, p=0.01) because 1h stop touches revert within the hour. Directly relevant to our bracket orders (at-exec uses resting SL)."
    test: "On Bybit BTCUSDT 5m (2020-2026, imported) simulate both stop policies for the same entries (donchian_breakout / ema_stack on 1h), costs included, R per trade; paired comparison."
    success: "paired mean R difference > 0 with t > 2 in-sample; same sign in holdout; catastrophe-stop tail (worst R) no worse than -2.5R."
    prior: 0.50
    family: execution
    status: proposed

  H-X2:
    title: "Trend edge lives at 4h/1d, not 1h"
    statement: "Net (after costs) risk-unit P&L of ema_stack and donchian_breakout is higher at 4h and 1d than at 1h across the 23-symbol universe."
    rationale: "Prior project: 1h cells were 74% of variance and ~0 net (costs 7-10%/yr). Our 1h playbook: tsmom loses all edge to turnover. Consistent evidence from two independent setups."
    test: "playbook() at 1h, 4h, 1d; compare pooled ALL-cell net mean per unit risk-time (scale per-bar P&L to per-day)."
    success: "4h and 1d per-day net > 1h per-day net for both strategies in-sample; same ordering in holdout."
    prior: 0.60
    family: regime
    status: proposed

  H-X3:
    title: "High trailing realised vol predicts weaker trend returns"
    statement: "The cross-sectional/time-series percentile of 20-day realised vol negatively predicts the next 10-day net return of trend strategies (rank IC < 0)."
    rationale: "Prior project OOS: IC -0.19 (p=.003) for a trend book. Suggests vol-axis conditioning beyond vol-scaling."
    test: "rank IC of RV20 percentile vs next-10d strategy P&L, pooled by time; strategies tsmom/ema_stack/donchian at 4h."
    success: "IC < -0.05 with t < -2 in-sample; negative in holdout."
    prior: 0.45
    family: regime
    status: proposed

  H-W7:
    title: "Weekend variance risk premium: implied vol overprices the TradFi weekend"
    statement: "Realised variance over the TradFi weekend window (Fri 17:00 ET -> Sun 18:00 ET), divided by the variance implied by Friday 08:00 UTC 7-day ATM IV over the same calendar time, is lower than the same ratio for equal-length weekday windows (Tue 17:00 ET -> Thu 18:00 ET, implied from Tue 08:00 UTC)."
    rationale: "H-W1 (weekend RV ~0.77x Friday-implied, supported) + prior project's pre-registered finding that Friday-sold weekly options beat other entry days (BTC t 3.1, ETH t 3.6). Options price calendar time; weekends deliver less."
    test: "imported Deribit SVI atm_7 + Bybit 1h bars; mean log ratio weekend minus weekday, clustered by week."
    success: "difference < 0 with t < -2 in-sample for BTC and ETH; same sign in holdout."
    prior: 0.65
    family: calendar
    status: proposed

  H-S4:
    title: "Post-jump volatility contracts quickly"
    statement: "After |z| >= 5 shocks, realised vol over the next 24h decays toward its pre-shock level with a half-life under 12h, i.e. the EWMA sigma overstates next-day vol after jumps."
    rationale: "Prior project's jump-regime work: vol contraction half-life ~5h after jumps. If true, EWMA/GARCH sizing after shocks is too conservative and post-shock reversal (H-S2/S3) trades are under-sized."
    test: "event study on BTC 5m (imported) and 1h universe: realised vol in hours 1-24 after the jump vs sigma_next at the jump; fit decay."
    success: "half-life < 12h and realised/forecast ratio over 24h < 0.8, in-sample and holdout."
    prior: 0.55
    family: shock
    status: proposed

  H-F5:
    title: "Order-flow signals pay as entry timing, not as standalone taker strategies"
    statement: "For entries generated by slower strategies (4h/1d), delaying a passive limit entry until 3 s OBI/OFI favours the trade side reduces entry cost / adverse selection by >= 30% vs immediate entry, without lowering fill rate below 80%."
    rationale: "Prior project: ETH OBI IC 0.198 at 1 s (OOS, 3 days) but unprofitable as taker (11 bps round trip) and as maker unless rebates. Flow carries information at horizons too short to pay costs alone."
    test: "paper-execution simulation on flow_3s once >= 30 days are collected."
    success: "median entry slippage vs decision mid improves >= 30% with fill rate >= 80%."
    prior: 0.45
    family: execution
    status: proposed

  H-TP1:
    title: "Stock perps drift off-hours and revert at the US cash open"
    statement: "Bybit stock/ETF perps' moves between the NYSE close and the next NYSE open (including weekends) partially revert during the first 2 hours of the cash session."
    rationale: "Off-hours perp prices are set by crypto-native traders without access to the underlying's liquidity; the cash open re-anchors them. From ETH_BMNR_PROJECT's BMNR perp observations."
    test: "flow_3s / Bybit index vs last price for the 13 TradFi perps being collected; signed reversal at the open."
    success: "mean signed reversal > 0, t > 2 across names, after >= 6 weeks of collection."
    prior: 0.45
    family: calendar
    status: proposed

  H-X2b:
    title: "Trend edge lives at 4h/1d, not 1h (scale-free re-test)"
    statement: "The cross-symbol average annualised Sharpe of daily-aggregated net P&L for ema_stack and donchian_breakout is higher at 4h and 1d than at 1h."
    rationale: "H-X2 used per-day P&L in bar-risk units, which is not comparable across frequencies (a 1h position carries ~sqrt(24)x the daily risk of a 1d one). Registered after seeing H-X2's invalid result; counts as an extra trial."
    test: "per symbol: sum net P&L per UTC day, annualised Sharpe; average across the 23 symbols; per segment."
    success: "4h and 1d Sharpe > 1h Sharpe for both strategies in-sample; same ordering in holdout."
    prior: 0.60
    family: regime
    status: proposed

  H-X2c:
    title: "4h is the trend sweet spot (beats 1h); 1d is not better"
    statement: "Cross-symbol mean annualised Sharpe of daily net P&L is higher at 4h than at 1h for ema_stack and donchian_breakout."
    rationale: "Seen in BOTH segments of the H-X2b test (2026-11-07), which failed only because 1d underperformed. Discovered on the holdout, so it is only testable on data after test_from."
    test: "same as H-X2b, restricted to event_ts >= test_from."
    success: "4h > 1h for both strategies over >= 90 days."
    prior: 0.60
    family: regime
    status: testing
    data_generated: true
    test_from: "2026-11-08"

  # ---- positioning strategies (hypotheses written in the strategy specs before data existed; formalised 2026-11-07 BEFORE running) ----

  H-P1:
    title: "Crowded funding fades work where crowding unwinds (funding_contrarian)"
    statement: "funding_contrarian has positive shrunk mean net P&L in its expected cells R3, R6, R9 and positive pooled (ALL) mean at 4h."
    rationale: "Strategy spec prior (positioning.py): extreme funding against a trailing 30-day z with price extended the same way = crowded positioning that unwinds."
    test: "playbook 4h, strategy_by_cell, 23 symbols."
    success: "mean_shrunk > 0 in >= 2 of R3/R6/R9 and ALL mean > 0, in-sample; ALL mean > 0 in holdout."
    prior: 0.35
    family: positioning
    status: proposed

  H-P2:
    title: "Rising open interest predicts upward pressure (oi_price_divergence)"
    statement: "oi_price_divergence (long-only by construction) has positive pooled net P&L at 4h and beats its own exposure-matched buy-and-hold (mean P&L per active bar > mean forward return per bar of the same symbols)."
    rationale: "Strategy spec: new longs drive continuation and new shorts get squeezed. Long-only design means a positive result could just be beta; hence the exposure-matched comparison."
    test: "playbook 4h strategy_by_cell ALL; compare with mean fwd_ret/sigma_next over all bars (risk-unit buy-and-hold)."
    success: "ALL mean > buy-and-hold mean with NW t > 2 in-sample; same sign in holdout."
    prior: 0.30
    family: positioning
    status: proposed

  # ---- vol tool validations (registered 2026-11-07 BEFORE building the tools) ----

  H-V1:
    title: "Jump-robust EWMA forecasts variance better than plain EWMA"
    statement: "An EWMA (lambda 0.94) fed with returns winsorised at +/-4 sigma_prev has lower mean QLIKE loss for the next-24h cumulative variance than the plain EWMA, pooled over the 23-symbol 1h universe, and its realised/forecast ratio after |z| >= 5 jumps is closer to 1 (H-S4 found 0.73)."
    rationale: "H-S4: one jump inflates the plain EWMA for days while realised vol decays with a 2-3 h half-life."
    test: "QLIKE = V/F - log(V/F) - 1 at every 24th bar (non-overlapping 24h windows); paired difference robust - plain, NW t; post-jump ratio median."
    success: "mean QLIKE difference < 0 with t < -2 in-sample, same sign in holdout; post-jump median ratio in [0.85, 1.15]."
    prior: 0.65
    family: vol
    status: proposed

  H-V2:
    title: "Weekend scaling of sigma improves variance forecasts that span TradFi weekends"
    statement: "Scaling the per-bar forecast variance by m^2 for future bars inside the TradFi weekend window (m = causal per-symbol estimate shrunk to a 0.6 prior) lowers mean QLIKE for 24h windows that overlap the weekend, without worsening windows that don't (they're unaffected by construction)."
    rationale: "H-W1 (weekend RV ~0.77x Friday sigma-hat) and H-W7 (weekend RV/implied 0.2-0.45x)."
    test: "same QLIKE design on windows with >= 12 weekend bars; paired difference (robust+weekend) - robust, NW t."
    success: "difference < 0 with t < -2 in-sample, same sign in holdout."
    prior: 0.75
    family: vol
    status: proposed

  H-V1b:
    title: "Bias-corrected robust EWMA forecasts variance better than plain EWMA"
    statement: "The robust EWMA (winsorised at 4 sigma) multiplied by a slow causal bias factor b = EWMA_0.999(r^2) / EWMA_0.999(x_clipped^2) has lower mean QLIKE than the plain EWMA for 24h windows, and post-jump realised/forecast median within [0.85, 1.15]."
    rationale: "H-V1 failed because winsorising biases variance down (in-sample weekday windows: median realised/forecast 1.05). The slow factor restores the long-run level without letting single jumps back in. Designed from in-sample diagnostics only; counts as an extra trial."
    test: "same design as H-V1."
    success: "same as H-V1."
    prior: 0.55
    family: vol
    status: proposed

  # ---- vector candles, liquidity crunches, vol clustering (registered 2026-11-07 BEFORE any test) ----
  # Vector candle (1h): range_sig = ln(high/low)/sigma_prev >= 3 AND vol_rel = turnover / median(turnover, prior 168 bars) >= 2
  #   AND body = |close-open|/(high-low) >= 0.6. Direction d = sign(close-open). Zone = body [min(o,c), max(o,c)].
  #   "Thin" = vol_rel / range_sig in the bottom 20% of its prior-168-bar distribution. Events declustered over 24 bars.

  H-VC1:
    title: "Vector candles continue in their direction"
    statement: "After a vector candle, the signed forward return d*ln(c_{t+h}/c_t)/(sigma_prev*sqrt(h)) is positive at h = 4 and 24 bars, pooled over the 23-symbol 1h universe."
    rationale: "A vector candle is aggressive liquidity-taking that sweeps resting orders: momentum ignition / forced flow that often keeps going."
    test: "event study, NW t across events clustered by timestamp; also split by vol_state at the event."
    success: "mean signed z > 0 with t > 2 at h = 24 in-sample; same sign in holdout."
    prior: 0.45
    family: microstructure
    status: proposed

  H-VC2:
    title: "Swept zones get revisited more than a random walk implies"
    statement: "Price trades back to the vector candle's zone midpoint within 72 bars more often than the driftless reflection-principle baseline 2*(1 - Phi(d / sqrt(h))), d = distance from the close to the midpoint in sigma_prev units."
    rationale: "The thin print leaves an inefficiently priced area ('imbalance' / 'fair value gap' lore). Tested against the proper null, like H-W4."
    test: "observed revisit rate minus mean baseline per event; t over events clustered by timestamp."
    success: "excess > 5pp with t > 2 in-sample; same sign in holdout."
    prior: 0.35
    family: microstructure
    status: proposed

  H-VC3:
    title: "Swept zones act as support/resistance on the first revisit"
    statement: "On the first return of price to the vector zone's near edge (the close side of the body), price rejects (moves 1 sigma away from the zone before 1 sigma into it) more often than the symmetric first-passage null of 0.5."
    rationale: "Participants who missed the move defend the zone; liquidity rebuilds there. Lore claims zones act as S/R."
    test: "first touch within 168 bars; race between +1 sigma rejection and -1 sigma penetration on 1h closes (sigma = sigma_prev at the touch)."
    success: "rejection rate > 0.55 with binomial z > 2 in-sample; > 0.5 in holdout."
    prior: 0.35
    family: microstructure
    status: proposed

  H-VC5:
    title: "Vector candles backed by one-sided aggressor flow continue; balanced ones revert"
    statement: "Among vector candles on BTC/ETH with flow bars, those with aligned taker imbalance (sign(buy-sell) = d and |buy-sell|/(buy+sell) >= 0.2) have higher 24-bar signed forward return than unaligned ones."
    rationale: "True sweeps are aggressor-driven; a big range without one-sided flow is a liquidity air pocket (book gap), which reverts."
    test: "flow_bars 1h (180 days of BTC/ETH); difference in mean signed z, aligned minus unaligned."
    success: "difference > 0 with t > 2 pooled across segments (sample is small); report per segment."
    prior: 0.45
    family: microstructure
    status: proposed

  H-VC4:
    title: "Vol clusters after vector candles (unlike pure jumps)"
    statement: "Realised variance over the 24 bars after a vector candle exceeds the robust_bc forecast made at its close (median realised/forecast > 1.05, bootstrap CI excluding 1), whereas after equal-|z| non-vector jumps it does not."
    rationale: "H-S4: pure jumps decay fast. Volume-driven sweeps signal a liquidity event (forced flow, deleveraging) that keeps vol elevated."
    test: "1h universe; ratio sqrt(realised var / forecast var), vector vs matched non-vector |z| >= 3 bars."
    success: "vector median ratio > 1.05 (CI excludes 1) and > the non-vector median, in-sample; same ordering in holdout."
    prior: 0.50
    family: vol
    status: proposed

  H-LC2:
    title: "Illiquidity spikes predict vol that the forecast misses"
    statement: "When Amihud illiquidity ILLIQ = |ret| / turnover has log z-score >= 2 vs its trailing 30-day distribution, realised variance over the next 24 bars exceeds the robust_bc forecast (median ratio > 1.05)."
    rationale: "Liquidity crunches (thin books per unit of trading) precede vol bursts: same flow, bigger moves."
    test: "1h universe event study; bootstrap CI of the median ratio; compare with all bars."
    success: "median ratio > 1.05 with CI excluding 1 in-sample; > 1 in holdout."
    prior: 0.45
    family: vol
    status: proposed

  H-VCL1:
