  # ---- Event response (registered 2026-11-08 12:30 UTC, forward-only: CPI reactions since 2022 are in my training data) ----
  H-EV1:
    title: "BTC's CPI-window return has the opposite sign of the core CPI surprise"
    statement: "On US CPI release days, the BTC log return from the bar before the release to 16:00 UTC is negative when core CPI m/m exceeds the published consensus and positive when it is below; |return| is larger when |surprise| >= 0.1 pp."
    rationale: "In the current regime (headline CPI 4%, December hike ~77% priced, BTC~QQQ hourly corr 0.65) inflation surprises move hike odds, which move long-duration assets. Historical CPI-day vol is 1.4x normal (1.7x in 2022-23), so the window carries information; whether its sign is predictable from the surprise is the question."
    test: "forward from 2026-11-10: record consensus (two public previews, before the release), actual, BTC/ETH/QQQ window returns; sign agreement over releases; needs >= 12 releases for a verdict."
    success: "sign agreement >= 75% over >= 12 releases with |surprise| > 0; and mean |return| higher for |surprise| >= 0.1 pp."
    prior: 0.45
    family: macro_event
    status: proposed
