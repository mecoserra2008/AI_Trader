  rationale: "Cross-asset liquidity channel; TVTP found the macro drivers unstable; macro_narrative cells were inconclusive."
  test: "grid cells ry / usd / ndx."
  success: "supports iff any of these cells has the registered sign with RW p < 0.05, IVX p < 0.05 and holdout sign kept; contradicts iff all have IVX p > 0.10 or the significant ones have the wrong sign; else inconclusive."
