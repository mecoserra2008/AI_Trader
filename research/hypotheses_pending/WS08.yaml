# ---- WS08 PREDICT (+ core of WS09 XSECT and WS18 MACRO), specification program 2026-11-27. Registered 2026-11-26 ~23:55 UTC
# BEFORE any fit. Code: src/ai_trader/research/ws08_predict.py. Design: diary "WS08 design frozen before results".
# Common design for H-WS08-1..14 (the predictor grid):
#   targets BTC, ETH (Bybit perps) and ALT (equal-weight basket of the other 21 long-history universe-L perps), log returns
#   over h in {1h, 4h} (hourly origins) and {1d, 7d, 30d} (daily origins at 00:00 UTC), divided by the ex-ante EWMA sigma
#   x sqrt(h) (house rule: vol-standardised). Predictors as-of known_ts <= origin: funding (24h mean), funding percentile
#   (trailing 365 d), perp-index basis, Deribit 30d term basis, OI 24h (4h) log change, long/short account ratio, Coinbase
#   premium raw and USDT-adjusted, stablecoin 30d growth z, DVOL level, DVOL change, VRP = (DVOL/100)^2 - trailing 30d RV,
#   25d risk reversal (30d), 5d change in 10y real yield, 5d dollar log change, last NDX daily return, Fear & Greed.
#   Per cell: OLS slope per 1 sd of x, Newey-West t (lag h + auto), Hodrick (1992) 1B t, Stambaugh bias correction,
#   IVX Wald (Kostakis-Magdalinos-Stamatogiannis 2015, long-horizon version for h > 1 base period), day-block bootstrap
#   (60-day blocks, B = 999) and Romano-Wolf step-down over ALL grid cells jointly (FWER 5%). Fit segment llm_in_sample
#   (origin < 2026-07-01 and target window closed before it); clean_holdout = origins >= 2026-07-01, read once.

H-WS08-1:
  title: "WS08 grid: at least one point-in-time predictor x target x horizon cell predicts vol-standardised returns after proper inference and multiplicity"
  statement: >-
    Among all registered predictor x {BTC, ETH, ALT} x {1h, 4h, 1d, 7d, 30d} cells, at least one has an in-sample slope with Romano-Wolf
    adjusted p < 0.05 (day-block bootstrap, all cells jointly), IVX Wald p < 0.05, Hodrick |t| > 1.96 when h > 1 base period, and the
    same slope sign in the clean holdout.
  rationale: "Earlier positioning / fundamentals 'supports' (H-P1, H-FU2 holdout) used single-cell t-stats with overlapping 30d targets and persistent regressors; the correct inference has never been applied jointly."
  test: "ws08_predict grid; RW step-down with bootstrap-standardised slopes; IVX; Hodrick 1B; holdout sign."
  success: "supports iff >= 1 cell meets all four conditions; contradicts iff no cell has RW p < 0.10 in-sample; else inconclusive. Holdout: sign of each surviving cell's slope (inconclusive if < 30 non-overlapping obs)."
  prior: 0.15
  family: predict
  status: proposed

H-WS08-2:
  title: "Funding level and its 365-day percentile predict lower subsequent returns (crowding unwinds) at 1d-30d"
  statement: "Slope of the vol-standardised forward return on funding (24h mean) and on the funding percentile is negative for BTC, ETH and ALT at 1d, 7d and 30d."
  rationale: "Crowded-long funding is the most quoted positioning signal; H-P1 (funding_contrarian strategy) contradicted in-sample and 'supported' in the holdout on sign only."
  test: "grid cells fund / fund_pct; NW, Hodrick, IVX, RW."
  success: "supports iff any of these cells has slope < 0 with RW p < 0.05 and IVX p < 0.05 and holdout sign < 0; contradicts iff all in-sample slopes have IVX p > 0.10 or the significant ones are positive; else inconclusive."
  prior: 0.20
  family: predict
  status: proposed

H-WS08-3:
  title: "Perp-index basis and the Deribit 30d term basis predict lower subsequent returns"
  statement: "Slope on the 24h mean perp premium ln(last/index) and on the annualised 30d futures basis implied by Deribit options is negative at 1h-30d (BTC, ETH; ALT uses BTC term basis)."
  rationale: "Basis is the leverage-demand price; rich basis = crowded longs; overlaps funding, tested separately because it is observed continuously."
  test: "grid cells basis / tbasis."
  success: "as H-WS08-2 with these cells."
  prior: 0.15
  family: predict
  status: proposed

H-WS08-4:
  title: "Open-interest change predicts the direction of subsequent returns (two-sided)"
  statement: "Slope on the 24h (daily origins) or 4h (hourly origins) log change in open interest is non-zero at some horizon for BTC, ETH or ALT."
  rationale: "H-P2 (oi_price_divergence) failed in both segments as a strategy; the raw predictive slope with persistent-regressor-robust inference has not been tested."
  test: "grid cells doi."
  success: "supports iff any doi cell has RW p < 0.05, IVX p < 0.05 and holdout sign kept; contradicts iff all doi cells have IVX p > 0.10; else inconclusive."
  prior: 0.10
  family: predict
  status: proposed

H-WS08-5:
  title: "The Bybit long/short account ratio is a contrarian predictor"
  statement: "Slope on log(long share / short share) (latest 4h print) is negative at 4h-7d."
  rationale: "Retail account ratios are read as contrarian; available 2021-08 .. 2026-11-07 for the 23 long-history perps."
  test: "grid cells ls."
  success: "as H-WS08-2 with ls cells (sign < 0)."
  prior: 0.15
  family: predict
  status: proposed

H-WS08-6:
