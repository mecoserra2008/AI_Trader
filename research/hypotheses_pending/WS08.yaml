H-WS08-11:
  title: "Fear & Greed is a contrarian predictor at 7d-30d"
  statement: "Slope on the alternative.me Fear & Greed index (value for day D known at D 01:00 UTC, so the D-1 value at the D 00:00 origin) is negative at 7d and 30d."
  rationale: "Sentiment contrarian lore; H-NEWS4 found no next-day direction from news sentiment."
  test: "grid cells fng."
  success: "as H-WS08-2 with fng cells at 7d/30d."
