  rationale: "US-spot demand lore; H-XV2 (forward, 30-min trigger) is still collecting; this is the historical PIT version (public hourly candles)."
  test: "grid cells cbp_raw / cbp_adj."
  success: "supports iff any of these cells has slope > 0, RW p < 0.05, IVX p < 0.05 and holdout sign > 0; contradicts iff all have IVX p > 0.10 or the significant ones are negative; else inconclusive."
