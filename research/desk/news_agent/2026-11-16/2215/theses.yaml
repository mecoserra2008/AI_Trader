      MSTRUSDT's log return minus BTCUSDT's, from 2026-11-16 22:15 UTC to 2026-12-01 00:00 UTC, is negative.
    mechanism: >-
      The same as T-NEWS-20261115-2: passive MSCI trackers must sell by the Nov 30 close (JPM est. ~$2.8B).
      Something new works against it. Strategy keeps buying: 485 BTC for $33.4M, plus $228M of STRC preferred
      buybacks (Bitcoin Magazine, 11-16 13:38). Since round 1, MSTR is +2.9% vs BTC +0.5% (Bybit 22:14), so the
      relative move went against the claim.
