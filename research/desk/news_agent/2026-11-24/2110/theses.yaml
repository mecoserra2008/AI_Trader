theses:
  - id: T-NEWS-20261124-1
    component: event_vol
    title: "Holiday-thin, expiry-heavy tape: BTC stays inside [57,000, 62,500] through Fri 11-27 21:00 UTC (P 0.45)"
    author: news_agent
    created_ts: 2026-11-24T21:10:00Z
    claim: >-
      Bybit BTCUSDT (59,735 at 21:10) trades neither at or below 57,000 nor at or above 62,500 between creation and
      2026-11-27 21:00 UTC. The window covers Wednesday's 13:30 data dump (Q3 GDP second estimate, October PCE, durable
      goods, claims), the 19:00 Beige Book, Thanksgiving Thursday (NYSE shut), Friday's NYSE half-day, the 08:00 Deribit
      monthly expiry (111.8k BTC, ~$6.7B) and the tariff announcement the WSJ expects "as soon as this week".
    mechanism: >-
      The band is -4.7% / +4.5% (log). Holiday liquidity thins books, and the 40+ hour gap in ETF trading removes the
      US spot bid (CryptoSlate). Thin books make cascades in either direction more likely, the way the Saturday 03:00
      bar did. Against that, R-VOL-1-style holiday quiet (untested for holidays; HC-NEWS-20261124-10) argues for a
      narrower range.
    direction: neutral
    direction_note: "A range claim. Score on `resolution` (first passage), not the theses.py neutral scorer."
    assets: [BTCUSDT]
    horizon_days: 3
    probability: 0.45
    base_rate: >-
      Daily sigma ~2.8% (DVOL 53.7 / sqrt(365)), so the 3-day sigma is ~4.9%. Driftless single-barrier touch
      probabilities are ~0.35 down and ~0.36 up, about 0.62 for either, so ~0.38 for neither. Raised to 0.45 for
      holiday damping (US cash shut Thu, half-day Fri), which R-VOL-1 suggests is plausible for TradFi-closed windows.
    resolution:
      event: "Bybit BTCUSDT 1m low > 57000 AND 1m high < 62500 over [2026-11-24T21:10Z, 2026-11-27T21:00Z]"
      also_record: ["which side broke first and when", "realised vol Thu 11-26 vs the robust forecast (feeds HC-10)"]
    trigger: on_create
    proxies:
      - {id: btc_above_57k, series: "lake:BTCUSDT", transform: level, op: ">", value: 57000}
      - {id: btc_below_62_5k, series: "lake:BTCUSDT", transform: level, op: "<", value: 62500}
    invalidation:
      any:
        - {series: "lake:BTCUSDT", transform: level, op: "<=", value: 57000}
        - {series: "lake:BTCUSDT", transform: level, op: ">=", value: 62500}
    status: active
    watch: ["Wed 13:30 GDP / PCE / durables / claims", "Wed 19:00 Beige Book", "Fri 08:00 Deribit 27NOV26 expiry", "tariff announcement (WSJ)"]
    links: [R-VOL-1, R-VOL-2, R-VOL-28, R-PX-12, R-NEWS-5]

