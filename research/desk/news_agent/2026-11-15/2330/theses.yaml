    created_ts: 2026-11-15T23:30:00Z
    claim: >-
      XAUUSDT (3886.47 at 23:32 UTC, inside the 3881-3899.53 confluence) trades at or below 3777.97 (7d VAL) before it
      trades at or above 3951.03 (untouched 4h leg), and does so before 2026-11-20 20:00 UTC.
    mechanism: >-
      Real 10y yields are at p96 and the broad dollar at p99 (tradfi_week.md). Retail sales (Tue), the 20y auction and
      the minutes (Wed) can push real yields higher (theses a / d). Late reclaim longs pay +28% annualised funding (p88).
      Oil's fade lowers the inflation impulse, which works the other way.
    direction: short
    direction_note: "First-passage claim; score on `resolution`."
    assets: [XAUUSDT]
    horizon_days: 5
    probability: 0.33
    base_rate: >-
      Driftless P(down level first) from 3886.47 = ln(3951.03/3886.47) / ln(3951.03/3777.97) = 0.37. About 10-15% of
      paths touch neither level in 5 days (daily ATR 77), giving ~0.33. The narrative adds no tested edge (R-MAC-1,
      R-MAC-3), so no uplift.
    resolution:
      event: "first touch of <= 3777.97 precedes first touch of >= 3951.03, within [created_ts, 2026-11-20T20:00Z]; neither = false"
    trigger: on_create
    proxies:
