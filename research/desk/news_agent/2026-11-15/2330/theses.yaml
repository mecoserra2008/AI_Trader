      - {id: xau_1d_down, series: "lake:XAUUSDT", transform: logret_1, op: "<", value: 0.0}
      - {id: real_yield_up_5obs, series: "fred:DFII10", transform: chg_5, op: ">", value: 0.0}
      - {id: dollar_up_5obs, series: "fred:DTWEXBGS", transform: chg_5, op: ">", value: 0.0}
    invalidation:
      any:
        - {series: "lake:XAUUSDT", transform: level, op: ">=", value: 3951.03, note: "daily close at or above the untouched 4h leg"}
    status: active
    watch: ["Mon 07:00-12:00 UTC: no commodity entries (R-TF-6)", "retail sales Tue 13:30", "20y auction Wed 18:00", "FOMC minutes Wed 19:00"]
    links: [T-USER-20261115-a, T-USER-20261115-d, R-TF-6, R-PX-4, R-MAC-1, R-MAC-3]
